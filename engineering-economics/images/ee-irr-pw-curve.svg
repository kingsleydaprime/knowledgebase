<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" width="560" height="360" role="img">
<title>Present worth of a 500 naira investment returning 300, 300 and 200 plotted against the interest rate from 0 to 40 percent: the curve falls from 300 at 0 percent and crosses zero at about 30 percent, the internal rate of return, with the 15 percent target rate marked to its left</title>
<rect width="100%" height="100%" rx="8" fill="#ffffff"/>
<line x1="90.0" y1="30.0" x2="90.0" y2="290.0" stroke="#cbd2d9" stroke-width="0.8"/>
<text x="90.0" y="306.0" font-size="11" fill="#374151" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">0%</text>
<line x1="197.5" y1="30.0" x2="197.5" y2="290.0" stroke="#cbd2d9" stroke-width="0.8"/>
<text x="197.5" y="306.0" font-size="11" fill="#374151" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">10%</text>
<line x1="305.0" y1="30.0" x2="305.0" y2="290.0" stroke="#cbd2d9" stroke-width="0.8"/>
<text x="305.0" y="306.0" font-size="11" fill="#374151" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">20%</text>
<line x1="412.5" y1="30.0" x2="412.5" y2="290.0" stroke="#cbd2d9" stroke-width="0.8"/>
<text x="412.5" y="306.0" font-size="11" fill="#374151" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">30%</text>
<line x1="520.0" y1="30.0" x2="520.0" y2="290.0" stroke="#cbd2d9" stroke-width="0.8"/>
<text x="520.0" y="306.0" font-size="11" fill="#374151" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">40%</text>
<line x1="90.0" y1="290.0" x2="520.0" y2="290.0" stroke="#cbd2d9" stroke-width="0.8"/>
<text x="84.0" y="294.0" font-size="11" fill="#374151" text-anchor="end" font-weight="normal" font-family="system-ui, sans-serif">-100</text>
<line x1="90.0" y1="225.0" x2="520.0" y2="225.0" stroke="#cbd2d9" stroke-width="0.8"/>
<text x="84.0" y="229.0" font-size="11" fill="#374151" text-anchor="end" font-weight="normal" font-family="system-ui, sans-serif">0</text>
<line x1="90.0" y1="160.0" x2="520.0" y2="160.0" stroke="#cbd2d9" stroke-width="0.8"/>
<text x="84.0" y="164.0" font-size="11" fill="#374151" text-anchor="end" font-weight="normal" font-family="system-ui, sans-serif">100</text>
<line x1="90.0" y1="95.0" x2="520.0" y2="95.0" stroke="#cbd2d9" stroke-width="0.8"/>
<text x="84.0" y="99.0" font-size="11" fill="#374151" text-anchor="end" font-weight="normal" font-family="system-ui, sans-serif">200</text>
<line x1="90.0" y1="30.0" x2="520.0" y2="30.0" stroke="#cbd2d9" stroke-width="0.8"/>
<text x="84.0" y="34.0" font-size="11" fill="#374151" text-anchor="end" font-weight="normal" font-family="system-ui, sans-serif">300</text>
<line x1="90.0" y1="225.0" x2="520.0" y2="225.0" stroke="#1f2933" stroke-width="1.5"/>
<line x1="90.0" y1="30.0" x2="90.0" y2="290.0" stroke="#1f2933" stroke-width="1.5"/>
<text x="305.0" y="326.0" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">interest rate (%)</text>
<text x="38.0" y="160.0" font-size="12" fill="#1f2933" text-anchor="middle" font-family="system-ui, sans-serif" transform="rotate(-90 38.0 160.0)">present worth (₦)</text>
<path d="M 90.0 30.0 L 95.4 34.8 L 100.8 39.6 L 106.1 44.3 L 111.5 48.9 L 116.9 53.4 L 122.2 57.9 L 127.6 62.3 L 133.0 66.6 L 138.4 70.9 L 143.8 75.1 L 149.1 79.3 L 154.5 83.3 L 159.9 87.4 L 165.2 91.3 L 170.6 95.2 L 176.0 99.1 L 181.4 102.9 L 186.8 106.6 L 192.1 110.3 L 197.5 113.9 L 202.9 117.5 L 208.2 121.0 L 213.6 124.5 L 219.0 127.9 L 224.4 131.3 L 229.8 134.6 L 235.1 137.9 L 240.5 141.2 L 245.9 144.4 L 251.2 147.5 L 256.6 150.6 L 262.0 153.7 L 267.4 156.7 L 272.8 159.7 L 278.1 162.7 L 283.5 165.6 L 288.9 168.5 L 294.2 171.3 L 299.6 174.1 L 305.0 176.9 L 310.4 179.6 L 315.8 182.3 L 321.1 184.9 L 326.5 187.6 L 331.9 190.2 L 337.2 192.7 L 342.6 195.2 L 348.0 197.7 L 353.4 200.2 L 358.8 202.6 L 364.1 205.0 L 369.5 207.4 L 374.9 209.8 L 380.2 212.1 L 385.6 214.4 L 391.0 216.6 L 396.4 218.9 L 401.8 221.1 L 407.1 223.3 L 412.5 225.4 L 417.9 227.6 L 423.2 229.7 L 428.6 231.8 L 434.0 233.8 L 439.4 235.9 L 444.8 237.9 L 450.1 239.9 L 455.5 241.8 L 460.9 243.8 L 466.2 245.7 L 471.6 247.6 L 477.0 249.5 L 482.4 251.4 L 487.8 253.2 L 493.1 255.0 L 498.5 256.8 L 503.9 258.6 L 509.2 260.4 L 514.6 262.1 L 520.0 263.8" stroke="#3b82f6" stroke-width="2.5" fill="none"/>
<circle cx="411.4" cy="225.0" r="6" fill="#dc2626" stroke="#ffffff"/>
<text x="419.4" y="213.0" font-size="13" fill="#dc2626" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">IRR ≈ 30%</text>
<line x1="251.2" y1="30.0" x2="251.2" y2="290.0" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6 4"/>
<text x="257.2" y="44.0" font-size="12" fill="#b45309" text-anchor="start" font-weight="normal" font-family="system-ui, sans-serif">target 15%</text>
<text x="122.2" y="62.5" font-size="12" fill="#059669" text-anchor="start" font-weight="normal" font-family="system-ui, sans-serif">PW &gt; 0: accept</text>
<text x="423.2" y="264.0" font-size="12" fill="#dc2626" text-anchor="start" font-weight="normal" font-family="system-ui, sans-serif">PW &lt; 0</text>
</svg>
