<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" width="560" height="300" role="img">
<title>Cash flow diagram of a 50,000 naira machine: a downward arrow of 50,000 at year 0, upward arrows of 20,000 at years 1, 2 and 3, and a separate upward arrow of 5,000 salvage at year 3</title>
<rect width="100%" height="100%" rx="8" fill="#ffffff"/>
<line x1="40.0" y1="150.0" x2="490.0" y2="150.0" stroke="#1f2933" stroke-width="2"/>
<line x1="60.0" y1="145.0" x2="60.0" y2="155.0" stroke="#1f2933" stroke-width="2"/>
<text x="60.0" y="140.0" font-size="12" fill="#374151" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">0</text>
<line x1="190.0" y1="145.0" x2="190.0" y2="155.0" stroke="#1f2933" stroke-width="2"/>
<text x="190.0" y="172.0" font-size="12" fill="#374151" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">1</text>
<line x1="320.0" y1="145.0" x2="320.0" y2="155.0" stroke="#1f2933" stroke-width="2"/>
<text x="320.0" y="172.0" font-size="12" fill="#374151" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">2</text>
<line x1="450.0" y1="145.0" x2="450.0" y2="155.0" stroke="#1f2933" stroke-width="2"/>
<text x="450.0" y="172.0" font-size="12" fill="#374151" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">3</text>
<text x="520.0" y="155.0" font-size="12" fill="#374151" text-anchor="end" font-weight="normal" font-family="system-ui, sans-serif">year</text>
<line x1="60.0" y1="150.0" x2="60.0" y2="270.0" stroke="#dc2626" stroke-width="3"/>
<path d="M 53.0 260.0 L 60.0 270.0 L 67.0 260.0" stroke="#dc2626" stroke-width="3" fill="none"/>
<text x="60.0" y="288.0" font-size="12" fill="#dc2626" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">−50,000</text>
<line x1="190.0" y1="150.0" x2="190.0" y2="102.0" stroke="#059669" stroke-width="3"/>
<path d="M 183.0 112.0 L 190.0 102.0 L 197.0 112.0" stroke="#059669" stroke-width="3" fill="none"/>
<text x="190.0" y="94.0" font-size="12" fill="#059669" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">+20,000</text>
<line x1="320.0" y1="150.0" x2="320.0" y2="102.0" stroke="#059669" stroke-width="3"/>
<path d="M 313.0 112.0 L 320.0 102.0 L 327.0 112.0" stroke="#059669" stroke-width="3" fill="none"/>
<text x="320.0" y="94.0" font-size="12" fill="#059669" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">+20,000</text>
<line x1="450.0" y1="150.0" x2="450.0" y2="102.0" stroke="#059669" stroke-width="3"/>
<path d="M 443.0 112.0 L 450.0 102.0 L 457.0 112.0" stroke="#059669" stroke-width="3" fill="none"/>
<text x="450.0" y="94.0" font-size="12" fill="#059669" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">+20,000</text>
<line x1="476.0" y1="150.0" x2="476.0" y2="138.0" stroke="#059669" stroke-width="3"/>
<path d="M 469.0 148.0 L 476.0 138.0 L 483.0 148.0" stroke="#059669" stroke-width="3" fill="none"/>
<text x="476.0" y="130.0" font-size="12" fill="#059669" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">+5,000</text>
<text x="548.0" y="20.0" font-size="11" fill="#059669" text-anchor="end" font-weight="normal" font-family="system-ui, sans-serif">up = benefit (in)</text>
<text x="548.0" y="36.0" font-size="11" fill="#dc2626" text-anchor="end" font-weight="normal" font-family="system-ui, sans-serif">down = cost (out)</text>
</svg>
