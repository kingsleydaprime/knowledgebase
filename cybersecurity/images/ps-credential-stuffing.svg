<text xml:space="preserve" text-anchor="middle" x="147.5" y="-135.15" font-family="Helvetica,Arial,sans-serif" font-size="13.00">A shop you forgot about is breached</text>
<text xml:space="preserve" text-anchor="middle" x="147.5" y="-121.65" font-family="Helvetica,Arial,sans-serif" font-size="13.00">your email + password end up in a public dump</text>
