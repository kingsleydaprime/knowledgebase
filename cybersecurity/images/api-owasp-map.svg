<text x="110.0" y="212.0" font-size="12" fill="#1f2933" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">Broken Function Level Authorization</text>
<text x="508.0" y="212.0" font-size="10.5" fill="#dc2626" text-anchor="end" font-weight="normal" font-family="system-ui, sans-serif">authorization</text>
<rect x="40.0" y="230.0" width="480.0" height="30.0" fill="#eef2f7" stroke="#1f2933" stroke-width="1.0" fill-opacity="1"/>
<text x="52.0" y="250.0" font-size="12.5" fill="#1f2933" text-anchor="start" font-weight="normal" font-family="system-ui, sans-serif">API6</text>
<text x="110.0" y="250.0" font-size="12" fill="#1f2933" text-anchor="start" font-weight="normal" font-family="system-ui, sans-serif">Unrestricted Access to Sensitive Business Flows</text>
