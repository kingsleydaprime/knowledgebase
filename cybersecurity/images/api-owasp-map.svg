<text x="110.0" y="364.0" font-size="12" fill="#1f2933" text-anchor="start" font-weight="normal" font-family="system-ui, sans-serif">Improper Inventory Management</text>
<rect x="40.0" y="382.0" width="480.0" height="30.0" fill="#eef2f7" stroke="#1f2933" stroke-width="1.0" fill-opacity="1"/>
<text x="52.0" y="402.0" font-size="12.5" fill="#1f2933" text-anchor="start" font-weight="normal" font-family="system-ui, sans-serif">API10</text>
<text x="110.0" y="402.0" font-size="12" fill="#1f2933" text-anchor="start" font-weight="normal" font-family="system-ui, sans-serif">Unsafe Consumption of APIs</text>
<text x="280.0" y="420.0" font-size="12" fill="#dc2626" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">Three of the top five are one failure: authorization</text>
