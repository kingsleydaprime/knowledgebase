<text xml:space="preserve" text-anchor="middle" x="125.62" y="-74.3" font-family="Helvetica,Arial,sans-serif" font-size="11.00" fill="#374151"> &#160;receives B = 19</text>
<text xml:space="preserve" text-anchor="middle" x="125.62" y="-63.05" font-family="Helvetica,Arial,sans-serif" font-size="11.00" fill="#374151"> &#160;from Bayo</text>
</g>
<g id="edge6" class="edge">
<path fill="none" stroke="#dc2626" stroke-dasharray="5,2" d="M302.7,-100.58C289.65,-87.72 271.47,-69.8 255.98,-54.53"/>
<polygon fill="#dc2626" stroke="#dc2626" points="258.83,-52.43 249.25,-47.9 253.91,-57.41 258.83,-52.43"/>
</g>
<g id="node6" class="node">
<path fill="#d1fae5" stroke="#059669" stroke-width="1.2" d="M438.25,-41.12C438.25,-41.12 348,-41.12 348,-41.12 342,-41.12 336,-35.12 336,-29.12 336,-29.12 336,-17.12 336,-17.12 336,-11.12 342,-5.12 348,-5.12 348,-5.12 438.25,-5.12 438.25,-5.12 444.25,-5.12 450.25,-11.12 450.25,-17.12 450.25,-17.12 450.25,-29.13 450.25,-29.13 450.25,-35.12 444.25,-41.12 438.25,-41.12"/>
<text xml:space="preserve" text-anchor="middle" x="393.12" y="-24.48" font-family="Helvetica,Arial,sans-serif" font-size="12.00">Bayo: A^b mod p</text>
<text xml:space="preserve" text-anchor="middle" x="393.12" y="-11.72" font-family="Helvetica,Arial,sans-serif" font-size="12.00">= 8^15 mod 23 = 2</text>
</g>
<g id="edge4" class="edge">
<path fill="none" stroke="#1f2933" d="M333.51,-100.58C344.46,-86.54 360.1,-66.47 372.62,-50.42"/>
<polygon fill="#1f2933" stroke="#1f2933" points="375.25,-52.74 378.64,-42.7 369.73,-48.43 375.25,-52.74"/>
<text xml:space="preserve" text-anchor="middle" x="400.66" y="-74.3" font-family="Helvetica,Arial,sans-serif" font-size="11.00" fill="#374151"> &#160;receives A = 8</text>
<text xml:space="preserve" text-anchor="middle" x="400.66" y="-63.05" font-family="Helvetica,Arial,sans-serif" font-size="11.00" fill="#374151"> &#160;from Ada</text>
</g>
</g>
