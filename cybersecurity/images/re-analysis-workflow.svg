<title>The tiered malware analysis workflow: automated triage with hash lookup, strings, imports and a sandbox answers most questions in minutes; if not, static analysis in Ghidra; then dynamic analysis running and monitoring the sample and unpacking in memory; then a targeted deep dive to extract the C2, keys and persistence; always ending in a report with IOCs and YARA rules. Each tier is entered only if the previous one did not answer the question.</title>
