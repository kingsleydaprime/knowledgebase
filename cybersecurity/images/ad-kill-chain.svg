<title>The Active Directory kill chain in seven stages: foothold from one credential, enumerate with BloodHound to find the path to Domain Admin, harvest credentials by Kerberoasting and mimikatz, move laterally with pass-the-hash, escalate through ACL, delegation, ADCS or DCSync, reach Domain Admin by DCSyncing KRBTGT and forging a Golden Ticket, then persist and document every step.</title>
