<text xml:space="preserve" text-anchor="middle" x="324" y="-257.4" font-family="Helvetica,Arial,sans-serif" font-size="13.00">Do you own the target,</text>
<text xml:space="preserve" text-anchor="middle" x="324" y="-243.9" font-family="Helvetica,Arial,sans-serif" font-size="13.00">or hold written permission</text>
<text xml:space="preserve" text-anchor="middle" x="324" y="-230.4" font-family="Helvetica,Arial,sans-serif" font-size="13.00">from someone who does?</text>
