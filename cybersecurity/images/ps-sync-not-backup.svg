<svg role="img" width="266pt" height="188pt"
 viewBox="0.00 0.00 266.00 188.00" xmlns="http://www.w3.org/2000/svg">
<title>Why sync is not a backup, in three steps: you delete or corrupt a file, or ransomware encrypts it, on one device; the sync service makes every device match; so the bad version is copied to every device and the good copy is gone everywhere at once.</title>
<g id="graph0" class="graph" transform="scale(1 1) rotate(0) translate(18 170)">
<polygon fill="white" stroke="none" points="-18,18 -18,-170 248.4,-170 248.4,18 -18,18"/>
<g id="node1" class="node">
<path fill="#dbeafe" stroke="#1f2933" stroke-width="1.2" d="M218.4,-152C218.4,-152 12,-152 12,-152 6,-152 0,-146 0,-140 0,-140 0,-128 0,-128 0,-122 6,-116 12,-116 12,-116 218.4,-116 218.4,-116 224.4,-116 230.4,-122 230.4,-128 230.4,-128 230.4,-140 230.4,-140 230.4,-146 224.4,-152 218.4,-152"/>
<text xml:space="preserve" text-anchor="middle" x="115.2" y="-135.15" font-family="Helvetica,Arial,sans-serif" font-size="13.00">You delete, corrupt, or ransomware</text>
<text xml:space="preserve" text-anchor="middle" x="115.2" y="-121.65" font-family="Helvetica,Arial,sans-serif" font-size="13.00">encrypts a file on one device</text>
</g>
