<text xml:space="preserve" text-anchor="middle" x="115.2" y="-19.15" font-family="Helvetica,Arial,sans-serif" font-size="13.00">The bad version lands on every</text>
<text xml:space="preserve" text-anchor="middle" x="115.2" y="-5.65" font-family="Helvetica,Arial,sans-serif" font-size="13.00">device — the good copy is gone</text>
