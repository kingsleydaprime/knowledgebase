<path fill="#e5e7eb" stroke="#1f2933" stroke-width="1.2" d="M218.4,-94C218.4,-94 12,-94 12,-94 6,-94 0,-88 0,-82 0,-82 0,-70 0,-70 0,-64 6,-58 12,-58 12,-58 218.4,-58 218.4,-58 224.4,-58 230.4,-64 230.4,-70 230.4,-70 230.4,-82 230.4,-82 230.4,-88 224.4,-94 218.4,-94"/>
<text xml:space="preserve" text-anchor="middle" x="115.2" y="-70.4" font-family="Helvetica,Arial,sans-serif" font-size="13.00">Sync makes everywhere match</text>
</g>
