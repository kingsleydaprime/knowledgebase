<title>The exploitation escalation ladder: with no defences you inject shellcode; NX forces code reuse (ret2libc/ROP); ASLR forces leaking an address first; PIE forces leaking the binary base; Full RELRO forces a pure-ROP execve; a canary must be leaked or avoided; and CET or a shadow stack detects ROP, pushing to JOP or data-only attacks — the checksec output tells you which rung you are on.</title>
