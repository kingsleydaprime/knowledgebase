<title>The Kerberos ticket exchange in three request/response pairs: the client asks the KDC and gets a TGT sealed with the KRBTGT account hash, presents that TGT and gets a service ticket sealed with the service account hash, then presents the service ticket to the SQL server, which decrypts it with its own key and trusts the client.</title>
