<text xml:space="preserve" text-anchor="middle" x="129.5" y="-268.35" font-family="Helvetica,Arial,sans-serif" font-size="12.00">Your browser / OS trust store</text>
<text xml:space="preserve" text-anchor="middle" x="129.5" y="-255.6" font-family="Helvetica,Arial,sans-serif" font-size="12.00">(ships with ~150 root certificates)</text>
</g>
