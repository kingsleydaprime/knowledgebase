<text x="525.0" y="173.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">no external auth</text>
<line x1="390.0" y1="145.0" x2="445.0" y2="160.0" stroke="#dc2626" stroke-width="1.1" stroke-dasharray="3,3"/>
