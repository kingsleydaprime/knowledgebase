<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 330" width="460" height="330" role="img">
<title>A sequence diagram of the WPA2 four-way handshake between the router and the device: four messages that let both sides derive the session key, and which an eavesdropper can capture to test passphrase guesses offline.</title>
<rect width="100%" height="100%" rx="8" fill="#ffffff"/>
<text x="120.0" y="42.0" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">Router (AP)</text>
<line x1="120.0" y1="60.0" x2="120.0" y2="300.0" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4,3"/>
<text x="340.0" y="42.0" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">Device</text>
<line x1="340.0" y1="60.0" x2="340.0" y2="300.0" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4,3"/>
<line x1="120.0" y1="94.0" x2="340.0" y2="94.0" stroke="#1f2933" stroke-width="1.6"/>
<text x="332.0" y="98.0" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">▶</text>
<text x="230.0" y="87.0" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">M1: ANonce (router’s random number)</text>
<line x1="340.0" y1="142.0" x2="120.0" y2="142.0" stroke="#1f2933" stroke-width="1.6"/>
<text x="128.0" y="146.0" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">◀</text>
<text x="230.0" y="135.0" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">M2: SNonce + proof it has the key</text>
<line x1="120.0" y1="190.0" x2="340.0" y2="190.0" stroke="#1f2933" stroke-width="1.6"/>
<text x="332.0" y="194.0" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">▶</text>
<text x="230.0" y="183.0" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">M3: group key + proof</text>
<line x1="340.0" y1="238.0" x2="120.0" y2="238.0" stroke="#1f2933" stroke-width="1.6"/>
<text x="128.0" y="242.0" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">◀</text>
<text x="230.0" y="231.0" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">M4: acknowledgement</text>
<rect x="70.0" y="288.0" width="320.0" height="40.0" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2" fill-opacity="1"/>
<text x="230.0" y="304.0" font-size="11" fill="#7f1d1d" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">An eavesdropper who captures M1–M4 can test</text>
<text x="230.0" y="319.0" font-size="11" fill="#7f1d1d" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">passphrase guesses offline — strong passphrase = safe.</text>
</svg>
