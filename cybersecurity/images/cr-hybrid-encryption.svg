<path fill="none" stroke="#1f2933" d="M230.77,-24.25C234.09,-24.25 237.42,-24.25 240.75,-24.25"/>
<polygon fill="#1f2933" stroke="#1f2933" points="240.55,-27.75 250.55,-24.25 240.55,-20.75 240.55,-27.75"/>
</g>
<g id="node3" class="node">
<path fill="#d1fae5" stroke="#1f2933" stroke-width="1.2" d="M723.2,-48.5C723.2,-48.5 516.8,-48.5 516.8,-48.5 510.8,-48.5 504.8,-42.5 504.8,-36.5 504.8,-36.5 504.8,-12 504.8,-12 504.8,-6 510.8,0 516.8,0 516.8,0 723.2,0 723.2,0 729.2,0 735.2,-6 735.2,-12 735.2,-12 735.2,-36.5 735.2,-36.5 735.2,-42.5 729.2,-48.5 723.2,-48.5"/>
<text xml:space="preserve" text-anchor="middle" x="620" y="-32.15" font-family="Helvetica,Arial,sans-serif" font-size="13.00">Bulk data (symmetric)</text>
<text xml:space="preserve" text-anchor="middle" x="620" y="-18.65" font-family="Helvetica,Arial,sans-serif" font-size="13.00">AES&#45;GCM or ChaCha20 encrypts</text>
<text xml:space="preserve" text-anchor="middle" x="620" y="-5.15" font-family="Helvetica,Arial,sans-serif" font-size="13.00">every byte that follows</text>
</g>
