<svg role="img" width="771pt" height="85pt"
 viewBox="0.00 0.00 771.00 85.00" xmlns="http://www.w3.org/2000/svg">
<title>A three-step flow: an asymmetric key exchange gives both sides one shared secret, a key derivation step turns it into a symmetric key, and a fast symmetric cipher encrypts all the data.</title>
<g id="graph0" class="graph" transform="scale(1 1) rotate(0) translate(18 66.5)">
<polygon fill="white" stroke="none" points="-18,18 -18,-66.5 753.2,-66.5 753.2,18 -18,18"/>
<g id="node1" class="node">
<path fill="#dbeafe" stroke="#1f2933" stroke-width="1.2" d="M218.4,-48.5C218.4,-48.5 12,-48.5 12,-48.5 6,-48.5 0,-42.5 0,-36.5 0,-36.5 0,-12 0,-12 0,-6 6,0 12,0 12,0 218.4,0 218.4,0 224.4,0 230.4,-6 230.4,-12 230.4,-12 230.4,-36.5 230.4,-36.5 230.4,-42.5 224.4,-48.5 218.4,-48.5"/>
<text xml:space="preserve" text-anchor="middle" x="115.2" y="-32.15" font-family="Helvetica,Arial,sans-serif" font-size="13.00">Key exchange (asymmetric)</text>
<text xml:space="preserve" text-anchor="middle" x="115.2" y="-18.65" font-family="Helvetica,Arial,sans-serif" font-size="13.00">X25519 / ECDH: both sides</text>
<text xml:space="preserve" text-anchor="middle" x="115.2" y="-5.15" font-family="Helvetica,Arial,sans-serif" font-size="13.00">compute one shared secret</text>
</g>
<g id="node2" class="node">
<path fill="#e5e7eb" stroke="#1f2933" stroke-width="1.2" d="M470.8,-48.5C470.8,-48.5 264.4,-48.5 264.4,-48.5 258.4,-48.5 252.4,-42.5 252.4,-36.5 252.4,-36.5 252.4,-12 252.4,-12 252.4,-6 258.4,0 264.4,0 264.4,0 470.8,0 470.8,0 476.8,0 482.8,-6 482.8,-12 482.8,-12 482.8,-36.5 482.8,-36.5 482.8,-42.5 476.8,-48.5 470.8,-48.5"/>
<text xml:space="preserve" text-anchor="middle" x="367.6" y="-32.15" font-family="Helvetica,Arial,sans-serif" font-size="13.00">Key derivation</text>
<text xml:space="preserve" text-anchor="middle" x="367.6" y="-18.65" font-family="Helvetica,Arial,sans-serif" font-size="13.00">turn the shared secret into</text>
<text xml:space="preserve" text-anchor="middle" x="367.6" y="-5.15" font-family="Helvetica,Arial,sans-serif" font-size="13.00">a 256&#45;bit AES key (HKDF)</text>
</g>
