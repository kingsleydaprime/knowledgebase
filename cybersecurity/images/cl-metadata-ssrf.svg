<title>The Capital One attack chain: an attacker sends a crafted URL to an app with a server-side request forgery flaw, the app fetches the cloud metadata endpoint at 169.254.169.254, which returns the VM role credentials, and the attacker then uses those credentials to read the storage bucket the role could access, from anywhere.</title>
