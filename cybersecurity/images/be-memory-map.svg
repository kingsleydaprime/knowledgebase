<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 380" width="460" height="380" role="img">
<title>A process address space from high to low addresses: stack, heap, bss/data, and text.</title>
<rect width="100%" height="100%" rx="8" fill="#ffffff"/>
<rect x="150.0" y="54.0" width="200.0" height="62.0" fill="#dbeafe" stroke="#1f2933" stroke-width="1.2" fill-opacity="1"/>
<text x="250.0" y="80.0" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">stack</text>
<text x="250.0" y="99.0" font-size="10" fill="#374151" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">local variables, return addresses</text>
<text x="398.0" y="89.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">grows down</text>
<text x="370.0" y="90.0" font-size="18" fill="#f59e0b" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">↓</text>
<rect x="150.0" y="124.0" width="200.0" height="62.0" fill="#d1fae5" stroke="#1f2933" stroke-width="1.2" fill-opacity="1"/>
<text x="250.0" y="150.0" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">heap</text>
<text x="250.0" y="169.0" font-size="10" fill="#374151" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">malloc / new</text>
<text x="398.0" y="159.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">grows up</text>
<text x="370.0" y="160.0" font-size="18" fill="#f59e0b" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">↑</text>
<rect x="150.0" y="194.0" width="200.0" height="62.0" fill="#e5e7eb" stroke="#1f2933" stroke-width="1.2" fill-opacity="1"/>
<text x="250.0" y="220.0" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">bss / data</text>
<text x="250.0" y="239.0" font-size="10" fill="#374151" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">global variables</text>
<rect x="150.0" y="264.0" width="200.0" height="62.0" fill="#fef3c7" stroke="#1f2933" stroke-width="1.2" fill-opacity="1"/>
<text x="250.0" y="290.0" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">text</text>
<text x="250.0" y="309.0" font-size="10" fill="#374151" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">machine code: read-only + executable</text>
<text x="134.0" y="60.0" font-size="11" fill="#6b7280" text-anchor="end" font-weight="normal" font-family="system-ui, sans-serif">HIGH</text>
<text x="134.0" y="326.0" font-size="11" fill="#6b7280" text-anchor="end" font-weight="normal" font-family="system-ui, sans-serif">LOW</text>
<text x="250.0" y="350.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">addresses</text>
</svg>
