<title>Two panels: before ARP spoofing, the victim (10.9.0.3) sends traffic for the gateway (10.9.0.2) straight to the gateway's MAC address ending 02; after forged ARP replies, the victim believes 10.9.0.2 is at the attacker's MAC ending 04, so its traffic detours through the attacker (10.9.0.4), who reads it and forwards it on.</title>
