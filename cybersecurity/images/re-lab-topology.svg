<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img">
<title>Isolated malware analysis lab</title>
<rect width="100%" height="100%" rx="8" fill="#ffffff"/>
<rect x="40.0" y="36.0" width="560.0" height="40.0" fill="#e5e7eb" stroke="#1f2933" stroke-width="1.4" fill-opacity="1"/>
<text x="320.0" y="61.0" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">HOST  —  your real machine, never runs the malware</text>
<rect x="60.0" y="120.0" width="250.0" height="140.0" fill="#dbeafe" stroke="#1f2933" stroke-width="1.5" fill-opacity="1"/>
<text x="185.0" y="146.0" font-size="13.5" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">VM: analysis box</text>
<text x="80.0" y="174.0" font-size="12" fill="#1f2933" text-anchor="start" font-weight="normal" font-family="system-ui, sans-serif">• Windows + FLARE VM</text>
<text x="80.0" y="198.0" font-size="12" fill="#1f2933" text-anchor="start" font-weight="normal" font-family="system-ui, sans-serif">• Ghidra, x64dbg, PEStudio</text>
<text x="80.0" y="222.0" font-size="12" fill="#1f2933" text-anchor="start" font-weight="normal" font-family="system-ui, sans-serif">• snapshot before EACH run</text>
<rect x="330.0" y="120.0" width="250.0" height="140.0" fill="#d1fae5" stroke="#059669" stroke-width="1.5" fill-opacity="1"/>
<text x="455.0" y="146.0" font-size="13.5" fill="#059669" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">VM: fake-internet box</text>
<text x="350.0" y="174.0" font-size="12" fill="#1f2933" text-anchor="start" font-weight="normal" font-family="system-ui, sans-serif">• REMnux + INetSim / FakeNet</text>
<text x="350.0" y="198.0" font-size="12" fill="#1f2933" text-anchor="start" font-weight="normal" font-family="system-ui, sans-serif">• answers DNS / HTTP</text>
<text x="350.0" y="222.0" font-size="12" fill="#1f2933" text-anchor="start" font-weight="normal" font-family="system-ui, sans-serif">• so it "connects" safely</text>
<line x1="185.0" y1="76.0" x2="185.0" y2="120.0" stroke="#1f2933" stroke-width="1.3"/>
<line x1="455.0" y1="76.0" x2="455.0" y2="120.0" stroke="#1f2933" stroke-width="1.3"/>
<line x1="310.0" y1="190.0" x2="330.0" y2="190.0" stroke="#1f2933" stroke-width="1.3" stroke-dasharray="4,3"/>
<text x="320.0" y="110.0" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">host-only network — never bridged to your LAN</text>
<text x="320.0" y="285.0" font-size="11.5" fill="#dc2626" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">A mistake here infects you, not a practice target</text>
</svg>
