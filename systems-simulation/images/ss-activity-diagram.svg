<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 230" width="620" height="230" role="img">
<title>An activity diagram of a single-server queue: a zigzag arrival line feeds a queue drawn as a circle, which feeds a service activity drawn as a rectangle, which leads to a zigzag departure line; a small circle for the server resource is joined to the service rectangle by dashed seize and release arrows</title>
<rect width="100%" height="100%" rx="8" fill="#ffffff"/>
<path d="M 30 140 L 38 148 L 46 132 L 54 148 L 62 132 L 70 148 L 78 132" stroke="#1f2933" stroke-width="2" fill="none"/>
<text x="55.0" y="120.0" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">arrive</text>
<line x1="80.0" y1="140.0" x2="150.0" y2="140.0" stroke="#1f2933" stroke-width="1.8"/>
<circle cx="185.0" cy="140.0" r="32" fill="#fef3c7" stroke="#1f2933"/>
<text x="185.0" y="145.0" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">queue</text>
<line x1="217.0" y1="140.0" x2="290.0" y2="140.0" stroke="#1f2933" stroke-width="1.8"/>
<rect x="290.0" y="112.0" width="130.0" height="56.0" fill="#dbeafe" stroke="#1f2933" stroke-width="1.4" fill-opacity="1"/>
<text x="355.0" y="145.0" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">service</text>
<line x1="420.0" y1="140.0" x2="490.0" y2="140.0" stroke="#1f2933" stroke-width="1.8"/>
<path d="M 490 140 L 498 148 L 506 132 L 514 148 L 522 132 L 530 148 L 538 132" stroke="#1f2933" stroke-width="2" fill="none"/>
<text x="515.0" y="120.0" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">leave</text>
<circle cx="355.0" cy="45.0" r="14" fill="#d1fae5" stroke="#1f2933"/>
<text x="380.0" y="49.0" font-size="11" fill="#1f2933" text-anchor="start" font-weight="normal" font-family="system-ui, sans-serif">server</text>
<line x1="340.0" y1="58.0" x2="320.0" y2="112.0" stroke="#1f2933" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="300.0" y="85.0" font-size="11" fill="#1f2933" text-anchor="end" font-weight="normal" font-family="system-ui, sans-serif">seize</text>
<line x1="370.0" y1="58.0" x2="390.0" y2="112.0" stroke="#1f2933" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="410.0" y="85.0" font-size="11" fill="#1f2933" text-anchor="start" font-weight="normal" font-family="system-ui, sans-serif">release</text>
</svg>
