<line x1="501.7" y1="30.0" x2="501.7" y2="198.0" stroke="#cbd2d9" stroke-width="0.8"/>
<text x="501.7" y="214.0" font-size="11" fill="#374151" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">10</text>
