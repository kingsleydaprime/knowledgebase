<circle cx="501.7" cy="177.0" r="3.5" fill="#1f2933" stroke="none"/>
<rect x="110.0" y="240.0" width="22.0" height="12.0" fill="#9ca3af" stroke="none" stroke-width="1" fill-opacity="0.6"/>
