<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 246" width="620" height="246" role="img">
<title>The four-activity Brooks example with a limit of 4 workers</title>
<rect width="100%" height="100%" rx="8" fill="#ffffff"/>
<line x1="130.0" y1="24.0" x2="130.0" y2="160.0" stroke="#cbd2d9" stroke-width="0.8"/>
<text x="130.0" y="176.0" font-size="11" fill="#374151" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">0</text>
<line x1="220.0" y1="24.0" x2="220.0" y2="160.0" stroke="#cbd2d9" stroke-width="0.8"/>
<text x="220.0" y="176.0" font-size="11" fill="#374151" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">1</text>
<line x1="310.0" y1="24.0" x2="310.0" y2="160.0" stroke="#cbd2d9" stroke-width="0.8"/>
<text x="310.0" y="176.0" font-size="11" fill="#374151" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">2</text>
<line x1="400.0" y1="24.0" x2="400.0" y2="160.0" stroke="#cbd2d9" stroke-width="0.8"/>
<text x="400.0" y="176.0" font-size="11" fill="#374151" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">3</text>
<line x1="490.0" y1="24.0" x2="490.0" y2="160.0" stroke="#cbd2d9" stroke-width="0.8"/>
<text x="490.0" y="176.0" font-size="11" fill="#374151" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">4</text>
<line x1="580.0" y1="24.0" x2="580.0" y2="160.0" stroke="#cbd2d9" stroke-width="0.8"/>
<text x="580.0" y="176.0" font-size="11" fill="#374151" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">5</text>
<line x1="130.0" y1="160.0" x2="580.0" y2="160.0" stroke="#1f2933" stroke-width="1.5"/>
<text x="355.0" y="196.0" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">time (days)</text>
<text x="120.0" y="45.0" font-size="12" fill="#1f2933" text-anchor="end" font-weight="normal" font-family="system-ui, sans-serif">A (3 workers)</text>
<rect x="130.0" y="32.0" width="180.0" height="18.0" fill="#3b82f6" stroke="none" stroke-width="1" fill-opacity="1"/>
<text x="120.0" y="79.0" font-size="12" fill="#1f2933" text-anchor="end" font-weight="normal" font-family="system-ui, sans-serif">B (2 workers)</text>
<rect x="310.0" y="66.0" width="270.0" height="18.0" fill="#3b82f6" stroke="none" stroke-width="1" fill-opacity="1"/>
<text x="120.0" y="113.0" font-size="12" fill="#1f2933" text-anchor="end" font-weight="normal" font-family="system-ui, sans-serif">C (2 workers)</text>
<rect x="310.0" y="100.0" width="180.0" height="18.0" fill="#3b82f6" stroke="none" stroke-width="1" fill-opacity="1"/>
<text x="120.0" y="147.0" font-size="12" fill="#1f2933" text-anchor="end" font-weight="normal" font-family="system-ui, sans-serif">D (2 workers)</text>
<rect x="490.0" y="134.0" width="90.0" height="18.0" fill="#3b82f6" stroke="none" stroke-width="1" fill-opacity="1"/>
<line x1="400.0" y1="18.0" x2="400.0" y2="160.0" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="5,4"/>
<text x="404.0" y="16.0" font-size="11" fill="#dc2626" text-anchor="start" font-weight="normal" font-family="system-ui, sans-serif">unconstrained finish</text>
