<path d="M 70.0 162.0 L 550.0 52.0" stroke="#f59e0b" stroke-width="3" fill="none"/>
<text x="544.0" y="46.0" font-size="12" fill="#f59e0b" text-anchor="end" font-weight="bold" font-family="system-ui, sans-serif">surfacing</text>
