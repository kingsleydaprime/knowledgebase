<text x="310.0" y="286.0" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">position along the road (km)</text>
<text x="30.0" y="140.0" font-size="12" fill="#1f2933" text-anchor="middle" font-family="system-ui, sans-serif" transform="rotate(-90 30.0 140.0)">time (weeks)</text>
