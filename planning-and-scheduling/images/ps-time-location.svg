<line x1="70.0" y1="118.0" x2="550.0" y2="118.0" stroke="#cbd2d9" stroke-width="0.8"/>
<text x="64.0" y="122.0" font-size="11" fill="#374151" text-anchor="end" font-weight="normal" font-family="system-ui, sans-serif">12</text>
<line x1="70.0" y1="74.0" x2="550.0" y2="74.0" stroke="#cbd2d9" stroke-width="0.8"/>
