<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 320" width="620" height="320" role="img">
<title>A time-location chart for a 10 kilometre road</title>
<rect width="100%" height="100%" rx="8" fill="#ffffff"/>
