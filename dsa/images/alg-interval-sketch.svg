<text x="375" y="141" font-size="10" fill="#1f2933">6–9</text>
<rect x="398" y="150" width="92" height="14" fill="#f3f4f6" stroke="#9ca3af"/>
<text x="444" y="161" font-size="10" fill="#6b7280">8–10</text>
<line x1="30.0" y1="170.0" x2="490.0" y2="170.0" stroke="#9ca3af" stroke-width="1"/>
<text x="30" y="182" font-size="9" fill="#6b7280">0</text>
<text x="76" y="182" font-size="9" fill="#6b7280">1</text>
