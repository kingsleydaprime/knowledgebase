<text x="30" y="24" font-size="12" font-weight="bold" text-anchor="start">Earliest end first keeps 3 meetings (green)</text>
<rect x="30" y="30" width="138" height="14" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
<text x="99" y="41" font-size="10" fill="#1f2933">0–3</text>
