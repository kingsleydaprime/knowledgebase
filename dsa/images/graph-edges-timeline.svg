<rect x="166.0" y="144.0" width="70.0" height="24.0" fill="#93c5fd" stroke="#1f2933" stroke-width="1" fill-opacity="1"/>
<text x="201.0" y="161.0" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">x</text>
<rect x="396.0" y="42.0" width="162.0" height="24.0" fill="#fde68a" stroke="#1f2933" stroke-width="1" fill-opacity="1"/>
<text x="477.0" y="59.0" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">w</text>
<rect x="442.0" y="76.0" width="70.0" height="24.0" fill="#fde68a" stroke="#1f2933" stroke-width="1" fill-opacity="1"/>
<text x="477.0" y="93.0" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">z</text>
<text x="201.0" y="225.0" font-size="12" fill="#374151" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">first DFS tree (root u)</text>
<text x="477.0" y="225.0" font-size="12" fill="#374151" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">second DFS tree (root w)</text>
<text x="293.0" y="244.0" font-size="12" fill="#374151" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">Bars nest or sit apart; they never partly overlap.</text>
</svg>
