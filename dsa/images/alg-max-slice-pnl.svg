<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 260" width="500" height="260" role="img">
<title>Daily profit and loss for days 1 to 8: -2, +3, +4, -1, +5, -8, +4, +1 drawn as bars; the best window is days 2 to 5, shaded green, with sum 3 + 4 - 1 + 5 = 11</title>
<rect width="100%" height="100%" rx="8" fill="#ffffff"/>
<g font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#1f2933">
<rect x="116.1" y="20.0" width="190.2" height="180.0" fill="#ecfdf5" stroke="none" stroke-width="1" fill-opacity="1"/>
<line x1="60.0" y1="98.8" x2="460.0" y2="98.8" stroke="#1f2933" stroke-width="1.2"/>
<rect x="73" y="99" width="32" height="22" fill="#dc2626"/>
<text x="89" y="136" font-size="11" font-weight="bold">-2</text>
<text x="89" y="222" font-size="10" fill="#6b7280">day 1</text>
<rect x="122" y="65" width="32" height="34" fill="#059669"/>
<text x="138" y="59" font-size="11" font-weight="bold">+3</text>
<text x="138" y="222" font-size="10" fill="#6b7280">day 2</text>
<rect x="171" y="54" width="32" height="45" fill="#059669"/>
<text x="187" y="48" font-size="11" font-weight="bold">+4</text>
<text x="187" y="222" font-size="10" fill="#6b7280">day 3</text>
<rect x="220" y="99" width="32" height="11" fill="#059669"/>
<text x="236" y="125" font-size="11" font-weight="bold">-1</text>
<text x="236" y="222" font-size="10" fill="#6b7280">day 4</text>
<rect x="268" y="42" width="32" height="56" fill="#059669"/>
<text x="284" y="36" font-size="11" font-weight="bold">+5</text>
<text x="284" y="222" font-size="10" fill="#6b7280">day 5</text>
<rect x="317" y="99" width="32" height="90" fill="#dc2626"/>
<text x="333" y="204" font-size="11" font-weight="bold">-8</text>
<text x="333" y="222" font-size="10" fill="#6b7280">day 6</text>
<rect x="366" y="54" width="32" height="45" fill="#93c5fd"/>
<text x="382" y="48" font-size="11" font-weight="bold">+4</text>
<text x="382" y="222" font-size="10" fill="#6b7280">day 7</text>
<rect x="415" y="88" width="32" height="11" fill="#93c5fd"/>
<text x="431" y="82" font-size="11" font-weight="bold">+1</text>
<text x="431" y="222" font-size="10" fill="#6b7280">day 8</text>
<text x="250" y="248" font-size="13" fill="#059669" font-weight="bold">Best window: days 2 to 5, sum 3 + 4 − 1 + 5 = 11</text>
</g>
</svg>
