<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 198 234" width="198" height="234" role="img">
<title>Degenerate binary tree: 1, 2, 3, 4 in a straight line of right children, like a linked list</title>
<rect width="100%" height="100%" rx="8" fill="#ffffff"/>
<line x1="30.0" y1="30.0" x2="76.0" y2="88.0" stroke="#1f2933" stroke-width="1.4"/>
<line x1="76.0" y1="88.0" x2="122.0" y2="146.0" stroke="#1f2933" stroke-width="1.4"/>
<line x1="122.0" y1="146.0" x2="168.0" y2="204.0" stroke="#1f2933" stroke-width="1.4"/>
<circle cx="30.0" cy="30.0" r="16" fill="#dbeafe" stroke="#1f2933" stroke-width="1.3"/>
<text x="30.0" y="35.0" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">1</text>
<circle cx="76.0" cy="88.0" r="16" fill="#dbeafe" stroke="#1f2933" stroke-width="1.3"/>
<text x="76.0" y="93.0" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">2</text>
<circle cx="122.0" cy="146.0" r="16" fill="#dbeafe" stroke="#1f2933" stroke-width="1.3"/>
<text x="122.0" y="151.0" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">3</text>
<circle cx="168.0" cy="204.0" r="16" fill="#dbeafe" stroke="#1f2933" stroke-width="1.3"/>
<text x="168.0" y="209.0" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">4</text>
</svg>
