<svg role="img" width="322pt" height="215pt"
 viewBox="0.0 0.0 322.0 215.0" xmlns="http://www.w3.org/2000/svg">
<title>A directed graph with A to B weight 0, A to C weight 1 and C to B weight -10. Dijkstra settles B at 0 first, but the route A to C to B costs -9, so its answer is wrong.</title>
<g id="graph0" font-family="Helvetica,Arial,sans-serif" class="graph" transform="scale(1 1) rotate(0) translate(14.4 200.6)">
<polygon fill="white" stroke="none" points="-14.4,14.4 -14.4,-200.6 307.1,-200.6 307.1,14.4 -14.4,14.4"/>
<path fill="none" stroke="#3b82f6" stroke-width="3" d="M82.9,-149.9C109.6,-149.9 164.0,-149.9 197.4,-149.9"/>
<polygon fill="#3b82f6" stroke="#3b82f6" stroke-width="3" points="197.3,-152.7 205.3,-149.9 197.3,-147.1 197.3,-152.7"/>
<polygon fill="white" stroke="none" points="137.8,-149.9 137.8,-164.7 146.6,-164.7 146.6,-149.9 137.8,-149.9"/>
<text xml:space="preserve" text-anchor="start" x="138.8" y="-154.7" font-size="12.0" fill="#374151">0</text>
<path fill="none" stroke="#1f2933" stroke-width="1.3" d="M78.5,-139.6C91.3,-127.9 112.5,-108.7 127.8,-94.8"/>
<polygon fill="#1f2933" stroke="#1f2933" stroke-width="1.3" points="129.3,-97.2 133.3,-89.8 125.5,-93.1 129.3,-97.2"/>
<polygon fill="white" stroke="none" points="98.0,-113.9 98.0,-128.6 106.8,-128.6 106.8,-113.9 98.0,-113.9"/>
<text xml:space="preserve" text-anchor="start" x="99.0" y="-118.6" font-size="12.0" fill="#374151">1</text>
<path fill="none" stroke="#dc2626" stroke-width="2.5" d="M157.7,-88.2C170.1,-99.5 190.2,-117.8 205.3,-131.5"/>
<polygon fill="#dc2626" stroke="#dc2626" stroke-width="2.5" points="203.3,-133.5 211.1,-136.8 207.1,-129.4 203.3,-133.5"/>
<polygon fill="white" stroke="none" points="166.4,-113.7 166.4,-128.4 185.7,-128.4 185.7,-113.7 166.4,-113.7"/>
<text xml:space="preserve" text-anchor="start" x="167.4" y="-118.4" font-size="12.0" fill="#dc2626">&#45;10</text>
<ellipse fill="#d1fae5" stroke="#1f2933" stroke-width="1.3" cx="67.1" cy="-149.9" rx="15.1" ry="15.1"/>
<text xml:space="preserve" text-anchor="middle" x="67.1" y="-144.1" font-size="14.0">A</text>
<ellipse fill="#d1fae5" stroke="#1f2933" stroke-width="1.3" cx="225.5" cy="-149.9" rx="15.1" ry="15.1"/>
<text xml:space="preserve" text-anchor="middle" x="225.5" y="-144.1" font-size="14.0">B</text>
<ellipse fill="#d1fae5" stroke="#1f2933" stroke-width="1.3" cx="146.3" cy="-77.9" rx="15.1" ry="15.1"/>
<text xml:space="preserve" text-anchor="middle" x="146.3" y="-72.1" font-size="14.0">C</text>
<text xml:space="preserve" text-anchor="middle" x="225.5" y="-170.8" font-size="12.0" fill="#dc2626">settled at 0 (wrong)</text>
<text xml:space="preserve" text-anchor="middle" x="67.1" y="-170.8" font-size="12.0" fill="#047857">0</text>
<text xml:space="preserve" text-anchor="middle" x="146.3" y="-47.0" font-size="12.0" fill="#047857">1</text>
<text xml:space="preserve" text-anchor="middle" x="146.3" y="-18.1" font-size="12.0" fill="#1f2933">True cost of A to C to B: 1 + (&#45;10) = &#45;9.</text>
<text xml:space="preserve" text-anchor="middle" x="146.3" y="-5.3" font-size="12.0" fill="#1f2933">B was already settled, so Dijkstra never looks again.</text>
</g>
</svg>
