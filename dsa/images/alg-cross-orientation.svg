<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 570 230" width="570" height="230" role="img">
<title>The sign of the cross product of OA and OB for O = (0, 0) and A = (1, 0): with B = (0, 1) it is +1, a left (counter-clockwise) turn; with B = (0, -1) it is -1, a right (clockwise) turn; with B = (2, 0) it is 0, the three points are in a line</title>
<rect width="100%" height="100%" rx="8" fill="#ffffff"/>
<g font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#1f2933">
<defs><marker id="a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b82f6"/></marker><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/></marker></defs>
<line x1="10.0" y1="112.0" x2="180.0" y2="112.0" stroke="#eef2f6" stroke-width="1"/>
<line x1="40.0" y1="112.0" x2="106.0" y2="112.0" stroke="#1f2933" stroke-width="2.4" marker-end="url(#a0)"/>
<line x1="40.0" y1="112.0" x2="40.0" y2="46.0" stroke="#059669" stroke-width="2.4" marker-end="url(#a4)"/>
<circle cx="40.0" cy="112.0" r="4" fill="#1f2933" stroke="none"/>
<text x="30" y="130" font-size="12" font-weight="bold">O</text>
<circle cx="110.0" cy="112.0" r="4" fill="#1f2933" stroke="none"/>
<text x="110" y="104" font-size="12" font-weight="bold">A</text>
<circle cx="40.0" cy="42.0" r="4" fill="#1f2933" stroke="none"/>
<text x="52" y="34" font-size="12" font-weight="bold">B</text>
<text x="90" y="200" font-size="13" fill="#059669" font-weight="bold">cross = +1</text>
<text x="90" y="218" font-size="11" fill="#059669">left turn: counter-clockwise</text>
<line x1="200.0" y1="112.0" x2="370.0" y2="112.0" stroke="#eef2f6" stroke-width="1"/>
<line x1="230.0" y1="112.0" x2="296.0" y2="112.0" stroke="#1f2933" stroke-width="2.4" marker-end="url(#a0)"/>
<line x1="230.0" y1="112.0" x2="230.0" y2="178.0" stroke="#dc2626" stroke-width="2.4" marker-end="url(#a2)"/>
<circle cx="230.0" cy="112.0" r="4" fill="#1f2933" stroke="none"/>
<text x="220" y="130" font-size="12" font-weight="bold">O</text>
<circle cx="300.0" cy="112.0" r="4" fill="#1f2933" stroke="none"/>
<text x="300" y="104" font-size="12" font-weight="bold">A</text>
<circle cx="230.0" cy="182.0" r="4" fill="#1f2933" stroke="none"/>
<text x="242" y="174" font-size="12" font-weight="bold">B</text>
<text x="280" y="200" font-size="13" fill="#dc2626" font-weight="bold">cross = -1</text>
<text x="280" y="218" font-size="11" fill="#dc2626">right turn: clockwise</text>
<line x1="390.0" y1="112.0" x2="560.0" y2="112.0" stroke="#eef2f6" stroke-width="1"/>
<line x1="420.0" y1="112.0" x2="486.0" y2="112.0" stroke="#1f2933" stroke-width="2.4" marker-end="url(#a0)"/>
<line x1="420.0" y1="112.0" x2="556.0" y2="112.0" stroke="#3b82f6" stroke-width="2.4" marker-end="url(#a1)"/>
<circle cx="420.0" cy="112.0" r="4" fill="#1f2933" stroke="none"/>
<text x="410" y="130" font-size="12" font-weight="bold">O</text>
<circle cx="490.0" cy="112.0" r="4" fill="#1f2933" stroke="none"/>
<text x="490" y="104" font-size="12" font-weight="bold">A</text>
<circle cx="560.0" cy="112.0" r="4" fill="#1f2933" stroke="none"/>
<text x="560" y="104" font-size="12" font-weight="bold">B</text>
<text x="470" y="200" font-size="13" fill="#3b82f6" font-weight="bold">cross = 0</text>
<text x="470" y="218" font-size="11" fill="#3b82f6">straight on: collinear</text>
<text x="285" y="22" font-size="12" font-weight="bold">cross(O, A, B) = (A − O) × (B − O): the sign says which way B turns from OA</text>
</g>
</svg>
