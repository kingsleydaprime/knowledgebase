<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 270" width="400" height="270" role="img">
<title>A queue after each operation: enqueue 10, 20, 30, then dequeue returns 10 from the front, then enqueue 40 leaves 20, 30, 40 from front to back</title>
<rect width="100%" height="100%" rx="8" fill="#ffffff"/>
<text x="170.0" y="18.0" font-size="11" fill="#6b7280" text-anchor="start" font-weight="normal" font-family="system-ui, sans-serif">front</text>
<text x="20.0" y="50.0" font-size="12" fill="#1f2933" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">enqueue 10</text>
<rect x="170.0" y="28.0" width="44.0" height="32.0" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.5" fill-opacity="1"/>
<text x="192.0" y="49.0" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">10</text>
<text x="20.0" y="96.0" font-size="12" fill="#1f2933" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">enqueue 20</text>
<rect x="170.0" y="74.0" width="44.0" height="32.0" fill="#dbeafe" stroke="#1f2933" stroke-width="1.1" fill-opacity="1"/>
<text x="192.0" y="95.0" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">10</text>
<rect x="214.0" y="74.0" width="44.0" height="32.0" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.5" fill-opacity="1"/>
<text x="236.0" y="95.0" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">20</text>
<text x="20.0" y="142.0" font-size="12" fill="#1f2933" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">enqueue 30</text>
<rect x="170.0" y="120.0" width="44.0" height="32.0" fill="#dbeafe" stroke="#1f2933" stroke-width="1.1" fill-opacity="1"/>
<text x="192.0" y="141.0" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">10</text>
<rect x="214.0" y="120.0" width="44.0" height="32.0" fill="#dbeafe" stroke="#1f2933" stroke-width="1.1" fill-opacity="1"/>
<text x="236.0" y="141.0" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">20</text>
<rect x="258.0" y="120.0" width="44.0" height="32.0" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.5" fill-opacity="1"/>
<text x="280.0" y="141.0" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">30</text>
<text x="20.0" y="188.0" font-size="12" fill="#1f2933" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">dequeue</text>
<rect x="118.0" y="166.0" width="44.0" height="32.0" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.1" fill-opacity="1"/>
<text x="140.0" y="187.0" font-size="13" fill="#9ca3af" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">10</text>
<text x="114.0" y="187.0" font-size="13" fill="#059669" text-anchor="end" font-weight="bold" font-family="system-ui, sans-serif">←</text>
<rect x="170.0" y="166.0" width="44.0" height="32.0" fill="#dbeafe" stroke="#1f2933" stroke-width="1.1" fill-opacity="1"/>
<text x="192.0" y="187.0" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">20</text>
<rect x="214.0" y="166.0" width="44.0" height="32.0" fill="#dbeafe" stroke="#1f2933" stroke-width="1.1" fill-opacity="1"/>
<text x="236.0" y="187.0" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">30</text>
<text x="20.0" y="234.0" font-size="12" fill="#1f2933" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">enqueue 40</text>
<rect x="170.0" y="212.0" width="44.0" height="32.0" fill="#dbeafe" stroke="#1f2933" stroke-width="1.1" fill-opacity="1"/>
<text x="192.0" y="233.0" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">20</text>
<rect x="214.0" y="212.0" width="44.0" height="32.0" fill="#dbeafe" stroke="#1f2933" stroke-width="1.1" fill-opacity="1"/>
<text x="236.0" y="233.0" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">30</text>
<rect x="258.0" y="212.0" width="44.0" height="32.0" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.5" fill-opacity="1"/>
<text x="280.0" y="233.0" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">40</text>
<text x="114.0" y="160.0" font-size="11" fill="#059669" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">returns 10</text>
</svg>
