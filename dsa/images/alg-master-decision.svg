<text xml:space="preserve" text-anchor="middle" x="83.5" y="-219.9" font-family="Helvetica,Arial,sans-serif" font-size="12">No (e.g. T(n&#45;1)):</text>
<text xml:space="preserve" text-anchor="middle" x="83.5" y="-207.2" font-family="Helvetica,Arial,sans-serif" font-size="12">theorem does not apply,</text>
<text xml:space="preserve" text-anchor="middle" x="83.5" y="-194.4" font-family="Helvetica,Arial,sans-serif" font-size="12">draw the recursion tree</text>
</g>
