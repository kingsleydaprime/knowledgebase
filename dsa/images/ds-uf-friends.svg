<text x="140.0" y="200.0" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">C</text>
<circle cx="230.0" cy="195.0" r="16" fill="#d1fae5" stroke="#1f2933" stroke-width="2.2"/>
<text x="230.0" y="200.0" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">D</text>
<text x="16.0" y="298.0" font-size="13" fill="#1f2933" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">union(Bob, Charlie)</text>
