<text x="50.0" y="391.0" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">B</text>
<circle cx="110.0" cy="386.0" r="16" fill="#dbeafe" stroke="#1f2933" stroke-width="1.3"/>
<text x="110.0" y="391.0" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">C</text>
<circle cx="80.0" cy="330.0" r="16" fill="#d1fae5" stroke="#1f2933" stroke-width="2.2"/>
<text x="80.0" y="335.0" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">A</text>
