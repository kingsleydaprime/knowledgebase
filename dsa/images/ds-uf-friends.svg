<text x="200.0" y="335.0" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">D</text>
<text x="454.0" y="431.0" font-size="10" fill="#6b7280" text-anchor="end" font-weight="normal" font-family="system-ui, sans-serif">A = Alice, B = Bob, C = Charlie, D = David; arrows point to the parent; green = root</text>
