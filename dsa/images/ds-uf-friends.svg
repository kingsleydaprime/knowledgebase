<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 445" width="470" height="445" role="img">
<title>Friend groups as a union-find forest. At the start Alice, Bob, Charlie and David each stand alone. After union(Alice, Bob), Bob points to Alice. After union(Bob, Charlie), Charlie also points to Alice, so Alice, Bob and Charlie share the root Alice; David is still alone</title>
<rect width="100%" height="100%" rx="8" fill="#ffffff"/>
<defs><marker id="a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b82f6"/></marker><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/></marker></defs>
<text x="16.0" y="28.0" font-size="13" fill="#1f2933" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">start: 4 separate people</text>
<circle cx="50.0" cy="60.0" r="16" fill="#d1fae5" stroke="#1f2933" stroke-width="2.2"/>
<text x="50.0" y="65.0" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">A</text>
<circle cx="140.0" cy="60.0" r="16" fill="#d1fae5" stroke="#1f2933" stroke-width="2.2"/>
<text x="140.0" y="65.0" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">B</text>
<circle cx="230.0" cy="60.0" r="16" fill="#d1fae5" stroke="#1f2933" stroke-width="2.2"/>
<text x="230.0" y="65.0" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">C</text>
<circle cx="320.0" cy="60.0" r="16" fill="#d1fae5" stroke="#1f2933" stroke-width="2.2"/>
<text x="320.0" y="65.0" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">D</text>
<text x="16.0" y="163.0" font-size="13" fill="#1f2933" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">union(Alice, Bob)</text>
<line x1="50.0" y1="235.0" x2="50.0" y2="213.0" stroke="#f59e0b" stroke-width="2.6" marker-end="url(#a3)"/>
