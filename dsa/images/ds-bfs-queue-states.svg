<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 250" width="520" height="250" role="img">
<title>Level-order on the reference tree. The badges give the visit order 1, 2, 3, 4, 5, level by level. The queue, front on the left: start [1]; pop 1, add 2 and 3; pop 2, add 4 and 5, giving [3, 4, 5]; pop 3 gives [4, 5]; pop 4 gives [5]; pop 5 leaves it empty</title>
