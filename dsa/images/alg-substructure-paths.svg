<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="600" height="240" role="img">
<title>The graph with edges A–B, A–C, B–C, B–D and C–D drawn three times. Left: the shortest path from A to D is A, B, D. Middle: the longest simple path from A to B is A, C, D, B. Right: the longest simple path from B to D is B, A, C, D. The two longest paths both need C and D, so they cannot be joined</title>
<rect width="100%" height="100%" rx="8" fill="#ffffff"/>
<g font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#1f2933">
<defs><marker id="a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b82f6"/></marker><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/></marker></defs>
<line x1="50.0" y1="50.0" x2="160.0" y2="50.0" stroke="#d1d5db" stroke-width="2"/>
<line x1="50.0" y1="50.0" x2="50.0" y2="160.0" stroke="#d1d5db" stroke-width="2"/>
<line x1="160.0" y1="50.0" x2="50.0" y2="160.0" stroke="#d1d5db" stroke-width="2"/>
<line x1="160.0" y1="50.0" x2="160.0" y2="160.0" stroke="#d1d5db" stroke-width="2"/>
<line x1="50.0" y1="160.0" x2="160.0" y2="160.0" stroke="#d1d5db" stroke-width="2"/>
<line x1="67.0" y1="50.0" x2="143.0" y2="50.0" stroke="#059669" stroke-width="3" marker-end="url(#a4)"/>
<line x1="160.0" y1="67.0" x2="160.0" y2="143.0" stroke="#059669" stroke-width="3" marker-end="url(#a4)"/>
<circle cx="50.0" cy="50.0" r="15" fill="#f3f4f6" stroke="#059669"/>
<text x="50" y="55" font-size="14" fill="#1f2933" font-weight="bold">A</text>
<circle cx="160.0" cy="50.0" r="15" fill="#f3f4f6" stroke="#059669"/>
<text x="160" y="55" font-size="14" fill="#1f2933" font-weight="bold">B</text>
<circle cx="50.0" cy="160.0" r="15" fill="#ffffff" stroke="#9ca3af"/>
<text x="50" y="165" font-size="14" fill="#1f2933" font-weight="bold">C</text>
<circle cx="160.0" cy="160.0" r="15" fill="#f3f4f6" stroke="#059669"/>
<text x="160" y="165" font-size="14" fill="#1f2933" font-weight="bold">D</text>
<text x="105" y="202" font-size="13" fill="#059669" font-weight="bold">shortest A→D = 2</text>
<text x="105" y="220" font-size="12" fill="#374151">A → B → D</text>
<line x1="245.0" y1="50.0" x2="355.0" y2="50.0" stroke="#d1d5db" stroke-width="2"/>
<line x1="245.0" y1="50.0" x2="245.0" y2="160.0" stroke="#d1d5db" stroke-width="2"/>
<line x1="355.0" y1="50.0" x2="245.0" y2="160.0" stroke="#d1d5db" stroke-width="2"/>
<line x1="355.0" y1="50.0" x2="355.0" y2="160.0" stroke="#d1d5db" stroke-width="2"/>
<line x1="245.0" y1="160.0" x2="355.0" y2="160.0" stroke="#d1d5db" stroke-width="2"/>
<line x1="245.0" y1="67.0" x2="245.0" y2="143.0" stroke="#f59e0b" stroke-width="3" marker-end="url(#a3)"/>
<line x1="262.0" y1="160.0" x2="338.0" y2="160.0" stroke="#f59e0b" stroke-width="3" marker-end="url(#a3)"/>
<line x1="355.0" y1="143.0" x2="355.0" y2="67.0" stroke="#f59e0b" stroke-width="3" marker-end="url(#a3)"/>
<circle cx="245.0" cy="50.0" r="15" fill="#f3f4f6" stroke="#f59e0b"/>
<text x="245" y="55" font-size="14" fill="#1f2933" font-weight="bold">A</text>
<circle cx="355.0" cy="50.0" r="15" fill="#f3f4f6" stroke="#f59e0b"/>
<text x="355" y="55" font-size="14" fill="#1f2933" font-weight="bold">B</text>
<circle cx="245.0" cy="160.0" r="15" fill="#f3f4f6" stroke="#f59e0b"/>
<text x="245" y="165" font-size="14" fill="#1f2933" font-weight="bold">C</text>
<circle cx="355.0" cy="160.0" r="15" fill="#f3f4f6" stroke="#f59e0b"/>
<text x="355" y="165" font-size="14" fill="#1f2933" font-weight="bold">D</text>
<text x="300" y="202" font-size="13" fill="#f59e0b" font-weight="bold">longest A→B = 3</text>
<text x="300" y="220" font-size="12" fill="#374151">A → C → D → B</text>
<line x1="440.0" y1="50.0" x2="550.0" y2="50.0" stroke="#d1d5db" stroke-width="2"/>
<line x1="440.0" y1="50.0" x2="440.0" y2="160.0" stroke="#d1d5db" stroke-width="2"/>
<line x1="550.0" y1="50.0" x2="440.0" y2="160.0" stroke="#d1d5db" stroke-width="2"/>
<line x1="550.0" y1="50.0" x2="550.0" y2="160.0" stroke="#d1d5db" stroke-width="2"/>
<line x1="440.0" y1="160.0" x2="550.0" y2="160.0" stroke="#d1d5db" stroke-width="2"/>
<line x1="533.0" y1="50.0" x2="457.0" y2="50.0" stroke="#3b82f6" stroke-width="3" marker-end="url(#a1)"/>
<line x1="440.0" y1="67.0" x2="440.0" y2="143.0" stroke="#3b82f6" stroke-width="3" marker-end="url(#a1)"/>
<line x1="457.0" y1="160.0" x2="533.0" y2="160.0" stroke="#3b82f6" stroke-width="3" marker-end="url(#a1)"/>
<circle cx="440.0" cy="50.0" r="15" fill="#f3f4f6" stroke="#3b82f6"/>
<text x="440" y="55" font-size="14" fill="#1f2933" font-weight="bold">A</text>
<circle cx="550.0" cy="50.0" r="15" fill="#f3f4f6" stroke="#3b82f6"/>
<text x="550" y="55" font-size="14" fill="#1f2933" font-weight="bold">B</text>
<circle cx="440.0" cy="160.0" r="15" fill="#f3f4f6" stroke="#3b82f6"/>
<text x="440" y="165" font-size="14" fill="#1f2933" font-weight="bold">C</text>
<circle cx="550.0" cy="160.0" r="15" fill="#f3f4f6" stroke="#3b82f6"/>
<text x="550" y="165" font-size="14" fill="#1f2933" font-weight="bold">D</text>
<text x="495" y="202" font-size="13" fill="#3b82f6" font-weight="bold">longest B→D = 3</text>
<text x="495" y="220" font-size="12" fill="#374151">B → A → C → D</text>
<text x="300" y="22" font-size="12" fill="#6b7280">All edges have weight 1</text>
</g>
</svg>
