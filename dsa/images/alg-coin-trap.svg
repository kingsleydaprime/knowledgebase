<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 190" width="440" height="190" role="img">
<title>Making 6 from coins 1, 3 and 4: greedy grabs the biggest coin first and ends with 4 + 1 + 1, three coins; the best answer is 3 + 3, two coins</title>
<rect width="100%" height="100%" rx="8" fill="#ffffff"/>
<g font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#1f2933">
<text x="20" y="60" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="start">greedy (biggest first)</text>
<circle cx="232.0" cy="55.0" r="32" fill="#fde68a" stroke="#1f2933"/>
<text x="232" y="61" font-size="16" font-weight="bold">4</text>
<circle cx="294.0" cy="55.0" r="20" fill="#e5e7eb" stroke="#1f2933"/>
<text x="294" y="61" font-size="16" font-weight="bold">1</text>
<circle cx="344.0" cy="55.0" r="20" fill="#e5e7eb" stroke="#1f2933"/>
<text x="344" y="61" font-size="16" font-weight="bold">1</text>
<text x="398" y="60" font-size="13" fill="#dc2626" font-weight="bold">3 coins</text>
<text x="20" y="145" font-size="13" font-weight="bold" fill="#059669" text-anchor="start">best (found by DP)</text>
<circle cx="228.0" cy="140.0" r="28" fill="#bfdbfe" stroke="#1f2933"/>
<text x="228" y="146" font-size="16" font-weight="bold">3</text>
<circle cx="294.0" cy="140.0" r="28" fill="#bfdbfe" stroke="#1f2933"/>
<text x="294" y="146" font-size="16" font-weight="bold">3</text>
<text x="356" y="145" font-size="13" fill="#059669" font-weight="bold">2 coins</text>
</g>
</svg>
