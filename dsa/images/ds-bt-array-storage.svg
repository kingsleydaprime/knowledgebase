<line x1="70.0" y1="96.0" x2="42.0" y2="158.0" stroke="#1f2933" stroke-width="1.3"/>
<line x1="70.0" y1="96.0" x2="98.0" y2="158.0" stroke="#1f2933" stroke-width="1.3"/>
<line x1="182.0" y1="96.0" x2="154.0" y2="158.0" stroke="#1f2933" stroke-width="1.3"/>
<circle cx="126.0" cy="34.0" r="17" fill="#dbeafe" stroke="#1f2933" stroke-width="1.3"/>
<text x="126.0" y="39.0" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">A</text>
<text x="146.0" y="22.0" font-size="10" fill="#3b82f6" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">0</text>
<circle cx="70.0" cy="96.0" r="17" fill="#fef3c7" stroke="#f59e0b" stroke-width="3"/>
