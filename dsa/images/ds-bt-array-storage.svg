<text x="90.0" y="84.0" font-size="10" fill="#3b82f6" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">1</text>
<circle cx="182.0" cy="96.0" r="17" fill="#dbeafe" stroke="#1f2933" stroke-width="1.3"/>
<text x="182.0" y="101.0" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">C</text>
<text x="202.0" y="84.0" font-size="10" fill="#3b82f6" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">2</text>
<circle cx="42.0" cy="158.0" r="17" fill="#fef3c7" stroke="#f59e0b" stroke-width="3"/>
<text x="42.0" y="163.0" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">D</text>
<text x="62.0" y="146.0" font-size="10" fill="#3b82f6" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">3</text>
<circle cx="98.0" cy="158.0" r="17" fill="#dbeafe" stroke="#1f2933" stroke-width="1.3"/>
<text x="98.0" y="163.0" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">E</text>
<text x="118.0" y="146.0" font-size="10" fill="#3b82f6" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">4</text>
<circle cx="154.0" cy="158.0" r="17" fill="#dbeafe" stroke="#1f2933" stroke-width="1.3"/>
<text x="154.0" y="163.0" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">F</text>
<text x="174.0" y="146.0" font-size="10" fill="#3b82f6" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">5</text>
<rect x="240.0" y="60.0" width="36.0" height="32.0" fill="#dbeafe" stroke="#1f2933" stroke-width="1.1" fill-opacity="1"/>
<text x="258.0" y="81.0" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">A</text>
<text x="258.0" y="106.0" font-size="10" fill="#3b82f6" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">0</text>
<rect x="276.0" y="60.0" width="36.0" height="32.0" fill="#fef3c7" stroke="#f59e0b" stroke-width="3" fill-opacity="1"/>
