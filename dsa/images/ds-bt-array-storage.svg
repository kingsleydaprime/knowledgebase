<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 250" width="470" height="250" role="img">
<title>Complete binary tree A to F numbered level by level, A at index 0 to F at index 5, stored as the array A, B, C, D, E, F. The left child of B (index 1) is at 2 × 1 + 1 = 3, which is D; the parent of E (index 4) is at (4 − 1) // 2 = 1, which is B</title>
<rect width="100%" height="100%" rx="8" fill="#ffffff"/>
<line x1="126.0" y1="34.0" x2="70.0" y2="96.0" stroke="#1f2933" stroke-width="1.3"/>
