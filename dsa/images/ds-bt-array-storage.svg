<text x="330.0" y="106.0" font-size="10" fill="#3b82f6" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">2</text>
<rect x="348.0" y="60.0" width="36.0" height="32.0" fill="#fef3c7" stroke="#f59e0b" stroke-width="3" fill-opacity="1"/>
<text x="366.0" y="81.0" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">D</text>
<text x="366.0" y="106.0" font-size="10" fill="#3b82f6" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">3</text>
<rect x="384.0" y="60.0" width="36.0" height="32.0" fill="#dbeafe" stroke="#1f2933" stroke-width="1.1" fill-opacity="1"/>
<text x="402.0" y="81.0" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">E</text>
<text x="402.0" y="106.0" font-size="10" fill="#3b82f6" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">4</text>
<rect x="420.0" y="60.0" width="36.0" height="32.0" fill="#dbeafe" stroke="#1f2933" stroke-width="1.1" fill-opacity="1"/>
<text x="438.0" y="81.0" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">F</text>
<text x="438.0" y="106.0" font-size="10" fill="#3b82f6" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">5</text>
<text x="240.0" y="30.0" font-size="11" fill="#6b7280" text-anchor="start" font-weight="normal" font-family="system-ui, sans-serif">array, index under each cell</text>
<text x="240.0" y="140.0" font-size="12" fill="#f59e0b" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">left child of B (1): 2·1 + 1 = 3 → D</text>
<text x="240.0" y="162.0" font-size="12" fill="#1f2933" text-anchor="start" font-weight="normal" font-family="system-ui, sans-serif">right child of B (1): 2·1 + 2 = 4 → E</text>
<text x="240.0" y="184.0" font-size="12" fill="#1f2933" text-anchor="start" font-weight="normal" font-family="system-ui, sans-serif">parent of E (4): (4 − 1) // 2 = 1 → B</text>
<text x="240.0" y="206.0" font-size="12" fill="#1f2933" text-anchor="start" font-weight="normal" font-family="system-ui, sans-serif">parent of F (5): (5 − 1) // 2 = 2 → C</text>
<text x="20.0" y="236.0" font-size="11" fill="#3b82f6" text-anchor="start" font-weight="normal" font-family="system-ui, sans-serif">blue numbers = array index</text>
</svg>
