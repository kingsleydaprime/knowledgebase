<text x="300.0" y="176.0" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">dp[a] = 1 + min(dp[a − c]) over coins c ≤ a.  Fewest coins for 11: 1 + 5 + 5 = 3 coins.</text>
