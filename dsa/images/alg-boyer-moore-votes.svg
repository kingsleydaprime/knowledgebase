<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 534 250" width="534" height="250" role="img">
<title>Boyer-Moore voting on A, B, A, A, C, A, B, A, A: the count goes 1, 0, 1, 2, 1, 2, 1, 2, 3; every different vote cancels one A, the count never stays at zero, and A survives as the candidate with count 3; a second pass confirms A appears 6 times out of 9</title>
