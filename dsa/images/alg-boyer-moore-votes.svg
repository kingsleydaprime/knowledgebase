<text x="491" y="50" font-size="14">A</text>
<text x="491" y="24" font-size="10" fill="#6b7280">8</text>
<text x="90" y="84" font-size="12" font-weight="bold" text-anchor="end">what happens</text>
<text x="90" y="140" font-size="12" font-weight="bold" text-anchor="end">count</text>
<text x="123" y="84" font-size="11" fill="#374151">adopt</text>
<rect x="108" y="158" width="30" height="22" fill="#93c5fd" stroke="#3b82f6"/>
<text x="123" y="153" font-size="12" font-weight="bold">1</text>
