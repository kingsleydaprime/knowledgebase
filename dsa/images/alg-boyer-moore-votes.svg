<text x="215" y="200" font-size="13" fill="#059669" font-weight="bold">A</text>
<text x="261" y="200" font-size="13" fill="#059669" font-weight="bold">A</text>
<text x="307" y="200" font-size="13" fill="#059669" font-weight="bold">A</text>
<text x="353" y="200" font-size="13" fill="#059669" font-weight="bold">A</text>
<text x="399" y="200" font-size="13" fill="#059669" font-weight="bold">A</text>
<text x="445" y="200" font-size="13" fill="#059669" font-weight="bold">A</text>
<text x="491" y="200" font-size="13" fill="#059669" font-weight="bold">A</text>
<text x="267" y="236" font-size="11">Candidate A survives with count 3. Then count it for real: 6 of 9 &gt; 4.5, so A is the leader.</text>
