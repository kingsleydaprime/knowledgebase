<text x="307" y="84" font-size="11" fill="#374151">−1</text>
<rect x="292" y="158" width="30" height="22" fill="#93c5fd" stroke="#3b82f6"/>
<text x="307" y="153" font-size="12" font-weight="bold">1</text>
<text x="353" y="84" font-size="11" fill="#374151">+1</text>
