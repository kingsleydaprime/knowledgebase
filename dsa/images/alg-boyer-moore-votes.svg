<text x="307" y="24" font-size="10" fill="#6b7280">4</text>
<rect x="330" y="30" width="46" height="30" fill="#d1fae5" stroke="#1f2933"/>
<text x="353" y="50" font-size="14">A</text>
<text x="353" y="24" font-size="10" fill="#6b7280">5</text>
<rect x="376" y="30" width="46" height="30" fill="#fee2e2" stroke="#1f2933"/>
<text x="399" y="50" font-size="14">B</text>
<text x="399" y="24" font-size="10" fill="#6b7280">6</text>
<rect x="422" y="30" width="46" height="30" fill="#d1fae5" stroke="#1f2933"/>
<text x="445" y="50" font-size="14">A</text>
