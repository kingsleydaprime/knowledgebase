<text x="294.0" y="209.0" font-size="11" fill="#b45309" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">d2 h0</text>
<rect x="268.0" y="106.0" width="52" height="40" rx="8" fill="#dbeafe" stroke="#1f2933" stroke-width="1.3"/>
<text x="294.0" y="123.0" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">C</text>
<text x="294.0" y="139.0" font-size="11" fill="#b45309" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">d1 h1</text>
