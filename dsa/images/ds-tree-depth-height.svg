<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 254" width="420" height="254" role="img">
<title>Depth and height on the tree A to F. Depths: A 0, B and C 1, D, E and F 2. Heights: D, E and F 0, B and C 1, A 2, so the height of the tree is 2</title>
<rect width="100%" height="100%" rx="8" fill="#ffffff"/>
<rect x="10.0" y="32.0" width="400.0" height="48.0" fill="#eef2ff" stroke="none" stroke-width="1" fill-opacity="1"/>
<text x="18.0" y="60.0" font-size="11" fill="#6b7280" text-anchor="start" font-weight="normal" font-family="system-ui, sans-serif">level 0</text>
<rect x="10.0" y="102.0" width="400.0" height="48.0" fill="#f9fafb" stroke="none" stroke-width="1" fill-opacity="1"/>
<text x="18.0" y="130.0" font-size="11" fill="#6b7280" text-anchor="start" font-weight="normal" font-family="system-ui, sans-serif">level 1</text>
<rect x="10.0" y="172.0" width="400.0" height="48.0" fill="#eef2ff" stroke="none" stroke-width="1" fill-opacity="1"/>
<text x="18.0" y="200.0" font-size="11" fill="#6b7280" text-anchor="start" font-weight="normal" font-family="system-ui, sans-serif">level 2</text>
<text x="210.0" y="18.0" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">d = depth (edges down from the root)   h = height (edges down to its deepest leaf)</text>
<line x1="246.0" y1="56.0" x2="198.0" y2="126.0" stroke="#1f2933" stroke-width="1.4"/>
<line x1="246.0" y1="56.0" x2="294.0" y2="126.0" stroke="#1f2933" stroke-width="1.4"/>
<line x1="198.0" y1="126.0" x2="166.0" y2="196.0" stroke="#1f2933" stroke-width="1.4"/>
<line x1="198.0" y1="126.0" x2="230.0" y2="196.0" stroke="#1f2933" stroke-width="1.4"/>
<line x1="294.0" y1="126.0" x2="294.0" y2="196.0" stroke="#1f2933" stroke-width="1.4"/>
<rect x="140.0" y="176.0" width="52" height="40" rx="8" fill="#dbeafe" stroke="#1f2933" stroke-width="1.3"/>
<text x="166.0" y="193.0" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">D</text>
<text x="166.0" y="209.0" font-size="11" fill="#b45309" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">d2 h0</text>
<rect x="204.0" y="176.0" width="52" height="40" rx="8" fill="#dbeafe" stroke="#1f2933" stroke-width="1.3"/>
<text x="230.0" y="193.0" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">E</text>
<text x="230.0" y="209.0" font-size="11" fill="#b45309" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">d2 h0</text>
<rect x="172.0" y="106.0" width="52" height="40" rx="8" fill="#dbeafe" stroke="#1f2933" stroke-width="1.3"/>
<text x="198.0" y="123.0" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">B</text>
<text x="198.0" y="139.0" font-size="11" fill="#b45309" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">d1 h1</text>
<rect x="268.0" y="176.0" width="52" height="40" rx="8" fill="#dbeafe" stroke="#1f2933" stroke-width="1.3"/>
