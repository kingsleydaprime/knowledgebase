<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 175" width="360" height="175" role="img">
<title>Array of 4-byte integers 10, 22, 7, 41, 3 starting at address 1000; arr[3] = 41 is found directly at 1000 + 3 × 4 = 1012</title>
<rect width="100%" height="100%" rx="8" fill="#ffffff"/>
<text x="20.0" y="24.0" font-size="11" fill="#6b7280" text-anchor="start" font-weight="normal" font-family="system-ui, sans-serif">index</text>
<text x="95.0" y="24.0" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">0</text>
<text x="145.0" y="24.0" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">1</text>
<text x="195.0" y="24.0" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">2</text>
<text x="245.0" y="24.0" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">3</text>
<text x="295.0" y="24.0" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">4</text>
<rect x="70.0" y="32.0" width="50.0" height="38.0" fill="#dbeafe" stroke="#1f2933" stroke-width="1.2" fill-opacity="1"/>
<text x="95.0" y="56.0" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">10</text>
<rect x="120.0" y="32.0" width="50.0" height="38.0" fill="#dbeafe" stroke="#1f2933" stroke-width="1.2" fill-opacity="1"/>
<text x="145.0" y="56.0" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">22</text>
<rect x="170.0" y="32.0" width="50.0" height="38.0" fill="#dbeafe" stroke="#1f2933" stroke-width="1.2" fill-opacity="1"/>
<text x="195.0" y="56.0" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">7</text>
<rect x="220.0" y="32.0" width="50.0" height="38.0" fill="#fef3c7" stroke="#f59e0b" stroke-width="3" fill-opacity="1"/>
<text x="245.0" y="56.0" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">41</text>
<rect x="270.0" y="32.0" width="50.0" height="38.0" fill="#dbeafe" stroke="#1f2933" stroke-width="1.2" fill-opacity="1"/>
<text x="295.0" y="56.0" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">3</text>
<text x="20.0" y="56.0" font-size="11" fill="#6b7280" text-anchor="start" font-weight="normal" font-family="system-ui, sans-serif">value</text>
<text x="20.0" y="92.0" font-size="11" fill="#6b7280" text-anchor="start" font-weight="normal" font-family="system-ui, sans-serif">address</text>
<text x="95.0" y="92.0" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">1000</text>
<text x="145.0" y="92.0" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">1004</text>
<text x="195.0" y="92.0" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">1008</text>
<text x="245.0" y="92.0" font-size="12" fill="#f59e0b" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">1012</text>
<text x="295.0" y="92.0" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">1016</text>
<text x="180.0" y="130.0" font-size="15" fill="#f59e0b" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">arr[3]  →  1000 + 3 × 4 = 1012</text>
<text x="180.0" y="156.0" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">one multiply, one add: no walking past 0, 1, 2</text>
</svg>
