<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 330" width="470" height="330" role="img">
<title>Counting sort on [2, 5, 3, 0, 2, 3, 0, 3] with keys 0 to 5: the counts are [2, 0, 2, 3, 0, 1]; the prefix sums [2, 2, 4, 7, 7, 8] say where each key's run ends; walking the input backwards places every element, giving [0, 0, 2, 2, 3, 3, 3, 5]</title>
<rect width="100%" height="100%" rx="8" fill="#ffffff"/>
<g font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#1f2933">
