<text x="204" y="59" font-size="13">5</text>
<text x="204" y="34" font-size="10" fill="#6b7280">1</text>
<rect x="222" y="40" width="36" height="28" fill="#fee2e2" stroke="#1f2933"/>
<text x="240" y="59" font-size="13">3</text>
<text x="240" y="34" font-size="10" fill="#6b7280">2</text>
<rect x="258" y="40" width="36" height="28" fill="#dbeafe" stroke="#1f2933"/>
<text x="276" y="59" font-size="13">0</text>
<text x="276" y="34" font-size="10" fill="#6b7280">3</text>
<rect x="294" y="40" width="36" height="28" fill="#d1fae5" stroke="#1f2933"/>
<text x="312" y="59" font-size="13">2</text>
<text x="312" y="34" font-size="10" fill="#6b7280">4</text>
<rect x="330" y="40" width="36" height="28" fill="#fee2e2" stroke="#1f2933"/>
<text x="348" y="59" font-size="13">3</text>
<text x="348" y="34" font-size="10" fill="#6b7280">5</text>
<rect x="366" y="40" width="36" height="28" fill="#dbeafe" stroke="#1f2933"/>
<text x="384" y="59" font-size="13">0</text>
<text x="384" y="34" font-size="10" fill="#6b7280">6</text>
<rect x="402" y="40" width="36" height="28" fill="#fee2e2" stroke="#1f2933"/>
<text x="420" y="59" font-size="13">3</text>
<text x="420" y="34" font-size="10" fill="#6b7280">7</text>
<text x="138" y="34" font-size="10" fill="#6b7280" text-anchor="end">index</text>
<text x="138" y="130" font-size="12" font-weight="bold" text-anchor="end">2. count of each key</text>
<rect x="150" y="112" width="36" height="28" fill="#dbeafe" stroke="#1f2933"/>
<text x="168" y="131" font-size="13">2</text>
<text x="168" y="106" font-size="10" fill="#6b7280">0</text>
<rect x="186" y="112" width="36" height="28" fill="#fef3c7" stroke="#1f2933"/>
<text x="204" y="131" font-size="13">0</text>
<text x="204" y="106" font-size="10" fill="#6b7280">1</text>
<rect x="222" y="112" width="36" height="28" fill="#d1fae5" stroke="#1f2933"/>
<text x="240" y="131" font-size="13">2</text>
<text x="240" y="106" font-size="10" fill="#6b7280">2</text>
<rect x="258" y="112" width="36" height="28" fill="#fee2e2" stroke="#1f2933"/>
<text x="276" y="131" font-size="13">3</text>
<text x="276" y="106" font-size="10" fill="#6b7280">3</text>
<rect x="294" y="112" width="36" height="28" fill="#ede9fe" stroke="#1f2933"/>
<text x="312" y="131" font-size="13">0</text>
<text x="312" y="106" font-size="10" fill="#6b7280">4</text>
<rect x="330" y="112" width="36" height="28" fill="#fce7f3" stroke="#1f2933"/>
<text x="348" y="131" font-size="13">1</text>
<text x="348" y="106" font-size="10" fill="#6b7280">5</text>
<text x="138" y="106" font-size="10" fill="#6b7280" text-anchor="end">key</text>
<text x="138" y="202" font-size="12" font-weight="bold" text-anchor="end">3. prefix sums: run ends</text>
