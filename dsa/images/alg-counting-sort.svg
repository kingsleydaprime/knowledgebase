<rect x="258" y="184" width="36" height="28" fill="#fee2e2" stroke="#1f2933"/>
<text x="276" y="203" font-size="13">7</text>
<text x="276" y="178" font-size="10" fill="#6b7280">3</text>
<rect x="294" y="184" width="36" height="28" fill="#ede9fe" stroke="#1f2933"/>
<text x="312" y="203" font-size="13">7</text>
<text x="312" y="178" font-size="10" fill="#6b7280">4</text>
<rect x="330" y="184" width="36" height="28" fill="#fce7f3" stroke="#1f2933"/>
<text x="348" y="203" font-size="13">8</text>
<text x="348" y="178" font-size="10" fill="#6b7280">5</text>
<text x="138" y="178" font-size="10" fill="#6b7280" text-anchor="end">key</text>
<text x="138" y="274" font-size="12" font-weight="bold" text-anchor="end">4. output</text>
<rect x="150" y="256" width="36" height="28" fill="#dbeafe" stroke="#1f2933"/>
<text x="168" y="275" font-size="13">0</text>
<text x="168" y="250" font-size="10" fill="#6b7280">0</text>
<rect x="186" y="256" width="36" height="28" fill="#dbeafe" stroke="#1f2933"/>
<text x="204" y="275" font-size="13">0</text>
<text x="204" y="250" font-size="10" fill="#6b7280">1</text>
