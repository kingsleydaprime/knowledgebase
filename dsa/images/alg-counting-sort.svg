<text x="312" y="250" font-size="10" fill="#6b7280">4</text>
<rect x="330" y="256" width="36" height="28" fill="#fee2e2" stroke="#1f2933"/>
<text x="348" y="275" font-size="13">3</text>
<text x="348" y="250" font-size="10" fill="#6b7280">5</text>
<rect x="366" y="256" width="36" height="28" fill="#fee2e2" stroke="#1f2933"/>
<text x="384" y="275" font-size="13">3</text>
<text x="384" y="250" font-size="10" fill="#6b7280">6</text>
<rect x="402" y="256" width="36" height="28" fill="#fce7f3" stroke="#1f2933"/>
<text x="420" y="275" font-size="13">5</text>
<text x="420" y="250" font-size="10" fill="#6b7280">7</text>
<text x="138" y="250" font-size="10" fill="#6b7280" text-anchor="end">index</text>
<text x="235" y="322" font-size="11">Same colour = same key. The prefix sum for key 3 is 7, so the 3s fill positions 4, 5 and 6.</text>
</g>
</svg>
