<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 570 380" width="570" height="380" role="img">
<title>A min-heap of size 2 finding the 2nd largest of 3, 2, 1, 5, 6, 4: each panel shows the heap right after a push; once it holds 3 values the smallest, at the root, is popped (red): 1, then 2, then 3, then 4; the heap ends as 5 and 6, and its root 5 is the answer</title>
<rect width="100%" height="100%" rx="8" fill="#ffffff"/>
<text x="95.0" y="24.0" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">push 3</text>
