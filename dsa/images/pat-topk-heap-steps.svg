<text x="285.0" y="324.0" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">heap now [5,6]</text>
<line x1="190.0" y1="182.0" x2="190.0" y2="332.0" stroke="#e5e7eb" stroke-width="1"/>
