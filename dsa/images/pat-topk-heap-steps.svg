<text x="285.0" y="136.0" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">size ≤ 2: keep</text>
<text x="285.0" y="154.0" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">heap now [2,3]</text>
