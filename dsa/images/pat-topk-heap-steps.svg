<line x1="475.0" y1="65.0" x2="507.5" y2="79.0" stroke="#1f2933" stroke-width="1.2"/>
<circle cx="475.0" cy="50.0" r="15" fill="#fee2e2" stroke="#f59e0b" stroke-width="2.6"/>
<text x="475.0" y="55.0" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">1</text>
