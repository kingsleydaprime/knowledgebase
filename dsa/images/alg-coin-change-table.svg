<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 200" width="420" height="200" role="img">
<title>Coin change with coins 1, 3 and 4 for amounts 0 to 6: best is 0, 1, 2, 1, 1, 2, 2; the last coin row says 6 came from a 3 and 3 came from a 3, so the answer is 3 + 3, two coins</title>
