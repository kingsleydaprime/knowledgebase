<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 330" width="520" height="330" role="img">
<title>Halving loop from 1000: 1000, 500, 250, 125, 62, 31, 15, 7, 3, 1, which is 9 passes, close to log base 2 of 1000, about 10</title>
<rect width="100%" height="100%" rx="8" fill="#ffffff"/>
<text x="60.0" y="45.0" font-size="11" fill="#6b7280" text-anchor="end" font-weight="normal" font-family="system-ui, sans-serif">start</text>
<rect x="70.0" y="32.0" width="380.0" height="18.0" fill="#1f2933" stroke="none" stroke-width="1" fill-opacity="1"/>
<text x="458.0" y="46.0" font-size="12" fill="#1f2933" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">1000</text>
<text x="60.0" y="71.0" font-size="11" fill="#6b7280" text-anchor="end" font-weight="normal" font-family="system-ui, sans-serif">pass 1</text>
<rect x="70.0" y="58.0" width="190.0" height="18.0" fill="#3b82f6" stroke="none" stroke-width="1" fill-opacity="1"/>
<text x="268.0" y="72.0" font-size="12" fill="#1f2933" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">500</text>
<text x="60.0" y="97.0" font-size="11" fill="#6b7280" text-anchor="end" font-weight="normal" font-family="system-ui, sans-serif">pass 2</text>
<rect x="70.0" y="84.0" width="95.0" height="18.0" fill="#3b82f6" stroke="none" stroke-width="1" fill-opacity="1"/>
<text x="173.0" y="98.0" font-size="12" fill="#1f2933" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">250</text>
<text x="60.0" y="123.0" font-size="11" fill="#6b7280" text-anchor="end" font-weight="normal" font-family="system-ui, sans-serif">pass 3</text>
<rect x="70.0" y="110.0" width="47.5" height="18.0" fill="#3b82f6" stroke="none" stroke-width="1" fill-opacity="1"/>
<text x="125.5" y="124.0" font-size="12" fill="#1f2933" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">125</text>
<text x="60.0" y="149.0" font-size="11" fill="#6b7280" text-anchor="end" font-weight="normal" font-family="system-ui, sans-serif">pass 4</text>
<rect x="70.0" y="136.0" width="23.6" height="18.0" fill="#3b82f6" stroke="none" stroke-width="1" fill-opacity="1"/>
<text x="101.6" y="150.0" font-size="12" fill="#1f2933" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">62</text>
<text x="60.0" y="175.0" font-size="11" fill="#6b7280" text-anchor="end" font-weight="normal" font-family="system-ui, sans-serif">pass 5</text>
<rect x="70.0" y="162.0" width="11.8" height="18.0" fill="#3b82f6" stroke="none" stroke-width="1" fill-opacity="1"/>
<text x="89.8" y="176.0" font-size="12" fill="#1f2933" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">31</text>
<text x="60.0" y="201.0" font-size="11" fill="#6b7280" text-anchor="end" font-weight="normal" font-family="system-ui, sans-serif">pass 6</text>
<rect x="70.0" y="188.0" width="5.7" height="18.0" fill="#3b82f6" stroke="none" stroke-width="1" fill-opacity="1"/>
<text x="83.7" y="202.0" font-size="12" fill="#1f2933" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">15</text>
<text x="60.0" y="227.0" font-size="11" fill="#6b7280" text-anchor="end" font-weight="normal" font-family="system-ui, sans-serif">pass 7</text>
<rect x="70.0" y="214.0" width="2.7" height="18.0" fill="#3b82f6" stroke="none" stroke-width="1" fill-opacity="1"/>
<text x="80.7" y="228.0" font-size="12" fill="#1f2933" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">7</text>
<text x="60.0" y="253.0" font-size="11" fill="#6b7280" text-anchor="end" font-weight="normal" font-family="system-ui, sans-serif">pass 8</text>
<rect x="70.0" y="240.0" width="2.0" height="18.0" fill="#3b82f6" stroke="none" stroke-width="1" fill-opacity="1"/>
