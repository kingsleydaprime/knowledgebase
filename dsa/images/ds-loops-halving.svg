<text x="60.0" y="279.0" font-size="11" fill="#6b7280" text-anchor="end" font-weight="normal" font-family="system-ui, sans-serif">pass 9</text>
<rect x="70.0" y="266.0" width="2.0" height="18.0" fill="#3b82f6" stroke="none" stroke-width="1" fill-opacity="1"/>
