<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 672" width="500" height="672" role="img">
<title>Union-find with union by rank and path compression on elements 0 to 5. union(0, 1): 1 points to 0. union(2, 3): 3 points to 2. union(4, 5): 5 points to 4. union(1, 3): root 2 joins root 0. union(5, 3): find(3) compresses so 3 points straight at 0, and root 4 joins root 0, leaving one group with root 0 and 5 under 4</title>
