<line x1="344.0" y1="238.0" x2="426.0" y2="238.0" stroke="#1f2933" stroke-width="2"/>
<line x1="350.0" y1="238.0" x2="350.0" y2="130.0" stroke="#9ca3af" stroke-width="1"/>
<line x1="420.0" y1="238.0" x2="420.0" y2="130.0" stroke="#9ca3af" stroke-width="1"/>
<text x="493.0" y="24.0" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">i = 4, num = 3</text>
<text x="493.0" y="46.0" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">no pops</text>
<rect x="458.0" y="208.0" width="70.0" height="30.0" fill="#dbeafe" stroke="#1f2933" stroke-width="1.2" fill-opacity="1"/>
<text x="493.0" y="228.0" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">[3] = 4</text>
<rect x="458.0" y="178.0" width="70.0" height="30.0" fill="#d1fae5" stroke="#1f2933" stroke-width="1.2" fill-opacity="1"/>
<text x="493.0" y="198.0" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">[4] = 3</text>
<line x1="452.0" y1="238.0" x2="534.0" y2="238.0" stroke="#1f2933" stroke-width="2"/>
<line x1="458.0" y1="238.0" x2="458.0" y2="130.0" stroke="#9ca3af" stroke-width="1"/>
