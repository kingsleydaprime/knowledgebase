<text x="169.0" y="24.0" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">i = 1, num = 1</text>
<text x="169.0" y="46.0" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">no pops</text>
