<text x="169.0" y="228.0" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">[0] = 2</text>
<rect x="134.0" y="178.0" width="70.0" height="30.0" fill="#d1fae5" stroke="#1f2933" stroke-width="1.2" fill-opacity="1"/>
<text x="169.0" y="198.0" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">[1] = 1</text>
<line x1="128.0" y1="238.0" x2="210.0" y2="238.0" stroke="#1f2933" stroke-width="2"/>
<line x1="134.0" y1="238.0" x2="134.0" y2="130.0" stroke="#9ca3af" stroke-width="1"/>
<line x1="204.0" y1="238.0" x2="204.0" y2="130.0" stroke="#9ca3af" stroke-width="1"/>
<text x="277.0" y="24.0" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">i = 2, num = 2</text>
<text x="277.0" y="46.0" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">pop 1: result[1] = 2</text>
<rect x="242.0" y="208.0" width="70.0" height="30.0" fill="#dbeafe" stroke="#1f2933" stroke-width="1.2" fill-opacity="1"/>
<text x="277.0" y="228.0" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">[0] = 2</text>
<rect x="242.0" y="178.0" width="70.0" height="30.0" fill="#d1fae5" stroke="#1f2933" stroke-width="1.2" fill-opacity="1"/>
<text x="277.0" y="198.0" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">[2] = 2</text>
<line x1="236.0" y1="238.0" x2="318.0" y2="238.0" stroke="#1f2933" stroke-width="2"/>
<line x1="242.0" y1="238.0" x2="242.0" y2="130.0" stroke="#9ca3af" stroke-width="1"/>
<line x1="312.0" y1="238.0" x2="312.0" y2="130.0" stroke="#9ca3af" stroke-width="1"/>
<text x="385.0" y="24.0" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">i = 3, num = 4</text>
<text x="385.0" y="46.0" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">pop 2: result[2] = 4</text>
<text x="385.0" y="63.0" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">pop 0: result[0] = 4</text>
<rect x="350.0" y="208.0" width="70.0" height="30.0" fill="#d1fae5" stroke="#1f2933" stroke-width="1.2" fill-opacity="1"/>
