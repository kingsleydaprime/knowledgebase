<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 570 330" width="570" height="330" role="img">
<title>The stack after each step of next greater element on 2, 1, 2, 4, 3: step 0 pushes index 0; step 1 pushes 1; step 2 pops index 1 (answer 2) and pushes 2; step 3 pops 2 and 0 (answer 4 for both) and pushes 3; step 4 pushes 4; the result is 4, 2, 4, -1, -1</title>
<rect width="100%" height="100%" rx="8" fill="#ffffff"/>
<text x="61.0" y="24.0" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">i = 0, num = 2</text>
<text x="61.0" y="46.0" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">no pops</text>
<rect x="26.0" y="208.0" width="70.0" height="30.0" fill="#d1fae5" stroke="#1f2933" stroke-width="1.2" fill-opacity="1"/>
<text x="61.0" y="228.0" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">[0] = 2</text>
<line x1="20.0" y1="238.0" x2="102.0" y2="238.0" stroke="#1f2933" stroke-width="2"/>
<line x1="26.0" y1="238.0" x2="26.0" y2="130.0" stroke="#9ca3af" stroke-width="1"/>
