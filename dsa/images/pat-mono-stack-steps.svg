<text x="20.0" y="262.0" font-size="11" fill="#6b7280" text-anchor="start" font-weight="normal" font-family="system-ui, sans-serif">Each stack lists index = value, bottom to top; values never rise going up. Green = just pushed.</text>
<text x="20.0" y="300.0" font-size="13" fill="#1f2933" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">result</text>
<rect x="80.0" y="280.0" width="44.0" height="30.0" fill="#d1fae5" stroke="#1f2933" stroke-width="1.2" fill-opacity="1"/>
<text x="102.0" y="300.0" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">4</text>
<rect x="124.0" y="280.0" width="44.0" height="30.0" fill="#d1fae5" stroke="#1f2933" stroke-width="1.2" fill-opacity="1"/>
<text x="146.0" y="300.0" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">2</text>
<rect x="168.0" y="280.0" width="44.0" height="30.0" fill="#d1fae5" stroke="#1f2933" stroke-width="1.2" fill-opacity="1"/>
<text x="190.0" y="300.0" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">4</text>
<rect x="212.0" y="280.0" width="44.0" height="30.0" fill="#ffffff" stroke="#1f2933" stroke-width="1.2" fill-opacity="1"/>
<text x="234.0" y="300.0" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">-1</text>
<rect x="256.0" y="280.0" width="44.0" height="30.0" fill="#ffffff" stroke="#1f2933" stroke-width="1.2" fill-opacity="1"/>
<text x="278.0" y="300.0" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">-1</text>
<text x="310.0" y="300.0" font-size="11" fill="#6b7280" text-anchor="start" font-weight="normal" font-family="system-ui, sans-serif">still on the stack at the end: -1</text>
</svg>
