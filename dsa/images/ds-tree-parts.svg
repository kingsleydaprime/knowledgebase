<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 250" width="420" height="250" role="img">
<title>A tree with root A; A has children B and C; B has children D and E; C has child F. D, E and F are leaves. B with D and E is a subtree</title>
<rect width="100%" height="100%" rx="8" fill="#ffffff"/>
<rect x="40.0" y="70.0" width="160.0" height="140.0" fill="#fef3c7" stroke="none" stroke-width="0" fill-opacity="0.6"/>
<text x="46.0" y="204.0" font-size="11" fill="#92400e" text-anchor="start" font-weight="normal" font-family="system-ui, sans-serif">subtree rooted at B</text>
<line x1="170.0" y1="40.0" x2="122.0" y2="110.0" stroke="#1f2933" stroke-width="1.4"/>
<line x1="170.0" y1="40.0" x2="218.0" y2="110.0" stroke="#1f2933" stroke-width="1.4"/>
<line x1="122.0" y1="110.0" x2="90.0" y2="180.0" stroke="#1f2933" stroke-width="1.4"/>
<line x1="122.0" y1="110.0" x2="154.0" y2="180.0" stroke="#1f2933" stroke-width="1.4"/>
<line x1="218.0" y1="110.0" x2="218.0" y2="180.0" stroke="#1f2933" stroke-width="1.4"/>
<circle cx="90.0" cy="180.0" r="17" fill="#d1fae5" stroke="#1f2933" stroke-width="1.3"/>
<text x="90.0" y="185.0" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">D</text>
<circle cx="154.0" cy="180.0" r="17" fill="#d1fae5" stroke="#1f2933" stroke-width="1.3"/>
<text x="154.0" y="185.0" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">E</text>
<circle cx="122.0" cy="110.0" r="17" fill="#dbeafe" stroke="#1f2933" stroke-width="1.3"/>
<text x="122.0" y="115.0" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">B</text>
<circle cx="218.0" cy="180.0" r="17" fill="#d1fae5" stroke="#1f2933" stroke-width="1.3"/>
<text x="218.0" y="185.0" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">F</text>
<circle cx="218.0" cy="110.0" r="17" fill="#dbeafe" stroke="#1f2933" stroke-width="1.3"/>
<text x="218.0" y="115.0" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">C</text>
<circle cx="170.0" cy="40.0" r="17" fill="#fde68a" stroke="#1f2933" stroke-width="1.3"/>
<text x="170.0" y="45.0" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">A</text>
<text x="196.0" y="45.0" font-size="12" fill="#1f2933" text-anchor="start" font-weight="normal" font-family="system-ui, sans-serif">← root (no parent)</text>
<text x="244.0" y="185.0" font-size="12" fill="#059669" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">← leaves (no children)</text>
