<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 250" width="440" height="250" role="img">
<title>A valid binary search tree: 8 at the root; 3 left with children 1 and 6, and 6 has 4 and 7; 10 right with right child 14, which has left child 13. Everything left of 8 is smaller, everything right is larger</title>
