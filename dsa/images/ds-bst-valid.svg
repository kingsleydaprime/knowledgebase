<text x="20.0" y="216.0" font-size="11" fill="#3b82f6" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">left of 8: 1, 3, 4, 6, 7 (all &lt; 8)</text>
<text x="414.0" y="216.0" font-size="11" fill="#059669" text-anchor="end" font-weight="bold" font-family="system-ui, sans-serif">right of 8: 10, 13, 14 (all &gt; 8)</text>
