<path d="M102.0,67.0 L96.0,76.0 L108.0,76.0 z" fill="#3b82f6"/>
<text x="102.0" y="89.0" font-size="12" fill="#3b82f6" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">left</text>
