<text x="190.0" y="24.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">2</text>
<rect x="212.0" y="30.0" width="44.0" height="34.0" fill="#ffffff" stroke="#1f2933" stroke-width="1.2" fill-opacity="1"/>
<text x="234.0" y="52.0" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">4</text>
