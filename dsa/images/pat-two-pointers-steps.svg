<text x="278.0" y="252.0" font-size="14" fill="#9ca3af" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">6</text>
<path d="M146.0,267.0 L140.0,276.0 L152.0,276.0 z" fill="#3b82f6"/>
<text x="146.0" y="289.0" font-size="12" fill="#3b82f6" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">left</text>
