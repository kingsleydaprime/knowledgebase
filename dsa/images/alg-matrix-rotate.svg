<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 210" width="540" height="210" role="img">
<title>Rotating a 3 by 3 matrix 90 degrees clockwise in place: the original 1 2 3 / 4 5 6 / 7 8 9 is transposed across its main diagonal to 1 4 7 / 2 5 8 / 3 6 9, then each row is reversed to give 7 4 1 / 8 5 2 / 9 6 3</title>
<rect width="100%" height="100%" rx="8" fill="#ffffff"/>
<g font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#1f2933">
<defs><marker id="a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b82f6"/></marker><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/></marker></defs>
<text x="80" y="30" font-size="13" font-weight="bold">original</text>
<rect x="20" y="44" width="40" height="40" fill="#fef3c7" stroke="#1f2933"/>
<text x="40" y="69" font-size="15">1</text>
<rect x="60" y="44" width="40" height="40" fill="#ffffff" stroke="#1f2933"/>
<text x="80" y="69" font-size="15">2</text>
<rect x="100" y="44" width="40" height="40" fill="#ffffff" stroke="#1f2933"/>
<text x="120" y="69" font-size="15">3</text>
<rect x="20" y="84" width="40" height="40" fill="#ffffff" stroke="#1f2933"/>
<text x="40" y="109" font-size="15">4</text>
<rect x="60" y="84" width="40" height="40" fill="#fef3c7" stroke="#1f2933"/>
<text x="80" y="109" font-size="15">5</text>
<rect x="100" y="84" width="40" height="40" fill="#ffffff" stroke="#1f2933"/>
<text x="120" y="109" font-size="15">6</text>
<rect x="20" y="124" width="40" height="40" fill="#dbeafe" stroke="#1f2933"/>
<text x="40" y="149" font-size="15">7</text>
<rect x="60" y="124" width="40" height="40" fill="#dbeafe" stroke="#1f2933"/>
<text x="80" y="149" font-size="15">8</text>
<rect x="100" y="124" width="40" height="40" fill="#dbeafe" stroke="#1f2933"/>
<text x="120" y="149" font-size="15">9</text>
<line x1="148.0" y1="104.0" x2="202.0" y2="104.0" stroke="#1f2933" stroke-width="2" marker-end="url(#a0)"/>
<text x="270" y="30" font-size="13" font-weight="bold">1. transpose</text>
<rect x="210" y="44" width="40" height="40" fill="#fef3c7" stroke="#1f2933"/>
<text x="230" y="69" font-size="15">1</text>
<rect x="250" y="44" width="40" height="40" fill="#ffffff" stroke="#1f2933"/>
<text x="270" y="69" font-size="15">4</text>
<rect x="290" y="44" width="40" height="40" fill="#dbeafe" stroke="#1f2933"/>
<text x="310" y="69" font-size="15">7</text>
<rect x="210" y="84" width="40" height="40" fill="#ffffff" stroke="#1f2933"/>
<text x="230" y="109" font-size="15">2</text>
<rect x="250" y="84" width="40" height="40" fill="#fef3c7" stroke="#1f2933"/>
<text x="270" y="109" font-size="15">5</text>
<rect x="290" y="84" width="40" height="40" fill="#dbeafe" stroke="#1f2933"/>
<text x="310" y="109" font-size="15">8</text>
<rect x="210" y="124" width="40" height="40" fill="#ffffff" stroke="#1f2933"/>
<text x="230" y="149" font-size="15">3</text>
<rect x="250" y="124" width="40" height="40" fill="#ffffff" stroke="#1f2933"/>
<text x="270" y="149" font-size="15">6</text>
<rect x="290" y="124" width="40" height="40" fill="#dbeafe" stroke="#1f2933"/>
<text x="310" y="149" font-size="15">9</text>
<line x1="338.0" y1="104.0" x2="392.0" y2="104.0" stroke="#1f2933" stroke-width="2" marker-end="url(#a0)"/>
<text x="460" y="30" font-size="13" font-weight="bold">2. reverse each row</text>
<rect x="400" y="44" width="40" height="40" fill="#dbeafe" stroke="#1f2933"/>
<text x="420" y="69" font-size="15">7</text>
<rect x="440" y="44" width="40" height="40" fill="#ffffff" stroke="#1f2933"/>
<text x="460" y="69" font-size="15">4</text>
<rect x="480" y="44" width="40" height="40" fill="#ffffff" stroke="#1f2933"/>
<text x="500" y="69" font-size="15">1</text>
<rect x="400" y="84" width="40" height="40" fill="#dbeafe" stroke="#1f2933"/>
<text x="420" y="109" font-size="15">8</text>
<rect x="440" y="84" width="40" height="40" fill="#ffffff" stroke="#1f2933"/>
<text x="460" y="109" font-size="15">5</text>
<rect x="480" y="84" width="40" height="40" fill="#ffffff" stroke="#1f2933"/>
<text x="500" y="109" font-size="15">2</text>
<rect x="400" y="124" width="40" height="40" fill="#dbeafe" stroke="#1f2933"/>
<text x="420" y="149" font-size="15">9</text>
<rect x="440" y="124" width="40" height="40" fill="#ffffff" stroke="#1f2933"/>
<text x="460" y="149" font-size="15">6</text>
<rect x="480" y="124" width="40" height="40" fill="#ffffff" stroke="#1f2933"/>
<text x="500" y="149" font-size="15">3</text>
<text x="270" y="190" font-size="11">Yellow: the diagonal stays put. Blue: the old bottom row 7 8 9 ends up as the first column.</text>
</g>
</svg>
