<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 290" width="560" height="290" role="img">
<title>The call stack for list_sum of [3, 1, 4]: four frames pile up while winding down, each waiting on the next; the base case returns 0, then answers travel back up: 4, then 5, then 8</title>
<rect width="100%" height="100%" rx="8" fill="#ffffff"/>
<g font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#1f2933">
<defs><marker id="a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b82f6"/></marker><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/></marker></defs>
<text x="140.0" y="22.0" font-size="13" fill="#3b82f6" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">winding: calls pile up</text>
<text x="430.0" y="22.0" font-size="13" fill="#059669" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">unwinding: answers go back</text>
<rect x="30.0" y="40.0" width="230.0" height="40.0" fill="#dbeafe" stroke="#1f2933" stroke-width="1.2" fill-opacity="1"/>
<text x="40.0" y="57.0" font-size="13" fill="#1f2933" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">list_sum([3,1,4])</text>
<text x="40.0" y="73.0" font-size="11" fill="#374151" text-anchor="start" font-weight="normal" font-family="system-ui, sans-serif">frame 1:  3 + ?</text>
<line x1="70.0" y1="80.0" x2="92.0" y2="98.0" stroke="#3b82f6" stroke-width="1.6" marker-end="url(#a1)"/>
<text x="330.0" y="65.0" font-size="13" fill="#059669" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">returns 3 + 5 = 8</text>
<line x1="262.0" y1="60.0" x2="322.0" y2="60.0" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3 3"/>
<rect x="52.0" y="98.0" width="230.0" height="40.0" fill="#dbeafe" stroke="#1f2933" stroke-width="1.2" fill-opacity="1"/>
<text x="62.0" y="115.0" font-size="13" fill="#1f2933" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">list_sum([1,4])</text>
<text x="62.0" y="131.0" font-size="11" fill="#374151" text-anchor="start" font-weight="normal" font-family="system-ui, sans-serif">frame 2:  1 + ?</text>
<line x1="92.0" y1="138.0" x2="114.0" y2="156.0" stroke="#3b82f6" stroke-width="1.6" marker-end="url(#a1)"/>
<text x="330.0" y="123.0" font-size="13" fill="#059669" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">returns 1 + 4 = 5</text>
<line x1="284.0" y1="118.0" x2="322.0" y2="118.0" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="470.0" y1="106.0" x2="470.0" y2="76.0" stroke="#059669" stroke-width="1.6" marker-end="url(#a4)"/>
<rect x="74.0" y="156.0" width="230.0" height="40.0" fill="#dbeafe" stroke="#1f2933" stroke-width="1.2" fill-opacity="1"/>
<text x="84.0" y="173.0" font-size="13" fill="#1f2933" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">list_sum([4])</text>
<text x="84.0" y="189.0" font-size="11" fill="#374151" text-anchor="start" font-weight="normal" font-family="system-ui, sans-serif">frame 3:  4 + ?</text>
<line x1="114.0" y1="196.0" x2="136.0" y2="214.0" stroke="#3b82f6" stroke-width="1.6" marker-end="url(#a1)"/>
<text x="330.0" y="181.0" font-size="13" fill="#059669" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">returns 4 + 0 = 4</text>
<line x1="306.0" y1="176.0" x2="322.0" y2="176.0" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="470.0" y1="164.0" x2="470.0" y2="134.0" stroke="#059669" stroke-width="1.6" marker-end="url(#a4)"/>
<rect x="96.0" y="214.0" width="230.0" height="40.0" fill="#d1fae5" stroke="#1f2933" stroke-width="1.2" fill-opacity="1"/>
<text x="106.0" y="231.0" font-size="13" fill="#1f2933" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">list_sum([])</text>
<text x="106.0" y="247.0" font-size="11" fill="#374151" text-anchor="start" font-weight="normal" font-family="system-ui, sans-serif">frame 4:  0  (base case)</text>
<text x="330.0" y="239.0" font-size="13" fill="#059669" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">returns 0</text>
<line x1="328.0" y1="234.0" x2="322.0" y2="234.0" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="470.0" y1="222.0" x2="470.0" y2="192.0" stroke="#059669" stroke-width="1.6" marker-end="url(#a4)"/>
<text x="280.0" y="282.0" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">No addition happens until the base case answers. Then each frame finishes and is released.</text>
</g>
</svg>
