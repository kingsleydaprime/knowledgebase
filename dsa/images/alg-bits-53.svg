<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 140" width="470" height="140" role="img">
<title>The number 53 as eight bits 0 0 1 1 0 1 0 1: bit 7 on the left is the most significant, bit 0 on the right the least; the bits that are on have weights 32, 16, 4 and 1, which add up to 53</title>
<rect width="100%" height="100%" rx="8" fill="#ffffff"/>
<g font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#1f2933">
<text x="60" y="70" font-size="12" font-weight="bold" text-anchor="end">53</text>
<rect x="70" y="50" width="34" height="30" fill="#ffffff" stroke="#1f2933"/>
<text x="87" y="70" font-size="14" fill="#9ca3af">0</text>
<text x="87" y="32" font-size="9" fill="#6b7280">bit 7</text>
<text x="87" y="44" font-size="10" fill="#374151">128</text>
<rect x="104" y="50" width="34" height="30" fill="#ffffff" stroke="#1f2933"/>
<text x="121" y="70" font-size="14" fill="#9ca3af">0</text>
<text x="121" y="32" font-size="9" fill="#6b7280">bit 6</text>
<text x="121" y="44" font-size="10" fill="#374151">64</text>
<rect x="138" y="50" width="34" height="30" fill="#dbeafe" stroke="#1f2933"/>
<text x="155" y="70" font-size="14" fill="#1f2933" font-weight="bold">1</text>
<text x="155" y="32" font-size="9" fill="#6b7280">bit 5</text>
<text x="155" y="44" font-size="10" fill="#374151">32</text>
<rect x="172" y="50" width="34" height="30" fill="#dbeafe" stroke="#1f2933"/>
<text x="189" y="70" font-size="14" fill="#1f2933" font-weight="bold">1</text>
<text x="189" y="32" font-size="9" fill="#6b7280">bit 4</text>
<text x="189" y="44" font-size="10" fill="#374151">16</text>
<rect x="206" y="50" width="34" height="30" fill="#ffffff" stroke="#1f2933"/>
<text x="223" y="70" font-size="14" fill="#9ca3af">0</text>
<text x="223" y="32" font-size="9" fill="#6b7280">bit 3</text>
<text x="223" y="44" font-size="10" fill="#374151">8</text>
<rect x="240" y="50" width="34" height="30" fill="#dbeafe" stroke="#1f2933"/>
<text x="257" y="70" font-size="14" fill="#1f2933" font-weight="bold">1</text>
<text x="257" y="32" font-size="9" fill="#6b7280">bit 2</text>
<text x="257" y="44" font-size="10" fill="#374151">4</text>
<rect x="274" y="50" width="34" height="30" fill="#ffffff" stroke="#1f2933"/>
<text x="291" y="70" font-size="14" fill="#9ca3af">0</text>
<text x="291" y="32" font-size="9" fill="#6b7280">bit 1</text>
<text x="291" y="44" font-size="10" fill="#374151">2</text>
<rect x="308" y="50" width="34" height="30" fill="#dbeafe" stroke="#1f2933"/>
<text x="325" y="70" font-size="14" fill="#1f2933" font-weight="bold">1</text>
<text x="325" y="32" font-size="9" fill="#6b7280">bit 0</text>
<text x="325" y="44" font-size="10" fill="#374151">1</text>
<text x="206" y="104" font-size="13" fill="#059669" font-weight="bold">32 + 16 + 4 + 1 = 53</text>
<text x="87" y="124" font-size="10" fill="#6b7280">← bit 7: most significant</text>
<text x="302" y="124" font-size="10" fill="#6b7280">bit 0: least →</text>
</g>
</svg>
