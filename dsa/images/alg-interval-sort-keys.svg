<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" width="520" height="440" role="img">
<title>The meetings 1–3, 2–5, 4–7, 6–8 and 0–10 on a timeline, three times. Earliest end first keeps 1–3 and 4–7 (2 meetings). Earliest start first keeps only 0–10 (1 meeting). Shortest first keeps 1–3 and 6–8 (2 meetings, a tie that hides the flaw)</title>
<rect width="100%" height="100%" rx="8" fill="#ffffff"/>
<g font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#1f2933">
<text x="30" y="24" font-size="12" font-weight="bold" text-anchor="start">Earliest END first: 2 meetings (correct rule)</text>
<rect x="76" y="30" width="92" height="14" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
<text x="122" y="41" font-size="10" fill="#1f2933">1–3</text>
<rect x="122" y="50" width="138" height="14" fill="#f3f4f6" stroke="#9ca3af"/>
<text x="191" y="61" font-size="10" fill="#6b7280">2–5</text>
<rect x="214" y="70" width="138" height="14" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
<text x="283" y="81" font-size="10" fill="#1f2933">4–7</text>
<rect x="306" y="90" width="92" height="14" fill="#f3f4f6" stroke="#9ca3af"/>
<text x="352" y="101" font-size="10" fill="#6b7280">6–8</text>
<rect x="30" y="110" width="460" height="14" fill="#f3f4f6" stroke="#9ca3af"/>
<text x="260" y="121" font-size="10" fill="#6b7280">0–10</text>
<line x1="30.0" y1="130.0" x2="490.0" y2="130.0" stroke="#9ca3af" stroke-width="1"/>
<text x="30" y="142" font-size="9" fill="#6b7280">0</text>
<text x="76" y="142" font-size="9" fill="#6b7280">1</text>
<text x="122" y="142" font-size="9" fill="#6b7280">2</text>
<text x="168" y="142" font-size="9" fill="#6b7280">3</text>
<text x="214" y="142" font-size="9" fill="#6b7280">4</text>
<text x="260" y="142" font-size="9" fill="#6b7280">5</text>
<text x="306" y="142" font-size="9" fill="#6b7280">6</text>
<text x="352" y="142" font-size="9" fill="#6b7280">7</text>
<text x="398" y="142" font-size="9" fill="#6b7280">8</text>
<text x="444" y="142" font-size="9" fill="#6b7280">9</text>
<text x="490" y="142" font-size="9" fill="#6b7280">10</text>
<text x="30" y="164" font-size="12" font-weight="bold" text-anchor="start">Earliest START first: 1 meeting</text>
<rect x="76" y="170" width="92" height="14" fill="#f3f4f6" stroke="#9ca3af"/>
<text x="122" y="181" font-size="10" fill="#6b7280">1–3</text>
<rect x="122" y="190" width="138" height="14" fill="#f3f4f6" stroke="#9ca3af"/>
<text x="191" y="201" font-size="10" fill="#6b7280">2–5</text>
<rect x="214" y="210" width="138" height="14" fill="#f3f4f6" stroke="#9ca3af"/>
<text x="283" y="221" font-size="10" fill="#6b7280">4–7</text>
<rect x="306" y="230" width="92" height="14" fill="#f3f4f6" stroke="#9ca3af"/>
<text x="352" y="241" font-size="10" fill="#6b7280">6–8</text>
<rect x="30" y="250" width="460" height="14" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
<text x="260" y="261" font-size="10" fill="#1f2933">0–10</text>
<line x1="30.0" y1="270.0" x2="490.0" y2="270.0" stroke="#9ca3af" stroke-width="1"/>
<text x="30" y="282" font-size="9" fill="#6b7280">0</text>
<text x="76" y="282" font-size="9" fill="#6b7280">1</text>
<text x="122" y="282" font-size="9" fill="#6b7280">2</text>
<text x="168" y="282" font-size="9" fill="#6b7280">3</text>
<text x="214" y="282" font-size="9" fill="#6b7280">4</text>
<text x="260" y="282" font-size="9" fill="#6b7280">5</text>
<text x="306" y="282" font-size="9" fill="#6b7280">6</text>
<text x="352" y="282" font-size="9" fill="#6b7280">7</text>
<text x="398" y="282" font-size="9" fill="#6b7280">8</text>
<text x="444" y="282" font-size="9" fill="#6b7280">9</text>
<text x="490" y="282" font-size="9" fill="#6b7280">10</text>
<text x="30" y="304" font-size="12" font-weight="bold" text-anchor="start">SHORTEST first: 2 meetings here, but wrong in general</text>
<rect x="76" y="310" width="92" height="14" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
<text x="122" y="321" font-size="10" fill="#1f2933">1–3</text>
<rect x="122" y="330" width="138" height="14" fill="#f3f4f6" stroke="#9ca3af"/>
<text x="191" y="341" font-size="10" fill="#6b7280">2–5</text>
<rect x="214" y="350" width="138" height="14" fill="#f3f4f6" stroke="#9ca3af"/>
<text x="283" y="361" font-size="10" fill="#6b7280">4–7</text>
<rect x="306" y="370" width="92" height="14" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
<text x="352" y="381" font-size="10" fill="#1f2933">6–8</text>
<rect x="30" y="390" width="460" height="14" fill="#f3f4f6" stroke="#9ca3af"/>
<text x="260" y="401" font-size="10" fill="#6b7280">0–10</text>
<line x1="30.0" y1="410.0" x2="490.0" y2="410.0" stroke="#9ca3af" stroke-width="1"/>
<text x="30" y="422" font-size="9" fill="#6b7280">0</text>
<text x="76" y="422" font-size="9" fill="#6b7280">1</text>
<text x="122" y="422" font-size="9" fill="#6b7280">2</text>
<text x="168" y="422" font-size="9" fill="#6b7280">3</text>
<text x="214" y="422" font-size="9" fill="#6b7280">4</text>
<text x="260" y="422" font-size="9" fill="#6b7280">5</text>
<text x="306" y="422" font-size="9" fill="#6b7280">6</text>
<text x="352" y="422" font-size="9" fill="#6b7280">7</text>
<text x="398" y="422" font-size="9" fill="#6b7280">8</text>
<text x="444" y="422" font-size="9" fill="#6b7280">9</text>
<text x="490" y="422" font-size="9" fill="#6b7280">10</text>
</g>
