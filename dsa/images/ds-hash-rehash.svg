<title>Rehashing: keys 3, 7 and 11 all sit in bucket 3 of a 4-bucket table, load factor 0.75. After doubling to 8 buckets and recomputing k mod 8, 3 and 11 share bucket 3 and 7 moves to bucket 7</title>
