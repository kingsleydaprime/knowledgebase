<path d="M290 228 h70 l-14 22 h-42 z" stroke="#92400e" stroke-width="1.5" fill="#fde68a"/>
<text x="316" y="244" font-size="12" font-weight="bold">45</text>
<text x="290" y="268" font-size="10" fill="#374151" text-anchor="start">canoe 4: only 45 is left: alone</text>
</g>
</svg>
