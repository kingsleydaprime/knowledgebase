<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 298" width="560" height="298" role="img">
<title>Canoe pairing for weights 20, 30, 45, 60, 75, 85 with a 100 kg limit: 85 cannot share with 20 so goes alone; 75 shares with 20; 60 shares with 30; 45 goes alone; 4 canoes</title>
<rect width="100%" height="100%" rx="8" fill="#ffffff"/>
<g font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#1f2933">
<text x="280" y="20" font-size="12" font-weight="bold">Sorted weights. Pair the heaviest (right) with the lightest (left) if they fit.</text>
<rect x="20" y="36" width="40" height="28" fill="#ffffff" stroke="#1f2933"/>
<text x="40" y="55" font-size="13">20</text>
<rect x="60" y="36" width="40" height="28" fill="#ffffff" stroke="#1f2933"/>
<text x="80" y="55" font-size="13">30</text>
