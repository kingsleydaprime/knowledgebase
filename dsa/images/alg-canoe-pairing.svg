<text x="80" y="201" font-size="10" fill="#3b82f6" font-weight="bold">left</text>
<text x="160" y="201" font-size="10" fill="#3b82f6" font-weight="bold">right</text>
<path d="M290 166 h110 l-14 22 h-82 z" stroke="#92400e" stroke-width="1.5" fill="#fde68a"/>
<text x="316" y="182" font-size="12" font-weight="bold">60</text>
<text x="356" y="182" font-size="12" font-weight="bold">30</text>
<text x="290" y="206" font-size="10" fill="#374151" text-anchor="start">canoe 3: 60 + 30 = 90 ≤ 100: share</text>
<rect x="20" y="222" width="40" height="28" fill="#f3f4f6" stroke="#1f2933"/>
<text x="40" y="241" font-size="13" fill="#9ca3af">20</text>
<rect x="60" y="222" width="40" height="28" fill="#f3f4f6" stroke="#1f2933"/>
<text x="80" y="241" font-size="13" fill="#9ca3af">30</text>
<rect x="100" y="222" width="40" height="28" fill="#ffffff" stroke="#1f2933"/>
<text x="120" y="241" font-size="13">45</text>
<rect x="140" y="222" width="40" height="28" fill="#f3f4f6" stroke="#1f2933"/>
