<text x="240" y="77" font-size="10" fill="#3b82f6" font-weight="bold">right</text>
<path d="M290 42 h70 l-14 22 h-42 z" stroke="#92400e" stroke-width="1.5" fill="#fde68a"/>
<text x="316" y="58" font-size="12" font-weight="bold">85</text>
<text x="290" y="82" font-size="10" fill="#374151" text-anchor="start">canoe 1: 85 + 20 = 105 > 100: 85 goes alone</text>
<rect x="20" y="98" width="40" height="28" fill="#ffffff" stroke="#1f2933"/>
<text x="40" y="117" font-size="13">20</text>
<rect x="60" y="98" width="40" height="28" fill="#ffffff" stroke="#1f2933"/>
