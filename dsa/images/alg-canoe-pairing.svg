<rect x="220" y="98" width="40" height="28" fill="#f3f4f6" stroke="#1f2933"/>
<text x="240" y="117" font-size="13" fill="#9ca3af">85</text>
<rect x="182" y="100" width="37" height="25" fill="none" stroke="#f59e0b" stroke-width="3"/>
<rect x="22" y="100" width="37" height="25" fill="none" stroke="#f59e0b" stroke-width="3"/>
<text x="40" y="139" font-size="10" fill="#3b82f6" font-weight="bold">left</text>
<text x="200" y="139" font-size="10" fill="#3b82f6" font-weight="bold">right</text>
