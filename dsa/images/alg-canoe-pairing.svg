<text x="356" y="120" font-size="12" font-weight="bold">20</text>
<text x="290" y="144" font-size="10" fill="#374151" text-anchor="start">canoe 2: 75 + 20 = 95 ≤ 100: share</text>
<rect x="20" y="160" width="40" height="28" fill="#f3f4f6" stroke="#1f2933"/>
<text x="40" y="179" font-size="13" fill="#9ca3af">20</text>
