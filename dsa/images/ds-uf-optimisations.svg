<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 345" width="470" height="345" role="img">
<title>The same unions, union(1, 0), union(2, 1), union(3, 2), union(4, 3), done two ways. With no optimisations the forest is a chain 0, 1, 2, 3 up to root 4, so find(0) takes 4 steps. With union by rank and path compression every element points straight at root 1, so any find takes 1 step</title>
<rect width="100%" height="100%" rx="8" fill="#ffffff"/>
<defs><marker id="a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b82f6"/></marker><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/></marker></defs>
<text x="20.0" y="22.0" font-size="13" fill="#1f2933" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">no optimisations: a chain</text>
<text x="20.0" y="40.0" font-size="12" fill="#dc2626" text-anchor="start" font-weight="normal" font-family="system-ui, sans-serif">find(0) walks 4 pointers</text>
<line x1="90.0" y1="286.0" x2="90.0" y2="262.0" stroke="#1f2933" stroke-width="1.5" marker-end="url(#a0)"/>
<line x1="90.0" y1="228.0" x2="90.0" y2="204.0" stroke="#1f2933" stroke-width="1.5" marker-end="url(#a0)"/>
<line x1="90.0" y1="170.0" x2="90.0" y2="146.0" stroke="#1f2933" stroke-width="1.5" marker-end="url(#a0)"/>
<line x1="90.0" y1="112.0" x2="90.0" y2="88.0" stroke="#1f2933" stroke-width="1.5" marker-end="url(#a0)"/>
<circle cx="90.0" cy="302.0" r="16" fill="#dbeafe" stroke="#1f2933" stroke-width="1.3"/>
<text x="90.0" y="307.0" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">0</text>
<circle cx="90.0" cy="244.0" r="16" fill="#dbeafe" stroke="#1f2933" stroke-width="1.3"/>
<text x="90.0" y="249.0" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">1</text>
<circle cx="90.0" cy="186.0" r="16" fill="#dbeafe" stroke="#1f2933" stroke-width="1.3"/>
<text x="90.0" y="191.0" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">2</text>
<circle cx="90.0" cy="128.0" r="16" fill="#dbeafe" stroke="#1f2933" stroke-width="1.3"/>
<text x="90.0" y="133.0" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">3</text>
<circle cx="90.0" cy="70.0" r="16" fill="#d1fae5" stroke="#1f2933" stroke-width="2.2"/>
<text x="90.0" y="75.0" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">4</text>
<text x="250.0" y="22.0" font-size="13" fill="#1f2933" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">rank + path compression</text>
<text x="250.0" y="40.0" font-size="12" fill="#059669" text-anchor="start" font-weight="normal" font-family="system-ui, sans-serif">every find is 1 step</text>
<line x1="282.2" y1="155.6" x2="322.3" y2="121.6" stroke="#1f2933" stroke-width="1.5" marker-end="url(#a0)"/>
<line x1="319.9" y1="151.1" x2="329.4" y2="126.8" stroke="#1f2933" stroke-width="1.5" marker-end="url(#a0)"/>
<line x1="352.1" y1="151.1" x2="342.6" y2="126.8" stroke="#1f2933" stroke-width="1.5" marker-end="url(#a0)"/>
<line x1="389.8" y1="155.6" x2="349.7" y2="121.6" stroke="#1f2933" stroke-width="1.5" marker-end="url(#a0)"/>
<circle cx="270.0" cy="166.0" r="16" fill="#dbeafe" stroke="#1f2933" stroke-width="1.3"/>
<text x="270.0" y="171.0" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">0</text>
<circle cx="314.0" cy="166.0" r="16" fill="#dbeafe" stroke="#1f2933" stroke-width="1.3"/>
<text x="314.0" y="171.0" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">2</text>
<circle cx="358.0" cy="166.0" r="16" fill="#dbeafe" stroke="#1f2933" stroke-width="1.3"/>
<text x="358.0" y="171.0" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">3</text>
<circle cx="402.0" cy="166.0" r="16" fill="#dbeafe" stroke="#1f2933" stroke-width="1.3"/>
<text x="402.0" y="171.0" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">4</text>
<circle cx="336.0" cy="110.0" r="16" fill="#d1fae5" stroke="#1f2933" stroke-width="2.2"/>
<text x="336.0" y="115.0" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">1</text>
<text x="235.0" y="335.0" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">same unions: union(1,0), union(2,1), union(3,2), union(4,3)</text>
</svg>
