<text x="183" y="108" font-size="13">1</text>
<rect x="200" y="90" width="34" height="26" fill="#fef3c7" stroke="#1f2933"/>
<text x="217" y="108" font-size="13">4</text>
<rect x="32" y="92" width="31" height="23" fill="none" stroke="#f59e0b" stroke-width="3"/>
<text x="30" y="130" font-size="11" fill="#374151" text-anchor="start">j = 0: 3 ≤ 4, so i = 0 and swap a[0] with a[0]</text>
<rect x="30" y="140" width="34" height="26" fill="#d1fae5" stroke="#1f2933"/>
