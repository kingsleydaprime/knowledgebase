<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 400" width="420" height="400" role="img">
<title>Lomuto partition of [3, 8, 2, 5, 1, 4] with pivot 4: j scans left to right; 3, 2 and 1 are at most 4 and are swapped into the green region at the front, 8 and 5 stay in the red region; finally the pivot swaps into index 3, giving [3, 2, 1, 4, 8, 5]</title>
<rect width="100%" height="100%" rx="8" fill="#ffffff"/>
<g font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#1f2933">
<text x="210" y="20" font-size="12" font-weight="bold">green: ≤ pivot,  red: &gt; pivot,  yellow: the pivot</text>
