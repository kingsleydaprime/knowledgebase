<rect x="30" y="340" width="34" height="26" fill="#d1fae5" stroke="#1f2933"/>
<text x="47" y="358" font-size="13">3</text>
<rect x="64" y="340" width="34" height="26" fill="#d1fae5" stroke="#1f2933"/>
<text x="81" y="358" font-size="13">2</text>
<rect x="98" y="340" width="34" height="26" fill="#d1fae5" stroke="#1f2933"/>
<text x="115" y="358" font-size="13">1</text>
<rect x="132" y="340" width="34" height="26" fill="#fef3c7" stroke="#1f2933"/>
<text x="149" y="358" font-size="13">4</text>
<rect x="166" y="340" width="34" height="26" fill="#fee2e2" stroke="#1f2933"/>
