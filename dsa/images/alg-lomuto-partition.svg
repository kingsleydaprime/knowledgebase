<text x="183" y="34" font-size="10" fill="#6b7280">4</text>
<rect x="200" y="40" width="34" height="26" fill="#fef3c7" stroke="#1f2933"/>
<text x="217" y="58" font-size="13">4</text>
<text x="217" y="34" font-size="10" fill="#6b7280">5</text>
<text x="30" y="80" font-size="11" fill="#374151" text-anchor="start">start: pivot = 4 (last element), i = -1</text>
<rect x="30" y="90" width="34" height="26" fill="#d1fae5" stroke="#1f2933"/>
<text x="47" y="108" font-size="13">3</text>
