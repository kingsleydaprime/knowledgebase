<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 524 205" width="524" height="205" role="img">
<title>Iterative pre-order on the reference tree, stack shown bottom to top after each step: start [1]; pop 1, push 3 then 2, giving [3, 2]; pop 2, push 5 then 4, giving [3, 5, 4]; pop 4 gives [3, 5]; pop 5 gives [3]; pop 3 leaves it empty. Visit order 1, 2, 4, 5, 3</title>
<rect width="100%" height="100%" rx="8" fill="#ffffff"/>
<text x="54.0" y="20.0" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">start</text>
<line x1="24.0" y1="162.0" x2="84.0" y2="162.0" stroke="#1f2933" stroke-width="2"/>
<rect x="28.0" y="130.0" width="52.0" height="27.0" fill="#dbeafe" stroke="#1f2933" stroke-width="1.1" fill-opacity="1"/>
<text x="54.0" y="148.0" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">1</text>
<text x="138.0" y="20.0" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">pop 1</text>
<text x="138.0" y="36.0" font-size="11" fill="#f59e0b" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">visit 1</text>
<line x1="108.0" y1="162.0" x2="168.0" y2="162.0" stroke="#1f2933" stroke-width="2"/>
<rect x="112.0" y="130.0" width="52.0" height="27.0" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.5" fill-opacity="1"/>
<text x="138.0" y="148.0" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">3</text>
<rect x="112.0" y="100.0" width="52.0" height="27.0" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.5" fill-opacity="1"/>
<text x="138.0" y="118.0" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">2</text>
<text x="222.0" y="20.0" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">pop 2</text>
<text x="222.0" y="36.0" font-size="11" fill="#f59e0b" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">visit 2</text>
<line x1="192.0" y1="162.0" x2="252.0" y2="162.0" stroke="#1f2933" stroke-width="2"/>
<rect x="196.0" y="130.0" width="52.0" height="27.0" fill="#dbeafe" stroke="#1f2933" stroke-width="1.1" fill-opacity="1"/>
<text x="222.0" y="148.0" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">3</text>
<rect x="196.0" y="100.0" width="52.0" height="27.0" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.5" fill-opacity="1"/>
<text x="222.0" y="118.0" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">5</text>
<rect x="196.0" y="70.0" width="52.0" height="27.0" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.5" fill-opacity="1"/>
<text x="222.0" y="88.0" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">4</text>
<text x="306.0" y="20.0" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">pop 4</text>
<text x="306.0" y="36.0" font-size="11" fill="#f59e0b" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">visit 4</text>
<line x1="276.0" y1="162.0" x2="336.0" y2="162.0" stroke="#1f2933" stroke-width="2"/>
<rect x="280.0" y="130.0" width="52.0" height="27.0" fill="#dbeafe" stroke="#1f2933" stroke-width="1.1" fill-opacity="1"/>
<text x="306.0" y="148.0" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">3</text>
<rect x="280.0" y="100.0" width="52.0" height="27.0" fill="#dbeafe" stroke="#1f2933" stroke-width="1.1" fill-opacity="1"/>
<text x="306.0" y="118.0" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">5</text>
<text x="390.0" y="20.0" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">pop 5</text>
<text x="390.0" y="36.0" font-size="11" fill="#f59e0b" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">visit 5</text>
<line x1="360.0" y1="162.0" x2="420.0" y2="162.0" stroke="#1f2933" stroke-width="2"/>
<rect x="364.0" y="130.0" width="52.0" height="27.0" fill="#dbeafe" stroke="#1f2933" stroke-width="1.1" fill-opacity="1"/>
<text x="390.0" y="148.0" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">3</text>
<text x="474.0" y="20.0" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">pop 3</text>
<text x="474.0" y="36.0" font-size="11" fill="#f59e0b" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">visit 3</text>
<line x1="444.0" y1="162.0" x2="504.0" y2="162.0" stroke="#1f2933" stroke-width="2"/>
<text x="474.0" y="148.0" font-size="11" fill="#9ca3af" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">empty</text>
<text x="20.0" y="192.0" font-size="11" fill="#6b7280" text-anchor="start" font-weight="normal" font-family="system-ui, sans-serif">orange = just pushed; the top of each stack is popped next</text>
</svg>
