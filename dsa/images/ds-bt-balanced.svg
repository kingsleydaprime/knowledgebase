<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 198 176" width="198" height="176" role="img">
<title>Balanced binary tree: 1 has children 2 and 3, 2 has a left child 4; subtree heights differ by at most 1 everywhere</title>
<rect width="100%" height="100%" rx="8" fill="#ffffff"/>
<line x1="122.0" y1="30.0" x2="76.0" y2="88.0" stroke="#1f2933" stroke-width="1.4"/>
<line x1="122.0" y1="30.0" x2="168.0" y2="88.0" stroke="#1f2933" stroke-width="1.4"/>
<line x1="76.0" y1="88.0" x2="30.0" y2="146.0" stroke="#1f2933" stroke-width="1.4"/>
<circle cx="122.0" cy="30.0" r="16" fill="#dbeafe" stroke="#1f2933" stroke-width="1.3"/>
<text x="122.0" y="35.0" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">1</text>
<circle cx="76.0" cy="88.0" r="16" fill="#dbeafe" stroke="#1f2933" stroke-width="1.3"/>
<text x="76.0" y="93.0" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">2</text>
<circle cx="30.0" cy="146.0" r="16" fill="#dbeafe" stroke="#1f2933" stroke-width="1.3"/>
<text x="30.0" y="151.0" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">4</text>
<circle cx="168.0" cy="88.0" r="16" fill="#dbeafe" stroke="#1f2933" stroke-width="1.3"/>
<text x="168.0" y="93.0" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">3</text>
</svg>
