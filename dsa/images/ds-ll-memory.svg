<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 190" width="540" height="190" role="img">
<title>Array versus linked list in memory: the array's four elements sit side by side and one fetch brings them in; the linked list's nodes sit at scattered addresses 100, 8500 and 410, and each hop is a cache miss</title>
<rect width="100%" height="100%" rx="8" fill="#ffffff"/>
<defs><marker id="a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b82f6"/></marker><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/></marker></defs>
<text x="20.0" y="24.0" font-size="13" fill="#1f2933" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">array: side by side, one fetch</text>
<rect x="20.0" y="34.0" width="64.0" height="32.0" fill="#d1fae5" stroke="#1f2933" stroke-width="1.2" fill-opacity="1"/>
<text x="52.0" y="55.0" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">node 0</text>
<rect x="84.0" y="34.0" width="64.0" height="32.0" fill="#d1fae5" stroke="#1f2933" stroke-width="1.2" fill-opacity="1"/>
<text x="116.0" y="55.0" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">node 1</text>
<rect x="148.0" y="34.0" width="64.0" height="32.0" fill="#d1fae5" stroke="#1f2933" stroke-width="1.2" fill-opacity="1"/>
<text x="180.0" y="55.0" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">node 2</text>
<rect x="212.0" y="34.0" width="64.0" height="32.0" fill="#d1fae5" stroke="#1f2933" stroke-width="1.2" fill-opacity="1"/>
<text x="244.0" y="55.0" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">node 3</text>
<rect x="18.0" y="32.0" width="260.0" height="36.0" fill="none" stroke="#059669" stroke-width="2" fill-opacity="1"/>
<text x="290.0" y="55.0" font-size="12" fill="#059669" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">one 64-byte cache line</text>
<text x="20.0" y="104.0" font-size="13" fill="#1f2933" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">linked list: scattered on the heap</text>
<rect x="20.0" y="116.0" width="70.0" height="30.0" fill="#dbeafe" stroke="#1f2933" stroke-width="1.2" fill-opacity="1"/>
<text x="55.0" y="136.0" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">node 0</text>
<text x="55.0" y="162.0" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">address 100</text>
<text x="55.0" y="178.0" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">cache miss</text>
<rect x="360.0" y="116.0" width="70.0" height="30.0" fill="#dbeafe" stroke="#1f2933" stroke-width="1.2" fill-opacity="1"/>
<text x="395.0" y="136.0" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">node 1</text>
<text x="395.0" y="162.0" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">address 8500</text>
<text x="395.0" y="178.0" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">cache miss</text>
<rect x="190.0" y="116.0" width="70.0" height="30.0" fill="#dbeafe" stroke="#1f2933" stroke-width="1.2" fill-opacity="1"/>
<text x="225.0" y="136.0" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">node 2</text>
<text x="225.0" y="162.0" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">address 410</text>
<text x="225.0" y="178.0" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">cache miss</text>
<path d="M90.0,120.0 Q225.0,92.0 360.0,118.0" stroke="#1f2933" stroke-width="1.6" fill="none" marker-end="url(#a0)"/>
<path d="M395.0,146.0 Q327.5,150.0 260.0,140.0" stroke="#1f2933" stroke-width="1.6" fill="none" marker-end="url(#a0)"/>
</svg>
