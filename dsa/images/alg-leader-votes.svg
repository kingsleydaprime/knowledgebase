<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 130" width="460" height="130" role="img">
<title>Nine votes A, B, A, A, C, A, B, A, A: A appears 6 times out of 9, more than half (4.5), so A is the leader</title>
<rect width="100%" height="100%" rx="8" fill="#ffffff"/>
<g font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#1f2933">
<rect x="32" y="40" width="44" height="34" fill="#d1fae5" stroke="#1f2933"/>
<text x="54" y="62" font-size="15">A</text>
<text x="54" y="34" font-size="10" fill="#6b7280">0</text>
<rect x="76" y="40" width="44" height="34" fill="#ffffff" stroke="#1f2933"/>
<text x="98" y="62" font-size="15">B</text>
<text x="98" y="34" font-size="10" fill="#6b7280">1</text>
<rect x="120" y="40" width="44" height="34" fill="#d1fae5" stroke="#1f2933"/>
<text x="142" y="62" font-size="15">A</text>
<text x="142" y="34" font-size="10" fill="#6b7280">2</text>
<rect x="164" y="40" width="44" height="34" fill="#d1fae5" stroke="#1f2933"/>
<text x="186" y="62" font-size="15">A</text>
<text x="186" y="34" font-size="10" fill="#6b7280">3</text>
<rect x="208" y="40" width="44" height="34" fill="#ffffff" stroke="#1f2933"/>
<text x="230" y="62" font-size="15">C</text>
<text x="230" y="34" font-size="10" fill="#6b7280">4</text>
<rect x="252" y="40" width="44" height="34" fill="#d1fae5" stroke="#1f2933"/>
<text x="274" y="62" font-size="15">A</text>
<text x="274" y="34" font-size="10" fill="#6b7280">5</text>
<rect x="296" y="40" width="44" height="34" fill="#ffffff" stroke="#1f2933"/>
<text x="318" y="62" font-size="15">B</text>
<text x="318" y="34" font-size="10" fill="#6b7280">6</text>
<rect x="340" y="40" width="44" height="34" fill="#d1fae5" stroke="#1f2933"/>
<text x="362" y="62" font-size="15">A</text>
<text x="362" y="34" font-size="10" fill="#6b7280">7</text>
<rect x="384" y="40" width="44" height="34" fill="#d1fae5" stroke="#1f2933"/>
<text x="406" y="62" font-size="15">A</text>
<text x="406" y="34" font-size="10" fill="#6b7280">8</text>
<text x="230" y="100" font-size="12">A appears 6 times out of 9. Half of 9 is 4.5, and 6 &gt; 4.5,</text>
<text x="230" y="118" font-size="12" fill="#059669" font-weight="bold">so A is the leader (the majority element).</text>
</g>
</svg>
