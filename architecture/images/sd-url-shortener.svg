<title>URL shortener: to create, the app server takes the next number from an ID generator, turns it into a short base-62 code (125 becomes 21) and stores code to long URL in a key-value store; to redirect, a GET for the code goes through the load balancer to an app server that checks the cache first and the store on a miss, then answers 301 with the long URL</title>
