<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 536 361.2" width="536" height="361.2" role="img">
<title>Fencing tokens: worker A gets the lock with token 33, then pauses; the lease runs out and worker B gets the lock with token 34 and writes, which storage accepts; A wakes and writes with token 33, which storage rejects because it has already seen 34</title>
<rect width="100%" height="100%" rx="8" fill="#ffffff"/>
<defs><marker id="a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b82f6"/></marker><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="a6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker></defs>
<line x1="82.0" y1="50.0" x2="82.0" y2="347.2" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="4 4"/>
<rect x="30.0" y="10.0" width="104.0" height="32.0" rx="7" fill="#fef3c7" stroke="#1f2933" stroke-width="1.3"/>
<text x="82.0" y="30.6" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">lock service</text>
<line x1="206.0" y1="50.0" x2="206.0" y2="347.2" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="4 4"/>
<rect x="154.0" y="10.0" width="104.0" height="32.0" rx="7" fill="#dbeafe" stroke="#1f2933" stroke-width="1.3"/>
<text x="206.0" y="30.6" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">worker A</text>
<line x1="330.0" y1="50.0" x2="330.0" y2="347.2" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="4 4"/>
<rect x="278.0" y="10.0" width="104.0" height="32.0" rx="7" fill="#dbeafe" stroke="#1f2933" stroke-width="1.3"/>
<text x="330.0" y="30.6" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">worker B</text>
<line x1="454.0" y1="50.0" x2="454.0" y2="347.2" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="4 4"/>
<rect x="402.0" y="10.0" width="104.0" height="32.0" rx="7" fill="#d1fae5" stroke="#1f2933" stroke-width="1.3"/>
<text x="454.0" y="30.6" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">storage</text>
<line x1="82.0" y1="77.7" x2="203.0" y2="90.1" stroke="#1f2933" stroke-width="1.6" marker-end="url(#a0)"/>
<text x="144.0" y="72.7" font-size="10.5" fill="#111827" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">lock, token 33</text>
<rect x="200.0" y="105.6" width="12.0" height="74.4" fill="#f59e0b" stroke="none" stroke-width="1" fill-opacity="0.4"/>
<text x="216.0" y="146.8" font-size="11" fill="#b45309" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">GC pause</text>
<text x="90.0" y="168.5" font-size="10.5" fill="#4b5563" text-anchor="start" font-weight="normal" font-family="system-ui, sans-serif">lease runs out</text>
<line x1="82.0" y1="186.2" x2="327.0" y2="198.6" stroke="#1f2933" stroke-width="1.6" marker-end="url(#a0)"/>
<text x="206.0" y="181.2" font-size="10.5" fill="#111827" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">lock, token 34</text>
<line x1="330.0" y1="214.1" x2="451.0" y2="226.5" stroke="#059669" stroke-width="1.6" marker-end="url(#a4)"/>
<text x="392.0" y="209.1" font-size="10.5" fill="#059669" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">write, token 34</text>
<text x="446.0" y="249.1" font-size="11" fill="#059669" text-anchor="end" font-weight="bold" font-family="system-ui, sans-serif">accepted</text>
<line x1="206.0" y1="273.0" x2="451.0" y2="285.4" stroke="#dc2626" stroke-width="1.6" marker-end="url(#a2)"/>
<text x="330.0" y="268.0" font-size="10.5" fill="#dc2626" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">write, token 33</text>
<text x="446.0" y="308.0" font-size="11" fill="#dc2626" text-anchor="end" font-weight="bold" font-family="system-ui, sans-serif">rejected: 33 &lt; newest seen</text>
</svg>
