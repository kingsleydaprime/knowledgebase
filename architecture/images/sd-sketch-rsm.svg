<text x="118.0" y="46.0" font-size="13" fill="#1f2933" text-anchor="end" font-weight="bold" font-family="system-ui, sans-serif">the log</text>
<rect x="130.0" y="26.0" width="118.0" height="34.0" rx="7" fill="#fde68a" stroke="#1f2933" stroke-width="1.3"/>
<text x="189.0" y="47.0" font-size="11.5" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">1. set x = 1</text>
