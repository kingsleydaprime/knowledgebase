<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 662 248" width="662" height="248" role="img">
<title>Answer sketch: the log is set x = 1, add 4 to x, set y = 3, multiply x by 3; after each entry both replicas hold x = 1, then x = 5, then x = 5 and y = 3, then x = 15 and y = 3</title>
<rect width="100%" height="100%" rx="8" fill="#ffffff"/>
