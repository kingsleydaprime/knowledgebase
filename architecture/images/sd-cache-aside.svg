<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 460.40000000000003" width="550" height="460.40000000000003" role="img">
<title>Cache-aside in three parts: on a read miss the app asks the cache, reads price 10 from the database and stores it with a TTL; the next read is a hit; on a write the app updates the database to 12 and then deletes the cached entry</title>
<rect width="100%" height="100%" rx="8" fill="#ffffff"/>
<defs><marker id="a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b82f6"/></marker><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="a6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker></defs>
<line x1="105.0" y1="50.0" x2="105.0" y2="446.4" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="4 4"/>
<rect x="30.0" y="10.0" width="150.0" height="32.0" rx="7" fill="#dbeafe" stroke="#1f2933" stroke-width="1.3"/>
<text x="105.0" y="30.6" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">app</text>
<line x1="275.0" y1="50.0" x2="275.0" y2="446.4" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="4 4"/>
<rect x="200.0" y="10.0" width="150.0" height="32.0" rx="7" fill="#fef3c7" stroke="#1f2933" stroke-width="1.3"/>
<text x="275.0" y="30.6" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">cache</text>
<line x1="445.0" y1="50.0" x2="445.0" y2="446.4" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="4 4"/>
<rect x="370.0" y="10.0" width="150.0" height="32.0" rx="7" fill="#d1fae5" stroke="#1f2933" stroke-width="1.3"/>
<text x="445.0" y="30.6" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">database</text>
<rect x="4.0" y="59.1" width="542.0" height="144.2" fill="#f3f4f6" stroke="none" stroke-width="1" fill-opacity="1"/>
<text x="8.0" y="72.1" font-size="11" fill="#4b5563" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">read, cache miss</text>
<line x1="105.0" y1="74.6" x2="272.0" y2="93.2" stroke="#1f2933" stroke-width="1.6" marker-end="url(#a0)"/>
<text x="190.0" y="69.6" font-size="11.5" fill="#111827" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">GET p42</text>
<line x1="275.0" y1="99.4" x2="108.0" y2="118.0" stroke="#dc2626" stroke-width="1.6" marker-end="url(#a2)"/>
<text x="190.0" y="94.4" font-size="11.5" fill="#dc2626" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">miss</text>
<line x1="105.0" y1="124.2" x2="442.0" y2="142.8" stroke="#1f2933" stroke-width="1.6" marker-end="url(#a0)"/>
<text x="275.0" y="119.2" font-size="11.5" fill="#111827" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">SELECT p42</text>
<line x1="445.0" y1="149.0" x2="108.0" y2="167.6" stroke="#1f2933" stroke-width="1.6" marker-end="url(#a0)"/>
<text x="275.0" y="144.0" font-size="11.5" fill="#111827" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">10</text>
<line x1="105.0" y1="173.8" x2="272.0" y2="192.4" stroke="#059669" stroke-width="1.6" marker-end="url(#a4)"/>
<text x="190.0" y="168.8" font-size="11.5" fill="#059669" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">SET p42 = 10, TTL</text>
<rect x="4.0" y="209.5" width="542.0" height="74.4" fill="#ecfdf5" stroke="none" stroke-width="1" fill-opacity="1"/>
<text x="8.0" y="222.5" font-size="11" fill="#4b5563" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">read, cache hit</text>
<line x1="105.0" y1="229.6" x2="272.0" y2="248.2" stroke="#1f2933" stroke-width="1.6" marker-end="url(#a0)"/>
<text x="190.0" y="224.6" font-size="11.5" fill="#111827" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">GET p42</text>
<line x1="275.0" y1="254.4" x2="108.0" y2="273.0" stroke="#059669" stroke-width="1.6" marker-end="url(#a4)"/>
<text x="190.0" y="249.4" font-size="11.5" fill="#059669" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">10 (database not asked)</text>
<rect x="4.0" y="290.0" width="542.0" height="144.2" fill="#eff6ff" stroke="none" stroke-width="1" fill-opacity="1"/>
<text x="8.0" y="303.0" font-size="11" fill="#4b5563" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">write</text>
<line x1="105.0" y1="310.2" x2="442.0" y2="328.8" stroke="#1f2933" stroke-width="1.6" marker-end="url(#a0)"/>
<text x="275.0" y="305.2" font-size="11.5" fill="#111827" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">UPDATE p42 = 12</text>
<line x1="445.0" y1="335.0" x2="108.0" y2="353.6" stroke="#1f2933" stroke-width="1.6" marker-end="url(#a0)"/>
<text x="275.0" y="330.0" font-size="11.5" fill="#111827" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">ok</text>
<line x1="105.0" y1="359.8" x2="272.0" y2="378.4" stroke="#f59e0b" stroke-width="1.6" marker-end="url(#a3)"/>
<text x="190.0" y="354.8" font-size="11.5" fill="#f59e0b" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">DELETE p42</text>
<text x="113.0" y="413.4" font-size="11.5" fill="#4b5563" text-anchor="start" font-weight="normal" font-family="system-ui, sans-serif">next read misses and loads 12</text>
</svg>
