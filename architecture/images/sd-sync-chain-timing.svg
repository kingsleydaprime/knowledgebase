<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" width="560" height="330" role="img">
<title>Five 20 ms calls: one after another they take 100 ms; sent together, if they do not depend on each other, they take 20 ms, the slowest one. Either way all five must be up, so five services at 99.9 percent give 99.5 percent</title>
<rect width="100%" height="100%" rx="8" fill="#ffffff"/>
<text x="20.0" y="28.0" font-size="13.5" fill="#1f2933" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">one after another</text>
<rect x="110.0" y="40.0" width="78.0" height="16.0" fill="#dbeafe" stroke="#3b82f6" stroke-width="1" fill-opacity="1"/>
<text x="102.0" y="52.0" font-size="11" fill="#4b5563" text-anchor="end" font-weight="normal" font-family="system-ui, sans-serif">service 1</text>
<rect x="190.0" y="59.0" width="78.0" height="16.0" fill="#dbeafe" stroke="#3b82f6" stroke-width="1" fill-opacity="1"/>
<text x="102.0" y="71.0" font-size="11" fill="#4b5563" text-anchor="end" font-weight="normal" font-family="system-ui, sans-serif">service 2</text>
<rect x="270.0" y="78.0" width="78.0" height="16.0" fill="#dbeafe" stroke="#3b82f6" stroke-width="1" fill-opacity="1"/>
<text x="102.0" y="90.0" font-size="11" fill="#4b5563" text-anchor="end" font-weight="normal" font-family="system-ui, sans-serif">service 3</text>
<rect x="350.0" y="97.0" width="78.0" height="16.0" fill="#dbeafe" stroke="#3b82f6" stroke-width="1" fill-opacity="1"/>
<text x="102.0" y="109.0" font-size="11" fill="#4b5563" text-anchor="end" font-weight="normal" font-family="system-ui, sans-serif">service 4</text>
<rect x="430.0" y="116.0" width="78.0" height="16.0" fill="#dbeafe" stroke="#3b82f6" stroke-width="1" fill-opacity="1"/>
<text x="102.0" y="128.0" font-size="11" fill="#4b5563" text-anchor="end" font-weight="normal" font-family="system-ui, sans-serif">service 5</text>
<line x1="510.0" y1="36.0" x2="510.0" y2="136.0" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="4 3"/>
<text x="516.0" y="92.0" font-size="13" fill="#dc2626" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">100 ms</text>
<text x="20.0" y="158.0" font-size="13.5" fill="#1f2933" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">all at once</text>
<rect x="110.0" y="170.0" width="78.0" height="16.0" fill="#dbeafe" stroke="#3b82f6" stroke-width="1" fill-opacity="1"/>
<text x="102.0" y="182.0" font-size="11" fill="#4b5563" text-anchor="end" font-weight="normal" font-family="system-ui, sans-serif">service 1</text>
<rect x="110.0" y="189.0" width="78.0" height="16.0" fill="#dbeafe" stroke="#3b82f6" stroke-width="1" fill-opacity="1"/>
<text x="102.0" y="201.0" font-size="11" fill="#4b5563" text-anchor="end" font-weight="normal" font-family="system-ui, sans-serif">service 2</text>
<rect x="110.0" y="208.0" width="78.0" height="16.0" fill="#dbeafe" stroke="#3b82f6" stroke-width="1" fill-opacity="1"/>
<text x="102.0" y="220.0" font-size="11" fill="#4b5563" text-anchor="end" font-weight="normal" font-family="system-ui, sans-serif">service 3</text>
<rect x="110.0" y="227.0" width="78.0" height="16.0" fill="#dbeafe" stroke="#3b82f6" stroke-width="1" fill-opacity="1"/>
<text x="102.0" y="239.0" font-size="11" fill="#4b5563" text-anchor="end" font-weight="normal" font-family="system-ui, sans-serif">service 4</text>
<rect x="110.0" y="246.0" width="78.0" height="16.0" fill="#dbeafe" stroke="#3b82f6" stroke-width="1" fill-opacity="1"/>
<text x="102.0" y="258.0" font-size="11" fill="#4b5563" text-anchor="end" font-weight="normal" font-family="system-ui, sans-serif">service 5</text>
<line x1="190.0" y1="166.0" x2="190.0" y2="266.0" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="4 3"/>
<text x="196.0" y="222.0" font-size="13" fill="#dc2626" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">20 ms</text>
<text x="110.0" y="284.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">0 ms</text>
<text x="190.0" y="284.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">20 ms</text>
<text x="270.0" y="284.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">40 ms</text>
<text x="350.0" y="284.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">60 ms</text>
<text x="430.0" y="284.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">80 ms</text>
<text x="510.0" y="284.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">100 ms</text>
<text x="310.0" y="316.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">either way: 99.9% ^ 5 = 99.50% available</text>
</svg>
