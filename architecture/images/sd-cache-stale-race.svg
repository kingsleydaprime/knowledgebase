<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 392.8" width="640" height="392.8" role="img">
<title>The stale-value race: the reader misses and reads price 10, then stalls; the writer saves 12 and deletes the cache entry, which is not there yet; the reader then writes 10 into the cache, where it stays until the TTL runs out</title>
<rect width="100%" height="100%" rx="8" fill="#ffffff"/>
<defs><marker id="a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b82f6"/></marker><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="a6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker></defs>
<line x1="95.0" y1="50.0" x2="95.0" y2="378.8" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="4 4"/>
<rect x="30.0" y="10.0" width="130.0" height="32.0" rx="7" fill="#f3f4f6" stroke="#1f2933" stroke-width="1.3"/>
<text x="95.0" y="30.6" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">reader</text>
<line x1="245.0" y1="50.0" x2="245.0" y2="378.8" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="4 4"/>
<rect x="180.0" y="10.0" width="130.0" height="32.0" rx="7" fill="#f3f4f6" stroke="#1f2933" stroke-width="1.3"/>
<text x="245.0" y="30.6" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">writer</text>
<line x1="395.0" y1="50.0" x2="395.0" y2="378.8" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="4 4"/>
<rect x="330.0" y="10.0" width="130.0" height="32.0" rx="7" fill="#fef3c7" stroke="#1f2933" stroke-width="1.3"/>
<text x="395.0" y="30.6" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">cache</text>
<line x1="545.0" y1="50.0" x2="545.0" y2="378.8" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="4 4"/>
<rect x="480.0" y="10.0" width="130.0" height="32.0" rx="7" fill="#d1fae5" stroke="#1f2933" stroke-width="1.3"/>
<text x="545.0" y="30.6" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">database</text>
<line x1="95.0" y1="72.5" x2="392.0" y2="92.3" stroke="#1f2933" stroke-width="1.6" marker-end="url(#a0)"/>
<text x="245.0" y="67.5" font-size="11.5" fill="#111827" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">GET p42: miss</text>
<line x1="95.0" y1="102.2" x2="542.0" y2="122.0" stroke="#1f2933" stroke-width="1.6" marker-end="url(#a0)"/>
<text x="320.0" y="97.2" font-size="11.5" fill="#111827" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">SELECT p42</text>
<line x1="545.0" y1="128.6" x2="98.0" y2="141.8" stroke="#1f2933" stroke-width="1.6" marker-end="url(#a0)"/>
<text x="320.0" y="123.6" font-size="11.5" fill="#111827" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">10</text>
<rect x="89.0" y="145.1" width="12.0" height="128.7" fill="#f59e0b" stroke="none" stroke-width="1" fill-opacity="0.35"/>
<text x="87.0" y="208.5" font-size="11.5" fill="#b45309" text-anchor="end" font-weight="bold" font-family="system-ui, sans-serif">stalls</text>
<line x1="245.0" y1="161.6" x2="542.0" y2="181.4" stroke="#1f2933" stroke-width="1.6" marker-end="url(#a0)"/>
<text x="395.0" y="156.6" font-size="11.5" fill="#111827" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">UPDATE p42 = 12</text>
<line x1="245.0" y1="207.8" x2="392.0" y2="227.6" stroke="#1f2933" stroke-width="1.6" marker-end="url(#a0)"/>
<text x="320.0" y="202.8" font-size="11.5" fill="#111827" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">DELETE p42 (nothing there)</text>
<line x1="95.0" y1="283.7" x2="392.0" y2="303.5" stroke="#dc2626" stroke-width="1.6" marker-end="url(#a2)"/>
<text x="245.0" y="278.7" font-size="11.5" fill="#dc2626" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">SET p42 = 10</text>
<text x="395.0" y="337.2" font-size="11.5" fill="#dc2626" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">cache: 10</text>
<text x="545.0" y="337.2" font-size="11.5" fill="#059669" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">database: 12</text>
<text x="103.0" y="366.9" font-size="11.5" fill="#dc2626" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">stale until the TTL runs out</text>
</svg>
