<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 482 336" width="482" height="336" role="img">
<title>Quorum overlap with N = 3, W = 2, R = 2: the write reaches r1 and r2; the three possible read sets r1 r2, r1 r3 and r2 r3 each include at least one of r1 or r2, so every read sees the new write</title>
<rect width="100%" height="100%" rx="8" fill="#ffffff"/>
<text x="20.0" y="28.0" font-size="14" fill="#1f2933" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">N = 3 copies, W = 2, R = 2: W + R = 4 &gt; 3</text>
<text x="110.0" y="75.0" font-size="13" fill="#3b82f6" text-anchor="end" font-weight="bold" font-family="system-ui, sans-serif">write</text>
<circle cx="150.0" cy="70.0" r="20" fill="#3b82f6" stroke="#1f2933"/>
<text x="150.0" y="75.0" font-size="12.5" fill="#ffffff" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">r1</text>
<circle cx="214.0" cy="70.0" r="20" fill="#3b82f6" stroke="#1f2933"/>
<text x="214.0" y="75.0" font-size="12.5" fill="#ffffff" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">r2</text>
<circle cx="278.0" cy="70.0" r="20" fill="#f3f4f6" stroke="#1f2933"/>
<text x="278.0" y="75.0" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">r3</text>
<text x="110.0" y="137.0" font-size="13" fill="#b45309" text-anchor="end" font-weight="bold" font-family="system-ui, sans-serif">read 1</text>
<circle cx="150.0" cy="132.0" r="20" fill="#dbeafe" stroke="#1f2933"/>
<circle cx="150" cy="132" r="25" fill="none" stroke="#f59e0b" stroke-width="3"/>
<text x="150.0" y="137.0" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">r1</text>
<circle cx="214.0" cy="132.0" r="20" fill="#dbeafe" stroke="#1f2933"/>
<circle cx="214" cy="132" r="25" fill="none" stroke="#f59e0b" stroke-width="3"/>
<text x="214.0" y="137.0" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">r2</text>
<circle cx="278.0" cy="132.0" r="20" fill="#f3f4f6" stroke="#1f2933"/>
<text x="278.0" y="137.0" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">r3</text>
<text x="332.0" y="137.0" font-size="12" fill="#059669" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">shares r1, r2</text>
<text x="110.0" y="199.0" font-size="13" fill="#b45309" text-anchor="end" font-weight="bold" font-family="system-ui, sans-serif">read 2</text>
<circle cx="150.0" cy="194.0" r="20" fill="#dbeafe" stroke="#1f2933"/>
<circle cx="150" cy="194" r="25" fill="none" stroke="#f59e0b" stroke-width="3"/>
<text x="150.0" y="199.0" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">r1</text>
<circle cx="214.0" cy="194.0" r="20" fill="#dbeafe" stroke="#1f2933"/>
<text x="214.0" y="199.0" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">r2</text>
<circle cx="278.0" cy="194.0" r="20" fill="#f3f4f6" stroke="#1f2933"/>
<circle cx="278" cy="194" r="25" fill="none" stroke="#f59e0b" stroke-width="3"/>
<text x="278.0" y="199.0" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">r3</text>
<text x="332.0" y="199.0" font-size="12" fill="#059669" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">shares r1</text>
<text x="110.0" y="261.0" font-size="13" fill="#b45309" text-anchor="end" font-weight="bold" font-family="system-ui, sans-serif">read 3</text>
<circle cx="150.0" cy="256.0" r="20" fill="#dbeafe" stroke="#1f2933"/>
<text x="150.0" y="261.0" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">r1</text>
<circle cx="214.0" cy="256.0" r="20" fill="#dbeafe" stroke="#1f2933"/>
<circle cx="214" cy="256" r="25" fill="none" stroke="#f59e0b" stroke-width="3"/>
<text x="214.0" y="261.0" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">r2</text>
<circle cx="278.0" cy="256.0" r="20" fill="#f3f4f6" stroke="#1f2933"/>
<circle cx="278" cy="256" r="25" fill="none" stroke="#f59e0b" stroke-width="3"/>
<text x="278.0" y="261.0" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">r3</text>
<text x="332.0" y="261.0" font-size="12" fill="#059669" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">shares r2</text>
<text x="20.0" y="322.0" font-size="12" fill="#4b5563" text-anchor="start" font-weight="normal" font-family="system-ui, sans-serif">blue = has the new write; orange ring = asked by the read. Every read meets a blue copy.</text>
</svg>
