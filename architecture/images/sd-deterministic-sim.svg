<title>Deterministic simulation: a seed drives a random number generator inside a simulator that controls the network, the clock and the disk; the whole system runs single-threaded inside it; the same seed replays exactly the same run, so a failing seed reproduces its bug every time, and sweeping many seeds explores many bad days</title>
