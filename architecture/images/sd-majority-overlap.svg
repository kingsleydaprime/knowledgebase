<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 230" width="520" height="230" role="img">
<title>Two majorities of a five-node cluster: quorum 1 is nodes 1, 2 and 3, quorum 2 is nodes 3, 4 and 5; any two sets of 3 out of 5 must share at least one node, here node 3, which remembers the earlier decision</title>
<rect width="100%" height="100%" rx="8" fill="#ffffff"/>
<rect x="36" y="62" width="258" height="76" rx="36" fill="#3b82f6" fill-opacity="0.12" stroke="#3b82f6" stroke-width="2"/>
<rect x="230" y="70" width="250" height="60" rx="30" fill="#f59e0b" fill-opacity="0.12" stroke="#f59e0b" stroke-width="2"/>
<circle cx="70.0" cy="100.0" r="22" fill="#ffffff" stroke="#1f2933"/>
<text x="70.0" y="105.0" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">n1</text>
<circle cx="165.0" cy="100.0" r="22" fill="#ffffff" stroke="#1f2933"/>
<text x="165.0" y="105.0" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">n2</text>
<circle cx="260.0" cy="100.0" r="22" fill="#d1fae5" stroke="#1f2933"/>
<text x="260.0" y="105.0" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">n3</text>
<circle cx="355.0" cy="100.0" r="22" fill="#ffffff" stroke="#1f2933"/>
<text x="355.0" y="105.0" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">n4</text>
<circle cx="450.0" cy="100.0" r="22" fill="#ffffff" stroke="#1f2933"/>
<text x="450.0" y="105.0" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">n5</text>
<text x="165.0" y="50.0" font-size="13" fill="#3b82f6" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">quorum 1: n1, n2, n3</text>
<text x="365.0" y="160.0" font-size="13" fill="#b45309" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">quorum 2: n3, n4, n5</text>
<text x="260.0" y="196.0" font-size="13" fill="#059669" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">a quorum is 3 of 5; any two quorums share a node (here n3)</text>
<text x="260.0" y="216.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">so a new quorum always contains someone who saw the last decision</text>
</svg>
