<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 252" width="560" height="252" role="img">
<title>User ids 1 to 12 on 3 shards. By range: shard 0 holds 1 to 4, shard 1 holds 5 to 8, shard 2 holds 9 to 12. By hash (id mod 3): shard 0 holds 3, 6, 9, 12; shard 1 holds 1, 4, 7, 10; shard 2 holds 2, 5, 8, 11</title>
<rect width="100%" height="100%" rx="8" fill="#ffffff"/>
<text x="118.0" y="70.0" font-size="14" fill="#1f2933" text-anchor="end" font-weight="bold" font-family="system-ui, sans-serif">by range</text>
<text x="118.0" y="88.0" font-size="11" fill="#4b5563" text-anchor="end" font-weight="normal" font-family="system-ui, sans-serif">neighbours together</text>
<rect x="130.0" y="44.0" width="128.0" height="62.0" rx="7" fill="#d1fae5" stroke="#1f2933" stroke-width="1.3"/>
<text x="194.0" y="72.0" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">shard 0</text>
<text x="194.0" y="88.0" font-size="11.5" fill="#4b5563" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">1, 2, 3, 4</text>
<rect x="270.0" y="44.0" width="128.0" height="62.0" rx="7" fill="#d1fae5" stroke="#1f2933" stroke-width="1.3"/>
<text x="334.0" y="72.0" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">shard 1</text>
<text x="334.0" y="88.0" font-size="11.5" fill="#4b5563" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">5, 6, 7, 8</text>
<rect x="410.0" y="44.0" width="128.0" height="62.0" rx="7" fill="#d1fae5" stroke="#1f2933" stroke-width="1.3"/>
<text x="474.0" y="72.0" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">shard 2</text>
<text x="474.0" y="88.0" font-size="11.5" fill="#4b5563" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">9, 10, 11, 12</text>
<text x="118.0" y="162.0" font-size="14" fill="#1f2933" text-anchor="end" font-weight="bold" font-family="system-ui, sans-serif">by hash</text>
<text x="118.0" y="180.0" font-size="11" fill="#4b5563" text-anchor="end" font-weight="normal" font-family="system-ui, sans-serif">user id mod 3</text>
<rect x="130.0" y="136.0" width="128.0" height="62.0" rx="7" fill="#d1fae5" stroke="#1f2933" stroke-width="1.3"/>
<text x="194.0" y="164.0" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">shard 0</text>
<text x="194.0" y="180.0" font-size="11.5" fill="#4b5563" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">3, 6, 9, 12</text>
<rect x="270.0" y="136.0" width="128.0" height="62.0" rx="7" fill="#d1fae5" stroke="#1f2933" stroke-width="1.3"/>
<text x="334.0" y="164.0" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">shard 1</text>
<text x="334.0" y="180.0" font-size="11.5" fill="#4b5563" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">1, 4, 7, 10</text>
<rect x="410.0" y="136.0" width="128.0" height="62.0" rx="7" fill="#d1fae5" stroke="#1f2933" stroke-width="1.3"/>
<text x="474.0" y="164.0" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">shard 2</text>
<text x="474.0" y="180.0" font-size="11.5" fill="#4b5563" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">2, 5, 8, 11</text>
<text x="340.0" y="22.0" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">user ids 1 to 12 on 3 shards</text>
<text x="340.0" y="222.0" font-size="11.5" fill="#4b5563" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">range keeps neighbours together: good for range queries, risks a hot shard</text>
<text x="340.0" y="240.0" font-size="11.5" fill="#4b5563" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">hash scatters neighbours evenly: no hot range, but a range query asks every shard</text>
</svg>
