<rect x="92.0" y="10.0" width="52.0" height="22.0" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1" fill-opacity="1"/>
<text x="118.0" y="26.0" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">0</text>
<rect x="144.0" y="10.0" width="52.0" height="22.0" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1" fill-opacity="1"/>
<text x="170.0" y="26.0" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">1</text>
<rect x="196.0" y="10.0" width="52.0" height="22.0" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1" fill-opacity="1"/>
<text x="222.0" y="26.0" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">2</text>
<rect x="248.0" y="10.0" width="52.0" height="22.0" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1" fill-opacity="1"/>
<text x="274.0" y="26.0" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">3</text>
<rect x="300.0" y="10.0" width="52.0" height="22.0" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1" fill-opacity="1"/>
<text x="326.0" y="26.0" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">4</text>
<rect x="352.0" y="10.0" width="52.0" height="22.0" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1" fill-opacity="1"/>
<text x="378.0" y="26.0" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">5</text>
<rect x="404.0" y="10.0" width="52.0" height="22.0" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1" fill-opacity="1"/>
<text x="430.0" y="26.0" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">6</text>
<rect x="456.0" y="10.0" width="52.0" height="22.0" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1" fill-opacity="1"/>
<text x="482.0" y="26.0" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">7</text>
<rect x="95.0" y="54" width="46.0" height="30" rx="6" fill="#dbeafe" stroke="#1f2933" stroke-width="1.2"/>
<text x="118.0" y="74.0" font-size="11.5" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">cell 1</text>
<rect x="95.0" y="98" width="98.0" height="30" rx="6" fill="#dbeafe" stroke="#1f2933" stroke-width="1.2"/>
<text x="144.0" y="118.0" font-size="11.5" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">cell 2: scores 0–1</text>
<rect x="199.0" y="54" width="46.0" height="30" rx="6" fill="#dbeafe" stroke="#1f2933" stroke-width="1.2"/>
<text x="222.0" y="74.0" font-size="11.5" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">cell 3</text>
<rect x="95.0" y="142" width="202.0" height="30" rx="6" fill="#fed7aa" stroke="#f59e0b" stroke-width="2.6"/>
<text x="196.0" y="162.0" font-size="11.5" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">cell 4: scores 0–3</text>
<rect x="303.0" y="54" width="46.0" height="30" rx="6" fill="#dbeafe" stroke="#1f2933" stroke-width="1.2"/>
<text x="326.0" y="74.0" font-size="11.5" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">cell 5</text>
<rect x="303.0" y="98" width="98.0" height="30" rx="6" fill="#fed7aa" stroke="#f59e0b" stroke-width="2.6"/>
<text x="352.0" y="118.0" font-size="11.5" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">cell 6: scores 4–5</text>
<rect x="407.0" y="54" width="46.0" height="30" rx="6" fill="#dbeafe" stroke="#1f2933" stroke-width="1.2"/>
<text x="430.0" y="74.0" font-size="11.5" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">cell 7</text>
<rect x="95.0" y="186" width="410.0" height="30" rx="6" fill="#dbeafe" stroke="#1f2933" stroke-width="1.2"/>
<text x="300.0" y="206.0" font-size="11.5" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">cell 8: scores 0–7</text>
<text x="82.0" y="74.0" font-size="11" fill="#4b5563" text-anchor="end" font-weight="normal" font-family="system-ui, sans-serif">1 score</text>
<text x="82.0" y="118.0" font-size="11" fill="#4b5563" text-anchor="end" font-weight="normal" font-family="system-ui, sans-serif">2 scores</text>
<text x="82.0" y="162.0" font-size="11" fill="#4b5563" text-anchor="end" font-weight="normal" font-family="system-ui, sans-serif">4 scores</text>
<text x="82.0" y="206.0" font-size="11" fill="#4b5563" text-anchor="end" font-weight="normal" font-family="system-ui, sans-serif">8 scores</text>
<text x="300.0" y="250.0" font-size="14" fill="#b45309" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">players scoring at most 5 = cell 6 + cell 4</text>
<text x="300.0" y="272.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">two cells instead of six scores</text>
</svg>
