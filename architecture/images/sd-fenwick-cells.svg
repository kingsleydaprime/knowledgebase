<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 532 300" width="532" height="300" role="img">
<title>Fenwick tree for scores 0 to 7: each cell counts players in a power-of-two range of scores; counting players scoring at most 5 adds cell 6 (scores 4 to 5) and cell 4 (scores 0 to 3)</title>
<rect width="100%" height="100%" rx="8" fill="#ffffff"/>
