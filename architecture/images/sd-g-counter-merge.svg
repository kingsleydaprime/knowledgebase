<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 290" width="560" height="290" role="img">
<title>A G-Counter merge: replica 1 holds A 3, B 1, C 0 (total 4) and replica 2 holds A 1, B 4, C 2 (total 7); merging takes the larger number for each node, giving A 3, B 4, C 2 with total 9, the same whichever order they merge in and however often</title>
<rect width="100%" height="100%" rx="8" fill="#ffffff"/>
<defs><marker id="a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b82f6"/></marker><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="a6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker></defs>
<text x="108.0" y="40.0" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">replica 1</text>
<rect x="30.0" y="50.0" width="48.0" height="44.0" fill="#dbeafe" stroke="#1f2933" stroke-width="1" fill-opacity="1"/>
<text x="54.0" y="67.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">A</text>
<text x="54.0" y="87.0" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">3</text>
<rect x="82.0" y="50.0" width="48.0" height="44.0" fill="#dbeafe" stroke="#1f2933" stroke-width="1" fill-opacity="1"/>
<text x="106.0" y="67.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">B</text>
<text x="106.0" y="87.0" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">1</text>
<rect x="134.0" y="50.0" width="48.0" height="44.0" fill="#dbeafe" stroke="#1f2933" stroke-width="1" fill-opacity="1"/>
<text x="158.0" y="67.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">C</text>
<text x="158.0" y="87.0" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">0</text>
<text x="194.0" y="80.0" font-size="14" fill="#3b82f6" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">= 4</text>
<text x="398.0" y="40.0" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">replica 2</text>
<rect x="320.0" y="50.0" width="48.0" height="44.0" fill="#dbeafe" stroke="#1f2933" stroke-width="1" fill-opacity="1"/>
<text x="344.0" y="67.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">A</text>
<text x="344.0" y="87.0" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">1</text>
<rect x="372.0" y="50.0" width="48.0" height="44.0" fill="#dbeafe" stroke="#1f2933" stroke-width="1" fill-opacity="1"/>
<text x="396.0" y="67.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">B</text>
<text x="396.0" y="87.0" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">4</text>
<rect x="424.0" y="50.0" width="48.0" height="44.0" fill="#dbeafe" stroke="#1f2933" stroke-width="1" fill-opacity="1"/>
<text x="448.0" y="67.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">C</text>
<text x="448.0" y="87.0" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">2</text>
<text x="484.0" y="80.0" font-size="14" fill="#3b82f6" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">= 7</text>
<line x1="110.0" y1="104.0" x2="230.0" y2="160.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#a5)"/>
<line x1="400.0" y1="104.0" x2="330.0" y2="160.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#a5)"/>
<text x="258.0" y="170.0" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">merged: the larger number for each node</text>
<rect x="180.0" y="180.0" width="48.0" height="44.0" fill="#fed7aa" stroke="#f59e0b" stroke-width="2.4" fill-opacity="1"/>
<text x="204.0" y="197.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">A</text>
<text x="204.0" y="217.0" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">3</text>
<rect x="232.0" y="180.0" width="48.0" height="44.0" fill="#fed7aa" stroke="#f59e0b" stroke-width="2.4" fill-opacity="1"/>
<text x="256.0" y="197.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">B</text>
<text x="256.0" y="217.0" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">4</text>
<rect x="284.0" y="180.0" width="48.0" height="44.0" fill="#fed7aa" stroke="#f59e0b" stroke-width="2.4" fill-opacity="1"/>
<text x="308.0" y="197.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">C</text>
<text x="308.0" y="217.0" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">2</text>
<text x="344.0" y="210.0" font-size="14" fill="#3b82f6" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">= 9</text>
<text x="280.0" y="256.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">max is order-free and repeat-safe: merge 1 with 2, 2 with 1,</text>
<text x="280.0" y="274.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">or the same message twice, and the total is always 9</text>
</svg>
