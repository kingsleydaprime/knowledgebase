<line x1="70.0" y1="200.0" x2="252.0" y2="208.0" stroke="#3b82f6" stroke-width="1.6" marker-end="url(#a1)"/>
<text x="160.0" y="196.0" font-size="11" fill="#3b82f6" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">GET /posts/p42</text>
<line x1="255.0" y1="216.0" x2="73.0" y2="224.0" stroke="#059669" stroke-width="1.6" marker-end="url(#a4)"/>
<text x="160.0" y="214.0" font-size="11" fill="#059669" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">answers</text>
<rect x="8.0" y="124.0" width="316.0" height="106.0" fill="#f59e0b" stroke="none" stroke-width="1" fill-opacity="0.08"/>
<text x="14.0" y="136.0" font-size="10.5" fill="#b45309" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">round trip 2</text>
<line x1="410.0" y1="88.0" x2="592.0" y2="96.0" stroke="#3b82f6" stroke-width="1.6" marker-end="url(#a1)"/>
<text x="500.0" y="84.0" font-size="11" fill="#3b82f6" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">POST /graphql</text>
<text x="500.0" y="112.0" font-size="10.5" fill="#4b5563" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">{ user(id: "u7") {</text>
<text x="500.0" y="127.0" font-size="10.5" fill="#4b5563" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">name</text>
<text x="500.0" y="142.0" font-size="10.5" fill="#4b5563" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">team { name }</text>
<text x="500.0" y="157.0" font-size="10.5" fill="#4b5563" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">posts(last: 2)</text>
<text x="500.0" y="172.0" font-size="10.5" fill="#4b5563" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">{ title } } }</text>
<line x1="595.0" y1="193.0" x2="413.0" y2="201.0" stroke="#059669" stroke-width="1.6" marker-end="url(#a4)"/>
<text x="500.0" y="189.0" font-size="11" fill="#059669" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">exactly those fields</text>
<rect x="348.0" y="72.0" width="316.0" height="139.0" fill="#f59e0b" stroke="none" stroke-width="1" fill-opacity="0.08"/>
<text x="354.0" y="84.0" font-size="10.5" fill="#b45309" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">round trip 1</text>
<text x="165.0" y="312.0" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">4 requests, 2 round trips = 200 ms</text>
<text x="165.0" y="330.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">every field of each resource</text>
<text x="505.0" y="312.0" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">1 request, 1 round trip = 100 ms</text>
<text x="505.0" y="330.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">only the fields asked for</text>
