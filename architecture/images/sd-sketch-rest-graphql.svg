<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 342" width="660" height="342" role="img">
<title>Answer sketch for the profile page. REST: round trip 1 is GET /users/u7; round trip 2 sends GET /teams/t2, GET /posts/p41 and GET /posts/p42 together; four requests, two round trips, 200 ms on a 100 ms connection. GraphQL: one POST, one round trip, 100 ms</title>
