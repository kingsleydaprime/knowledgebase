<text x="595.0" y="53.2" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">GraphQL server</text>
<line x1="410.0" y1="64.0" x2="410.0" y2="286.0" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="4 4"/>
<line x1="595.0" y1="64.0" x2="595.0" y2="286.0" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="4 4"/>
<line x1="70.0" y1="88.0" x2="252.0" y2="96.0" stroke="#3b82f6" stroke-width="1.6" marker-end="url(#a1)"/>
<text x="160.0" y="84.0" font-size="11" fill="#3b82f6" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">GET /users/u7</text>
<line x1="255.0" y1="104.0" x2="73.0" y2="112.0" stroke="#059669" stroke-width="1.6" marker-end="url(#a4)"/>
