<text x="160.0" y="136.0" font-size="11" fill="#3b82f6" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">GET /teams/t2</text>
<line x1="70.0" y1="170.0" x2="252.0" y2="178.0" stroke="#3b82f6" stroke-width="1.6" marker-end="url(#a1)"/>
