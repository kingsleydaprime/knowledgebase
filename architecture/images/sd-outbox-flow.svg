<text x="320.0" y="232.5" font-size="11.5" fill="#111827" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">row: OrderPlaced o5</text>
<line x1="395.0" y1="267.2" x2="542.0" y2="287.0" stroke="#3b82f6" stroke-width="1.6" marker-end="url(#a1)"/>
<text x="470.0" y="262.2" font-size="11.5" fill="#3b82f6" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">publish OrderPlaced</text>
