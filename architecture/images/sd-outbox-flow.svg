<text x="95.0" y="30.6" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">service</text>
<line x1="245.0" y1="50.0" x2="245.0" y2="372.2" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="4 4"/>
