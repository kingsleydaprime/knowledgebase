<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 386.2" width="640" height="386.2" role="img">
<title>The transactional outbox: the service inserts the order and an outbox row in one transaction and commits; separately, the relay selects unpublished outbox rows, publishes each to the broker, then marks it published</title>
