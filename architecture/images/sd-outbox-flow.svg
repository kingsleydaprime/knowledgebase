<text x="245.0" y="30.6" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">database</text>
<line x1="395.0" y1="50.0" x2="395.0" y2="372.2" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="4 4"/>
<rect x="330.0" y="10.0" width="130.0" height="32.0" rx="7" fill="#dbeafe" stroke="#1f2933" stroke-width="1.3"/>
<text x="395.0" y="30.6" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">relay</text>
<line x1="545.0" y1="50.0" x2="545.0" y2="372.2" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="4 4"/>
<rect x="480.0" y="10.0" width="130.0" height="32.0" rx="7" fill="#fde68a" stroke="#1f2933" stroke-width="1.3"/>
<text x="545.0" y="30.6" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">broker</text>
