<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 404.59999999999997" width="490" height="404.59999999999997" role="img">
<title>Two-phase commit blocking: both participants vote yes and hold their locks, then the coordinator crashes before announcing a decision; the participants are stuck, unable to commit or abort on their own until it recovers</title>
<rect width="100%" height="100%" rx="8" fill="#ffffff"/>
<defs><marker id="a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b82f6"/></marker><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="a6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker></defs>
<line x1="95.0" y1="50.0" x2="95.0" y2="390.6" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="4 4"/>
<rect x="30.0" y="10.0" width="130.0" height="32.0" rx="7" fill="#dbeafe" stroke="#1f2933" stroke-width="1.3"/>
<text x="95.0" y="30.6" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">coordinator</text>
<line x1="245.0" y1="50.0" x2="245.0" y2="390.6" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="4 4"/>
<rect x="180.0" y="10.0" width="130.0" height="32.0" rx="7" fill="#d1fae5" stroke="#1f2933" stroke-width="1.3"/>
<text x="245.0" y="30.6" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">node 1 (debit A)</text>
<line x1="395.0" y1="50.0" x2="395.0" y2="390.6" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="4 4"/>
<rect x="330.0" y="10.0" width="130.0" height="32.0" rx="7" fill="#d1fae5" stroke="#1f2933" stroke-width="1.3"/>
<text x="395.0" y="30.6" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">node 2 (credit B)</text>
<rect x="4.0" y="59.1" width="482.0" height="142.6" fill="#eff6ff" stroke="none" stroke-width="1" fill-opacity="1"/>
<text x="8.0" y="72.1" font-size="11" fill="#4b5563" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">phase 1: prepare (vote)</text>
<line x1="95.0" y1="87.0" x2="242.0" y2="96.3" stroke="#1f2933" stroke-width="1.6" marker-end="url(#a0)"/>
<text x="170.0" y="82.0" font-size="10.5" fill="#111827" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">prepare: can you commit?</text>
<line x1="95.0" y1="105.6" x2="392.0" y2="114.9" stroke="#1f2933" stroke-width="1.6" marker-end="url(#a0)"/>
<text x="245.0" y="100.6" font-size="10.5" fill="#111827" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif"></text>
<line x1="245.0" y1="142.8" x2="98.0" y2="152.1" stroke="#059669" stroke-width="1.6" marker-end="url(#a4)"/>
<text x="170.0" y="137.8" font-size="10.5" fill="#059669" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">yes (locked, promised)</text>
<line x1="395.0" y1="161.4" x2="98.0" y2="170.7" stroke="#059669" stroke-width="1.6" marker-end="url(#a4)"/>
<text x="245.0" y="156.4" font-size="10.5" fill="#059669" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">yes (locked, promised)</text>
<text x="103.0" y="227.4" font-size="12" fill="#dc2626" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">✗ coordinator crashes before deciding</text>
<rect x="239.0" y="242.0" width="12.0" height="130.2" fill="#f59e0b" stroke="none" stroke-width="1" fill-opacity="0.35"/>
<rect x="389.0" y="242.0" width="12.0" height="130.2" fill="#f59e0b" stroke="none" stroke-width="1" fill-opacity="0.35"/>
<text x="383.0" y="308.0" font-size="11.5" fill="#b45309" text-anchor="end" font-weight="bold" font-family="system-ui, sans-serif">stuck: locks held,</text>
<text x="383.0" y="326.6" font-size="11.5" fill="#b45309" text-anchor="end" font-weight="bold" font-family="system-ui, sans-serif">cannot decide alone</text>
</svg>
