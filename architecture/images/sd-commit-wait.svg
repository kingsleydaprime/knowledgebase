<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 240" width="580" height="240" role="img">
<title>Spanner commit wait with a TrueTime uncertainty of 4 ms: at true time 100 TrueTime says between 96 and 104, so the commit gets timestamp 104; Spanner then waits until the earliest possible time is past 104, just after true time 108, twice the uncertainty, before releasing locks</title>
