<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 250" width="560" height="250" role="img">
<title>Partitioning plus replication: three shards, each copied to all three nodes; each shard's copies form a small Raft group, and each node leads a different shard, so writes are spread across the nodes and any one node can fail</title>
<rect width="100%" height="100%" rx="8" fill="#ffffff"/>
<rect x="30" y="40" width="160" height="180" rx="10" fill="#f3f4f6" stroke="#1f2933"/>
<text x="110.0" y="30.0" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">node 1</text>
<rect x="44.0" y="56.0" width="132.0" height="40.0" fill="#dbeafe" stroke="#f59e0b" stroke-width="2.6" fill-opacity="1"/>
<text x="110.0" y="74.0" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">shard 1</text>
<text x="110.0" y="89.0" font-size="11" fill="#b45309" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">leader</text>
<rect x="44.0" y="110.0" width="132.0" height="40.0" fill="#d1fae5" stroke="#1f2933" stroke-width="1" fill-opacity="1"/>
<text x="110.0" y="128.0" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">shard 2</text>
<text x="110.0" y="143.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">follower</text>
<rect x="44.0" y="164.0" width="132.0" height="40.0" fill="#fde68a" stroke="#1f2933" stroke-width="1" fill-opacity="1"/>
<text x="110.0" y="182.0" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">shard 3</text>
<text x="110.0" y="197.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">follower</text>
<rect x="205" y="40" width="160" height="180" rx="10" fill="#f3f4f6" stroke="#1f2933"/>
<text x="285.0" y="30.0" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">node 2</text>
