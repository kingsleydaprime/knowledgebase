<text x="285.0" y="197.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">follower</text>
<rect x="380" y="40" width="160" height="180" rx="10" fill="#f3f4f6" stroke="#1f2933"/>
<text x="460.0" y="30.0" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">node 3</text>
<rect x="394.0" y="56.0" width="132.0" height="40.0" fill="#dbeafe" stroke="#1f2933" stroke-width="1" fill-opacity="1"/>
<text x="460.0" y="74.0" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">shard 1</text>
<text x="460.0" y="89.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">follower</text>
