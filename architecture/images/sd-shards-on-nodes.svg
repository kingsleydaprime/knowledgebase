<text x="460.0" y="143.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">follower</text>
<rect x="394.0" y="164.0" width="132.0" height="40.0" fill="#fde68a" stroke="#f59e0b" stroke-width="2.6" fill-opacity="1"/>
<text x="460.0" y="182.0" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">shard 3</text>
<text x="460.0" y="197.0" font-size="11" fill="#b45309" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">leader</text>
<text x="280.0" y="242.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">each shard = a 3-copy Raft group; orange = that shard's leader</text>
</svg>
