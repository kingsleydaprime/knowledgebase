<text x="285.0" y="74.0" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">shard 1</text>
<text x="285.0" y="89.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">follower</text>
<rect x="219.0" y="110.0" width="132.0" height="40.0" fill="#d1fae5" stroke="#f59e0b" stroke-width="2.6" fill-opacity="1"/>
<text x="285.0" y="128.0" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">shard 2</text>
<text x="285.0" y="143.0" font-size="11" fill="#b45309" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">leader</text>
<rect x="219.0" y="164.0" width="132.0" height="40.0" fill="#fde68a" stroke="#1f2933" stroke-width="1" fill-opacity="1"/>
