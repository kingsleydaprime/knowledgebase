<title>Fan-out on write against fan-out on read. On write: when Ada posts, the post is pushed into each follower's precomputed timeline, so reading is one lookup but a celebrity's post means millions of writes. On read: the post is stored once, and a follower's timeline is assembled at read time from everyone they follow, so writes are cheap and reads are slow</title>
