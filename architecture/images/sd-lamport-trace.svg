<text x="170.0" y="23.0" font-size="12" fill="#3b82f6" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">b:2</text>
<circle cx="120.0" cy="114.0" r="5.5" fill="#1f2933" stroke="none"/>
<text x="120.0" y="103.0" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">c:1</text>
<circle cx="260.0" cy="114.0" r="5.5" fill="#059669" stroke="none"/>
