<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 242" width="520" height="242" role="img">
<title>Lamport clocks on three processes: P1 has a:1 and b:2, and b sends m to P2; P2 has c:1, then receives m at d:3 (max of 1 and 2, plus 1), then sends n at e:4; P3 has f:1 and g:2, then receives n at h:5 (max of 2 and 4, plus 1)</title>
