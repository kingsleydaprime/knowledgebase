<title>How Jepsen tests a database: many clients run concurrent operations against the real cluster while a nemesis injects partitions, crashes, pauses and clock skew; every operation and result is recorded in a history; a checker such as Knossos or Elle asks whether any single-machine order explains the history, and either passes it or prints the exact counterexample</title>
