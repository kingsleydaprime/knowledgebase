<text x="20.0" y="30.0" font-size="13" fill="#1f2933" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">bucket: 3 tokens, +1 token a second; each request spends one</text>
<text x="20.0" y="50.0" font-size="12" fill="#4b5563" text-anchor="start" font-weight="normal" font-family="system-ui, sans-serif">green = allowed, red = rejected (bucket below 1 token)</text>
<text x="80.0" y="200.0" font-size="11.5" fill="#4b5563" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">5 at once: 3 pass</text>
<text x="250.0" y="200.0" font-size="11.5" fill="#4b5563" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">2 tokens back: 2 of 3 pass</text>
<text x="490.0" y="200.0" font-size="11.5" fill="#4b5563" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">full again</text>
