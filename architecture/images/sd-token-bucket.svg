<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 230" width="580" height="230" role="img">
<title>A token bucket holding 3 tokens and refilling 1 a second: of five requests in the first second, three are allowed and two rejected; by 2 seconds two tokens have come back, so two of the three requests at 2.0, 2.1 and 2.2 seconds are allowed and the third is rejected; at 4.5 seconds the bucket has refilled and the request is allowed</title>
<rect width="100%" height="100%" rx="8" fill="#ffffff"/>
