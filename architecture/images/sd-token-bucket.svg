<text x="340.0" y="172.0" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">3 s</text>
<line x1="440.0" y1="145.0" x2="440.0" y2="155.0" stroke="#6b7280" stroke-width="1.5"/>
<text x="440.0" y="172.0" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">4 s</text>
