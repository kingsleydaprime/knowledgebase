<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 530 488" width="530" height="488" role="img">
<title>Three shapes of delivery. A queue gives each message to one of the competing workers. A topic copies each message into every subscription queue. A log keeps messages in order at numbered offsets, and each consumer group reads from its own offset</title>
