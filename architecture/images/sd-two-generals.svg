<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 326.8" width="500" height="326.8" role="img">
<title>Two Generals: A sends attack at dawn, B acks, A acks the ack, B acks that, and so on; each message needs a confirmation, so whoever sent the last message can never be sure it arrived</title>
<rect width="100%" height="100%" rx="8" fill="#ffffff"/>
<defs><marker id="a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b82f6"/></marker><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="a6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker></defs>
<line x1="135.0" y1="50.0" x2="135.0" y2="312.8" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="4 4"/>
<rect x="30.0" y="10.0" width="210.0" height="32.0" rx="7" fill="#dbeafe" stroke="#1f2933" stroke-width="1.3"/>
<text x="135.0" y="30.6" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">General A</text>
<line x1="365.0" y1="50.0" x2="365.0" y2="312.8" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="4 4"/>
<rect x="260.0" y="10.0" width="210.0" height="32.0" rx="7" fill="#fee2e2" stroke="#1f2933" stroke-width="1.3"/>
<text x="365.0" y="30.6" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">General B</text>
<line x1="135.0" y1="82.4" x2="362.0" y2="106.6" stroke="#1f2933" stroke-width="1.6" marker-end="url(#a0)"/>
<text x="250.0" y="77.4" font-size="11.5" fill="#111827" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">attack at dawn</text>
<line x1="365.0" y1="126.4" x2="138.0" y2="150.6" stroke="#1f2933" stroke-width="1.6" marker-end="url(#a0)"/>
<text x="250.0" y="121.4" font-size="11.5" fill="#111827" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">got it (ack)</text>
<line x1="135.0" y1="170.4" x2="362.0" y2="194.6" stroke="#1f2933" stroke-width="1.6" marker-end="url(#a0)"/>
<text x="250.0" y="165.4" font-size="11.5" fill="#111827" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">got your ack</text>
<line x1="365.0" y1="214.4" x2="138.0" y2="238.6" stroke="#f59e0b" stroke-width="1.6" marker-end="url(#a3)" stroke-dasharray="5 4"/>
<text x="250.0" y="209.4" font-size="11.5" fill="#f59e0b" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">got your ack of my ack  - did it arrive?</text>
<text x="175.0" y="280.0" font-size="11.5" fill="#b45309" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">the last message is always unconfirmed</text>
</svg>
