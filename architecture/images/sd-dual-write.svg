<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 300" width="660" height="300" role="img">
<title>The two failures of a dual write. Save, then publish: the order insert commits, the service crashes, and the publish never happens, so the order is lost to everyone else. Publish, then save: OrderPlaced is sent, then the insert fails, so everyone hears about a phantom order that does not exist</title>
