<text x="120.0" y="146.0" font-size="12" fill="#1f2933" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">AppendEntries checks (prevLogIndex, prevLogTerm), walking back:</text>
<text x="120.0" y="168.0" font-size="12" fill="#dc2626" text-anchor="start" font-weight="normal" font-family="system-ui, sans-serif">1. prev = (6, t3)  -&gt;  follower has no entry there: reject</text>
<text x="120.0" y="192.0" font-size="12" fill="#dc2626" text-anchor="start" font-weight="normal" font-family="system-ui, sans-serif">2. prev = (5, t3)  -&gt;  follower has t2 there: reject</text>
<text x="120.0" y="216.0" font-size="12" fill="#dc2626" text-anchor="start" font-weight="normal" font-family="system-ui, sans-serif">3. prev = (4, t3)  -&gt;  follower has t2 there: reject</text>
<text x="120.0" y="240.0" font-size="12" fill="#059669" text-anchor="start" font-weight="normal" font-family="system-ui, sans-serif">4. prev = (3, t2)  -&gt;  match: accept</text>
