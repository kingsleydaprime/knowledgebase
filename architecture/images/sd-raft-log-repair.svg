<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 346" width="500" height="346" role="img">
<title>Raft log repair: the leader's log has terms 1, 1, 2, 3, 3, 3 and the follower's has 1, 1, 2, 2, 2; the leader tries prevLogIndex 6, 5 and 4, which the follower rejects, then 3 with term 2, which matches; the follower keeps entries 1 to 3 and takes the leader's entries 4 to 6</title>
