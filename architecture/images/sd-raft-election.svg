<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 392.8" width="600" height="392.8" role="img">
<title>A Raft election in a five-node cluster: N2 has the shortest random timeout, 170 ms, so it times out first, moves to term 2, votes for itself and sends RequestVote to the other four; they grant their votes; with a majority N2 becomes leader and sends heartbeats, which reset everyone else's timers</title>
<rect width="100%" height="100%" rx="8" fill="#ffffff"/>
<defs><marker id="a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b82f6"/></marker><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="a6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker></defs>
<line x1="76.0" y1="50.0" x2="76.0" y2="378.8" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="4 4"/>
<rect x="30.0" y="10.0" width="92.0" height="32.0" rx="7" fill="#dbeafe" stroke="#1f2933" stroke-width="1.3"/>
<text x="76.0" y="30.6" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">N1</text>
<line x1="188.0" y1="50.0" x2="188.0" y2="378.8" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="4 4"/>
<rect x="142.0" y="10.0" width="92.0" height="32.0" rx="7" fill="#fef3c7" stroke="#1f2933" stroke-width="1.3"/>
<text x="188.0" y="30.6" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">N2</text>
<line x1="300.0" y1="50.0" x2="300.0" y2="378.8" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="4 4"/>
<rect x="254.0" y="10.0" width="92.0" height="32.0" rx="7" fill="#dbeafe" stroke="#1f2933" stroke-width="1.3"/>
<text x="300.0" y="30.6" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">N3</text>
<line x1="412.0" y1="50.0" x2="412.0" y2="378.8" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="4 4"/>
<rect x="366.0" y="10.0" width="92.0" height="32.0" rx="7" fill="#dbeafe" stroke="#1f2933" stroke-width="1.3"/>
<text x="412.0" y="30.6" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">N4</text>
<line x1="524.0" y1="50.0" x2="524.0" y2="378.8" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="4 4"/>
<rect x="478.0" y="10.0" width="92.0" height="32.0" rx="7" fill="#dbeafe" stroke="#1f2933" stroke-width="1.3"/>
<text x="524.0" y="30.6" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">N5</text>
<text x="76.0" y="69.9" font-size="10.5" fill="#4b5563" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">timeout 260 ms</text>
<text x="188.0" y="69.9" font-size="10.5" fill="#f59e0b" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">timeout 170 ms</text>
<text x="300.0" y="69.9" font-size="10.5" fill="#4b5563" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">timeout 290 ms</text>
<text x="412.0" y="69.9" font-size="10.5" fill="#4b5563" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">timeout 220 ms</text>
<text x="524.0" y="69.9" font-size="10.5" fill="#4b5563" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">timeout 240 ms</text>
<text x="188.0" y="102.9" font-size="11" fill="#b45309" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">times out first: term 2</text>
<line x1="188.0" y1="128.6" x2="79.0" y2="138.5" stroke="#1f2933" stroke-width="1.6" marker-end="url(#a0)"/>
<text x="132.0" y="123.6" font-size="10" fill="#111827" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">RequestVote(term 2)</text>
<line x1="188.0" y1="140.2" x2="297.0" y2="150.1" stroke="#1f2933" stroke-width="1.6" marker-end="url(#a0)"/>
<text x="244.0" y="135.2" font-size="10" fill="#111827" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif"></text>
<line x1="188.0" y1="151.7" x2="409.0" y2="161.6" stroke="#1f2933" stroke-width="1.6" marker-end="url(#a0)"/>
<text x="300.0" y="146.7" font-size="10" fill="#111827" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif"></text>
<line x1="188.0" y1="163.2" x2="521.0" y2="173.1" stroke="#1f2933" stroke-width="1.6" marker-end="url(#a0)"/>
<text x="356.0" y="158.2" font-size="10" fill="#111827" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif"></text>
<line x1="76.0" y1="194.6" x2="185.0" y2="204.5" stroke="#059669" stroke-width="1.6" marker-end="url(#a4)"/>
<text x="132.0" y="189.6" font-size="10" fill="#059669" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">vote granted</text>
<line x1="300.0" y1="206.2" x2="191.0" y2="216.0" stroke="#059669" stroke-width="1.6" marker-end="url(#a4)"/>
<text x="244.0" y="201.2" font-size="10" fill="#059669" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif"></text>
<line x1="412.0" y1="217.7" x2="191.0" y2="227.6" stroke="#059669" stroke-width="1.6" marker-end="url(#a4)"/>
<text x="300.0" y="212.7" font-size="10" fill="#059669" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif"></text>
<line x1="524.0" y1="229.2" x2="191.0" y2="239.2" stroke="#059669" stroke-width="1.6" marker-end="url(#a4)"/>
<text x="356.0" y="224.2" font-size="10" fill="#059669" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif"></text>
<text x="188.0" y="264.6" font-size="11.5" fill="#059669" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">5 of 5 votes: LEADER</text>
<line x1="188.0" y1="287.0" x2="79.0" y2="296.9" stroke="#3b82f6" stroke-width="1.6" marker-end="url(#a1)"/>
<text x="132.0" y="282.0" font-size="10" fill="#3b82f6" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">heartbeat (empty AppendEntries)</text>
<line x1="188.0" y1="298.5" x2="297.0" y2="308.4" stroke="#3b82f6" stroke-width="1.6" marker-end="url(#a1)"/>
<text x="244.0" y="293.5" font-size="10" fill="#3b82f6" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif"></text>
<line x1="188.0" y1="310.1" x2="409.0" y2="320.0" stroke="#3b82f6" stroke-width="1.6" marker-end="url(#a1)"/>
<text x="300.0" y="305.1" font-size="10" fill="#3b82f6" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif"></text>
<line x1="188.0" y1="321.7" x2="521.0" y2="331.6" stroke="#3b82f6" stroke-width="1.6" marker-end="url(#a1)"/>
<text x="356.0" y="316.7" font-size="10" fill="#3b82f6" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif"></text>
<text x="300.0" y="363.6" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">heartbeats reset the other timers, so nobody else runs</text>
</svg>
