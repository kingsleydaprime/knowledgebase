<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 610 274" width="610" height="274" role="img">
<title>Answer sketch with N = 5, W = 3, R = 3: the write reaches r1, r2 and r3; a read that tries to avoid them can take r4 and r5 but must still take one of r1 to r3, so it shares at least one copy (3 + 3 - 5 = 1)</title>
<rect width="100%" height="100%" rx="8" fill="#ffffff"/>
<text x="20.0" y="28.0" font-size="14" fill="#1f2933" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">N = 5 copies, W = 3, R = 3: W + R = 6 &gt; 5</text>
<text x="110.0" y="75.0" font-size="13" fill="#3b82f6" text-anchor="end" font-weight="bold" font-family="system-ui, sans-serif">write</text>
<circle cx="150.0" cy="70.0" r="20" fill="#3b82f6" stroke="#1f2933"/>
<text x="150.0" y="75.0" font-size="12.5" fill="#ffffff" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">r1</text>
<circle cx="214.0" cy="70.0" r="20" fill="#3b82f6" stroke="#1f2933"/>
<text x="214.0" y="75.0" font-size="12.5" fill="#ffffff" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">r2</text>
<circle cx="278.0" cy="70.0" r="20" fill="#3b82f6" stroke="#1f2933"/>
<text x="278.0" y="75.0" font-size="12.5" fill="#ffffff" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">r3</text>
<circle cx="342.0" cy="70.0" r="20" fill="#f3f4f6" stroke="#1f2933"/>
<text x="342.0" y="75.0" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">r4</text>
<circle cx="406.0" cy="70.0" r="20" fill="#f3f4f6" stroke="#1f2933"/>
<text x="406.0" y="75.0" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">r5</text>
<text x="110.0" y="137.0" font-size="13" fill="#b45309" text-anchor="end" font-weight="bold" font-family="system-ui, sans-serif">read 1</text>
<circle cx="150.0" cy="132.0" r="20" fill="#dbeafe" stroke="#1f2933"/>
<text x="150.0" y="137.0" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">r1</text>
<circle cx="214.0" cy="132.0" r="20" fill="#dbeafe" stroke="#1f2933"/>
<text x="214.0" y="137.0" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">r2</text>
<circle cx="278.0" cy="132.0" r="20" fill="#dbeafe" stroke="#1f2933"/>
<circle cx="278" cy="132" r="25" fill="none" stroke="#f59e0b" stroke-width="3"/>
<text x="278.0" y="137.0" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">r3</text>
<circle cx="342.0" cy="132.0" r="20" fill="#f3f4f6" stroke="#1f2933"/>
<circle cx="342" cy="132" r="25" fill="none" stroke="#f59e0b" stroke-width="3"/>
<text x="342.0" y="137.0" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">r4</text>
<circle cx="406.0" cy="132.0" r="20" fill="#f3f4f6" stroke="#1f2933"/>
<circle cx="406" cy="132" r="25" fill="none" stroke="#f59e0b" stroke-width="3"/>
<text x="406.0" y="137.0" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">r5</text>
<text x="460.0" y="137.0" font-size="12" fill="#059669" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">shares r3</text>
<text x="110.0" y="199.0" font-size="13" fill="#b45309" text-anchor="end" font-weight="bold" font-family="system-ui, sans-serif">read 2</text>
<circle cx="150.0" cy="194.0" r="20" fill="#dbeafe" stroke="#1f2933"/>
<circle cx="150" cy="194" r="25" fill="none" stroke="#f59e0b" stroke-width="3"/>
<text x="150.0" y="199.0" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">r1</text>
<circle cx="214.0" cy="194.0" r="20" fill="#dbeafe" stroke="#1f2933"/>
<text x="214.0" y="199.0" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">r2</text>
<circle cx="278.0" cy="194.0" r="20" fill="#dbeafe" stroke="#1f2933"/>
<text x="278.0" y="199.0" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">r3</text>
<circle cx="342.0" cy="194.0" r="20" fill="#f3f4f6" stroke="#1f2933"/>
<circle cx="342" cy="194" r="25" fill="none" stroke="#f59e0b" stroke-width="3"/>
<text x="342.0" y="199.0" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">r4</text>
<circle cx="406.0" cy="194.0" r="20" fill="#f3f4f6" stroke="#1f2933"/>
<circle cx="406" cy="194" r="25" fill="none" stroke="#f59e0b" stroke-width="3"/>
<text x="406.0" y="199.0" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">r5</text>
<text x="460.0" y="199.0" font-size="12" fill="#059669" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">shares r1</text>
<text x="20.0" y="260.0" font-size="12" fill="#4b5563" text-anchor="start" font-weight="normal" font-family="system-ui, sans-serif">blue = has the new write; orange ring = asked by the read. Every read meets a blue copy.</text>
</svg>
