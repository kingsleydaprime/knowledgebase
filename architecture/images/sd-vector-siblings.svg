<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 284" width="600" height="284" role="img">
<title>Vector clocks catching a conflict: node A writes cat with [1,0,0] and node B writes dog with [0,1,0]; neither dominates, so they are concurrent and the store keeps both as siblings; the client reads both, resolves cat-dog and writes it with the merged clock [1,1,0]; A's later write [2,1,0] descends from it, so there is no conflict</title>
<rect width="100%" height="100%" rx="8" fill="#ffffff"/>
<defs><marker id="a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b82f6"/></marker><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="a6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker></defs>
<text x="58.0" y="39.0" font-size="14" fill="#1f2933" text-anchor="end" font-weight="bold" font-family="system-ui, sans-serif">A</text>
<line x1="70.0" y1="34.0" x2="586.0" y2="34.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#a5)"/>
<text x="58.0" y="127.0" font-size="14" fill="#1f2933" text-anchor="end" font-weight="bold" font-family="system-ui, sans-serif">B</text>
<line x1="70.0" y1="122.0" x2="586.0" y2="122.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#a5)"/>
<text x="58.0" y="215.0" font-size="14" fill="#1f2933" text-anchor="end" font-weight="bold" font-family="system-ui, sans-serif">client</text>
<line x1="70.0" y1="210.0" x2="586.0" y2="210.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#a5)"/>
<circle cx="100.0" cy="34.0" r="5.5" fill="#3b82f6" stroke="none"/>
<text x="100.0" y="23.0" font-size="12" fill="#3b82f6" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">cat [1,0,0]</text>
<circle cx="130.0" cy="122.0" r="5.5" fill="#3b82f6" stroke="none"/>
<text x="130.0" y="111.0" font-size="12" fill="#3b82f6" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">dog [0,1,0]</text>
<line x1="100.0" y1="34.0" x2="265.1" y2="205.0" stroke="#3b82f6" stroke-width="1.6" marker-end="url(#a1)"/>
<line x1="130.0" y1="122.0" x2="264.1" y2="206.3" stroke="#3b82f6" stroke-width="1.6" marker-end="url(#a1)"/>
<circle cx="270.0" cy="210.0" r="5.5" fill="#dc2626" stroke="none"/>
<text x="270.0" y="231.0" font-size="12" fill="#dc2626" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">reads both: siblings</text>
<circle cx="340.0" cy="210.0" r="5.5" fill="#059669" stroke="none"/>
<text x="340.0" y="199.0" font-size="12" fill="#059669" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif"></text>
<text x="350.0" y="231.0" font-size="12" fill="#059669" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">writes cat-dog [1,1,0]</text>
<line x1="340.0" y1="210.0" x2="417.1" y2="40.4" stroke="#3b82f6" stroke-width="1.6" marker-end="url(#a1)"/>
<circle cx="420.0" cy="34.0" r="5.5" fill="#059669" stroke="none"/>
<text x="420.0" y="23.0" font-size="12" fill="#059669" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">stored [1,1,0]</text>
<circle cx="520.0" cy="34.0" r="5.5" fill="#1f2933" stroke="none"/>
<text x="520.0" y="23.0" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">[2,1,0]</text>
<text x="520.0" y="56.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">later write: no conflict</text>
<text x="300.0" y="268.0" font-size="12" fill="#dc2626" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">[1,0,0] vs [0,1,0]: neither dominates, so the writes are concurrent</text>
</svg>
