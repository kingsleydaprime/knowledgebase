<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 250" width="560" height="250" role="img">
<title>Encoding 150 as a protobuf varint: 150 is 10010110 in binary; split into 7-bit groups from the lowest, 0010110 and 0000001; the first byte gets a top bit of 1 because more follows, giving 96 in hex, and the last byte gets 0, giving 01; with the tag 08 the field id = 150 is 08 96 01</title>
