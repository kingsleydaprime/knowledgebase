<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 230" width="560" height="230" role="img">
<title>Clock skew breaks last-write-wins: node A's clock is 50 ms ahead of B's; A writes cat stamped 100, then B writes dog later in real time but stamped 60; last-write-wins keeps the higher stamp, cat, so B's newer write is lost</title>
<rect width="100%" height="100%" rx="8" fill="#ffffff"/>
<defs><marker id="a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b82f6"/></marker><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="a6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker></defs>
<text x="44.0" y="39.0" font-size="14" fill="#1f2933" text-anchor="end" font-weight="bold" font-family="system-ui, sans-serif">A</text>
<line x1="56.0" y1="34.0" x2="546.0" y2="34.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#a5)"/>
<text x="44.0" y="119.0" font-size="14" fill="#1f2933" text-anchor="end" font-weight="bold" font-family="system-ui, sans-serif">B</text>
<line x1="56.0" y1="114.0" x2="546.0" y2="114.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#a5)"/>
<circle cx="240.0" cy="34.0" r="5.5" fill="#3b82f6" stroke="none"/>
<text x="240.0" y="23.0" font-size="12" fill="#3b82f6" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">x = "cat", stamp 100</text>
<circle cx="420.0" cy="114.0" r="5.5" fill="#f59e0b" stroke="none"/>
<text x="420.0" y="135.0" font-size="12" fill="#f59e0b" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">x = "dog", stamp 60</text>
<text x="240.0" y="58.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">A's clock: 50 ms fast</text>
<text x="420.0" y="100.0" font-size="11" fill="#b45309" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">later in real time</text>
<text x="280.0" y="200.0" font-size="12.5" fill="#dc2626" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">last write wins keeps stamp 100: "cat" wins, the newer "dog" is lost</text>
<text x="530.0" y="148.0" font-size="11" fill="#6b7280" text-anchor="end" font-weight="normal" font-family="system-ui, sans-serif">real time</text>
</svg>
