<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 386.2" width="560" height="386.2" role="img">
<title>SWIM indirect ping: A pings B and gets no reply because the A to B link is flaky; instead of declaring B dead, A asks C and D to ping B; B answers them, they pass the acks back to A, and A keeps B as alive</title>
<rect width="100%" height="100%" rx="8" fill="#ffffff"/>
<defs><marker id="a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b82f6"/></marker><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="a6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker></defs>
<line x1="85.0" y1="50.0" x2="85.0" y2="372.2" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="4 4"/>
<rect x="30.0" y="10.0" width="110.0" height="32.0" rx="7" fill="#dbeafe" stroke="#1f2933" stroke-width="1.3"/>
<text x="85.0" y="30.6" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">A</text>
<line x1="215.0" y1="50.0" x2="215.0" y2="372.2" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="4 4"/>
<rect x="160.0" y="10.0" width="110.0" height="32.0" rx="7" fill="#fee2e2" stroke="#1f2933" stroke-width="1.3"/>
<text x="215.0" y="30.6" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">B</text>
<line x1="345.0" y1="50.0" x2="345.0" y2="372.2" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="4 4"/>
<rect x="290.0" y="10.0" width="110.0" height="32.0" rx="7" fill="#dbeafe" stroke="#1f2933" stroke-width="1.3"/>
<text x="345.0" y="30.6" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">C</text>
<line x1="475.0" y1="50.0" x2="475.0" y2="372.2" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="4 4"/>
<rect x="420.0" y="10.0" width="110.0" height="32.0" rx="7" fill="#dbeafe" stroke="#1f2933" stroke-width="1.3"/>
<text x="475.0" y="30.6" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">D</text>
<line x1="85.0" y1="75.8" x2="212.0" y2="85.7" stroke="#dc2626" stroke-width="1.6" marker-end="url(#a2)" stroke-dasharray="5 4"/>
<text x="150.0" y="70.8" font-size="11.5" fill="#dc2626" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">ping</text>
<text x="93.0" y="106.2" font-size="11" fill="#dc2626" text-anchor="start" font-weight="normal" font-family="system-ui, sans-serif">no reply (A to B link flaky)</text>
<line x1="85.0" y1="131.9" x2="342.0" y2="141.8" stroke="#1f2933" stroke-width="1.6" marker-end="url(#a0)"/>
<text x="215.0" y="126.9" font-size="11.5" fill="#111827" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">ping-req: check B</text>
<line x1="85.0" y1="155.0" x2="472.0" y2="164.9" stroke="#1f2933" stroke-width="1.6" marker-end="url(#a0)"/>
<text x="280.0" y="150.0" font-size="11.5" fill="#111827" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">ping-req: check B</text>
<line x1="345.0" y1="188.0" x2="218.0" y2="197.9" stroke="#1f2933" stroke-width="1.6" marker-end="url(#a0)"/>
<text x="280.0" y="183.0" font-size="11.5" fill="#111827" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">ping</text>
<line x1="475.0" y1="207.8" x2="218.0" y2="217.7" stroke="#1f2933" stroke-width="1.6" marker-end="url(#a0)"/>
<text x="345.0" y="202.8" font-size="11.5" fill="#111827" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">ping</text>
<line x1="215.0" y1="234.2" x2="342.0" y2="244.1" stroke="#059669" stroke-width="1.6" marker-end="url(#a4)"/>
<text x="280.0" y="229.2" font-size="11.5" fill="#059669" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">ack</text>
<line x1="215.0" y1="254.0" x2="472.0" y2="263.9" stroke="#059669" stroke-width="1.6" marker-end="url(#a4)"/>
<text x="345.0" y="249.0" font-size="11.5" fill="#059669" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">ack</text>
<line x1="345.0" y1="283.7" x2="88.0" y2="293.6" stroke="#059669" stroke-width="1.6" marker-end="url(#a4)"/>
<text x="215.0" y="278.7" font-size="11.5" fill="#059669" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">B is alive</text>
<line x1="475.0" y1="306.8" x2="88.0" y2="316.7" stroke="#059669" stroke-width="1.6" marker-end="url(#a4)"/>
<text x="280.0" y="301.8" font-size="11.5" fill="#059669" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">B is alive</text>
<text x="93.0" y="350.4" font-size="11.5" fill="#059669" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">B stays in the cluster: a false alarm avoided</text>
</svg>
