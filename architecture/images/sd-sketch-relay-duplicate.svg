<title>Answer sketch: the relay publishes PaymentCaptured evt-p9, the consumer applies it, the relay crashes before marking it sent, restarts, finds the row still unpublished and publishes it again; the consumer skips the second copy as a duplicate; then the relay marks the row published</title>
