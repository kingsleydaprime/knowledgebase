<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img">
<title>A network partition between node A and node B: a client writes x = 2 to node A, which cannot reach node B; another client reads x from node B. A CP system answers with an error; an AP system answers with the old value x = 1</title>
<rect width="100%" height="100%" rx="8" fill="#ffffff"/>
<defs><marker id="a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b82f6"/></marker><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="a6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker></defs>
<text x="160.0" y="24.0" font-size="14" fill="#dc2626" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">CP: refuse rather than be wrong</text>
<rect x="30.0" y="110.0" width="100.0" height="50.0" rx="7" fill="#d1fae5" stroke="#1f2933" stroke-width="1.3"/>
<text x="80.0" y="132.0" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">node A</text>
<text x="80.0" y="148.0" font-size="10.5" fill="#4b5563" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">x = 2 (new)</text>
<rect x="200.0" y="110.0" width="100.0" height="50.0" rx="7" fill="#d1fae5" stroke="#1f2933" stroke-width="1.3"/>
<text x="250.0" y="132.0" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">node B</text>
<text x="250.0" y="148.0" font-size="10.5" fill="#4b5563" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">x = 1</text>
<line x1="130.0" y1="135.0" x2="200.0" y2="135.0" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="5 4"/>
<line x1="157.0" y1="123.0" x2="173.0" y2="147.0" stroke="#dc2626" stroke-width="3"/>
<line x1="173.0" y1="123.0" x2="157.0" y2="147.0" stroke="#dc2626" stroke-width="3"/>
<text x="165.0" y="112.0" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">partition</text>
<rect x="30.0" y="220.0" width="100.0" height="36.0" rx="7" fill="#f3f4f6" stroke="#1f2933" stroke-width="1.3"/>
<text x="80.0" y="242.6" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">client 1</text>
<rect x="200.0" y="220.0" width="100.0" height="36.0" rx="7" fill="#f3f4f6" stroke="#1f2933" stroke-width="1.3"/>
<text x="250.0" y="242.6" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">client 2</text>
<line x1="80.0" y1="220.0" x2="80.0" y2="163.0" stroke="#1f2933" stroke-width="1.6" marker-end="url(#a0)"/>
<text x="86.0" y="198.0" font-size="11.5" fill="#1f2933" text-anchor="start" font-weight="normal" font-family="system-ui, sans-serif">write x = 2</text>
<line x1="235.0" y1="220.0" x2="235.0" y2="163.0" stroke="#1f2933" stroke-width="1.6" marker-end="url(#a0)"/>
<text x="230.0" y="198.0" font-size="11.5" fill="#1f2933" text-anchor="end" font-weight="normal" font-family="system-ui, sans-serif">read x</text>
<line x1="265.0" y1="163.0" x2="265.0" y2="220.0" stroke="#dc2626" stroke-width="1.6" marker-end="url(#a2)"/>
<text x="250.0" y="280.0" font-size="12" fill="#dc2626" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">error: can't reach A</text>
<text x="160.0" y="60.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">A and B cannot talk to each other</text>
<text x="480.0" y="24.0" font-size="14" fill="#f59e0b" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">AP: answer, maybe out of date</text>
<rect x="350.0" y="110.0" width="100.0" height="50.0" rx="7" fill="#d1fae5" stroke="#1f2933" stroke-width="1.3"/>
<text x="400.0" y="132.0" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">node A</text>
<text x="400.0" y="148.0" font-size="10.5" fill="#4b5563" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">x = 2 (new)</text>
<rect x="520.0" y="110.0" width="100.0" height="50.0" rx="7" fill="#d1fae5" stroke="#1f2933" stroke-width="1.3"/>
<text x="570.0" y="132.0" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">node B</text>
<text x="570.0" y="148.0" font-size="10.5" fill="#4b5563" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">x = 1</text>
<line x1="450.0" y1="135.0" x2="520.0" y2="135.0" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="5 4"/>
