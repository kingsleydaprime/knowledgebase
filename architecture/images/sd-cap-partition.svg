<text x="485.0" y="112.0" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">partition</text>
<rect x="350.0" y="220.0" width="100.0" height="36.0" rx="7" fill="#f3f4f6" stroke="#1f2933" stroke-width="1.3"/>
<text x="400.0" y="242.6" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">client 1</text>
<rect x="520.0" y="220.0" width="100.0" height="36.0" rx="7" fill="#f3f4f6" stroke="#1f2933" stroke-width="1.3"/>
<text x="570.0" y="242.6" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">client 2</text>
<line x1="400.0" y1="220.0" x2="400.0" y2="163.0" stroke="#1f2933" stroke-width="1.6" marker-end="url(#a0)"/>
<text x="406.0" y="198.0" font-size="11.5" fill="#1f2933" text-anchor="start" font-weight="normal" font-family="system-ui, sans-serif">write x = 2</text>
<line x1="555.0" y1="220.0" x2="555.0" y2="163.0" stroke="#1f2933" stroke-width="1.6" marker-end="url(#a0)"/>
<text x="550.0" y="198.0" font-size="11.5" fill="#1f2933" text-anchor="end" font-weight="normal" font-family="system-ui, sans-serif">read x</text>
<line x1="585.0" y1="163.0" x2="585.0" y2="220.0" stroke="#f59e0b" stroke-width="1.6" marker-end="url(#a3)"/>
<text x="570.0" y="280.0" font-size="12" fill="#f59e0b" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">x = 1 (old value)</text>
<text x="480.0" y="60.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">A and B cannot talk to each other</text>
<line x1="320.0" y1="40.0" x2="320.0" y2="290.0" stroke="#e5e7eb" stroke-width="1.5"/>
</svg>
