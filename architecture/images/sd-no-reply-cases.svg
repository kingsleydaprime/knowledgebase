<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 290" width="660" height="290" role="img">
<title>Four reasons a request gets no reply: the request was lost on the way; the work was done but the reply was lost; the server is still working, just slowly; the server crashed. From the client's side all four look the same: silence until the timeout</title>
<rect width="100%" height="100%" rx="8" fill="#ffffff"/>
<defs><marker id="a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b82f6"/></marker><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="a6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker></defs>
<text x="85.0" y="20.0" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">request lost</text>
<text x="38.0" y="40.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">client</text>
<text x="132.0" y="40.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">server</text>
<line x1="38.0" y1="46.0" x2="38.0" y2="236.0" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="4 4"/>
<line x1="132.0" y1="46.0" x2="132.0" y2="236.0" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="4 4"/>
<line x1="38.0" y1="70.0" x2="90.0" y2="84.0" stroke="#3b82f6" stroke-width="1.6" marker-end="url(#a1)"/>
<text x="98.0" y="92.0" font-size="16" fill="#dc2626" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">✗</text>
<rect x="32.0" y="72.0" width="12.0" height="128.0" fill="#e5e7eb" stroke="none" stroke-width="1" fill-opacity="1"/>
<line x1="26.0" y1="200.0" x2="50.0" y2="200.0" stroke="#dc2626" stroke-width="2"/>
<text x="54.0" y="204.0" font-size="10.5" fill="#dc2626" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">timeout</text>
<text x="248.0" y="20.0" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">reply lost</text>
<text x="201.0" y="40.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">client</text>
<text x="295.0" y="40.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">server</text>
<line x1="201.0" y1="46.0" x2="201.0" y2="236.0" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="4 4"/>
<line x1="295.0" y1="46.0" x2="295.0" y2="236.0" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="4 4"/>
<line x1="201.0" y1="70.0" x2="292.0" y2="96.0" stroke="#3b82f6" stroke-width="1.6" marker-end="url(#a1)"/>
<rect x="290.0" y="100.0" width="10.0" height="30.0" fill="#059669" stroke="none" stroke-width="1" fill-opacity="1"/>
<text x="286.0" y="120.0" font-size="10" fill="#059669" text-anchor="end" font-weight="normal" font-family="system-ui, sans-serif">work done</text>
<line x1="295.0" y1="134.0" x2="243.0" y2="148.0" stroke="#3b82f6" stroke-width="1.6" marker-end="url(#a1)"/>
<text x="235.0" y="158.0" font-size="16" fill="#dc2626" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">✗</text>
<rect x="195.0" y="72.0" width="12.0" height="128.0" fill="#e5e7eb" stroke="none" stroke-width="1" fill-opacity="1"/>
<line x1="189.0" y1="200.0" x2="213.0" y2="200.0" stroke="#dc2626" stroke-width="2"/>
<text x="217.0" y="204.0" font-size="10.5" fill="#dc2626" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">timeout</text>
<text x="411.0" y="20.0" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">slow, still working</text>
<text x="364.0" y="40.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">client</text>
<text x="458.0" y="40.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">server</text>
<line x1="364.0" y1="46.0" x2="364.0" y2="236.0" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="4 4"/>
<line x1="458.0" y1="46.0" x2="458.0" y2="236.0" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="4 4"/>
<line x1="364.0" y1="70.0" x2="455.0" y2="96.0" stroke="#3b82f6" stroke-width="1.6" marker-end="url(#a1)"/>
<rect x="453.0" y="100.0" width="10.0" height="136.0" fill="#f59e0b" stroke="none" stroke-width="1" fill-opacity="0.7"/>
<text x="449.0" y="170.0" font-size="10" fill="#b45309" text-anchor="end" font-weight="normal" font-family="system-ui, sans-serif">still busy</text>
<rect x="358.0" y="72.0" width="12.0" height="128.0" fill="#e5e7eb" stroke="none" stroke-width="1" fill-opacity="1"/>
<line x1="352.0" y1="200.0" x2="376.0" y2="200.0" stroke="#dc2626" stroke-width="2"/>
<text x="380.0" y="204.0" font-size="10.5" fill="#dc2626" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">timeout</text>
<text x="574.0" y="20.0" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">server crashed</text>
<text x="527.0" y="40.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">client</text>
<text x="621.0" y="40.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">server</text>
<line x1="527.0" y1="46.0" x2="527.0" y2="236.0" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="4 4"/>
<line x1="621.0" y1="46.0" x2="621.0" y2="110.0" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="4 4"/>
<line x1="527.0" y1="70.0" x2="618.0" y2="96.0" stroke="#3b82f6" stroke-width="1.6" marker-end="url(#a1)"/>
<text x="621.0" y="128.0" font-size="20" fill="#dc2626" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">✗</text>
<text x="621.0" y="146.0" font-size="10" fill="#dc2626" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">crashed</text>
<rect x="521.0" y="72.0" width="12.0" height="128.0" fill="#e5e7eb" stroke="none" stroke-width="1" fill-opacity="1"/>
<line x1="515.0" y1="200.0" x2="539.0" y2="200.0" stroke="#dc2626" stroke-width="2"/>
<text x="543.0" y="204.0" font-size="10.5" fill="#dc2626" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">timeout</text>
<text x="330.0" y="266.0" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">the client sees the same thing every time: nothing, then its timeout</text>
<text x="330.0" y="284.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">so it cannot know whether the work happened</text>
</svg>
