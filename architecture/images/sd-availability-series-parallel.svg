<text x="714.0" y="200.0" font-size="11.5" fill="#b45309" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">either one is enough: 99.99%</text>
<text x="20.0" y="24.0" font-size="13" fill="#1f2933" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">in a chain, availabilities multiply: 99.9% x 99.9% x 99.9% x 99.9% = 99.6%</text>
<text x="20.0" y="44.0" font-size="13" fill="#b45309" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">a pair fails only if both fail: 1 - 0.01 x 0.01 = 99.99%</text>
<text x="20.0" y="236.0" font-size="13" fill="#3b82f6" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">whole path: 99.60% x 99.99% = 99.59%</text>
