<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 554 250" width="554" height="250" role="img">
<title>Answer sketch: a load balancer at 99.99 percent and an API at 99.9 percent in a chain, then two cache replicas at 95 percent each in parallel; the chain is 99.89 percent, the pair 99.75 percent, the whole path about 99.64 percent</title>
<rect width="100%" height="100%" rx="8" fill="#ffffff"/>
<defs><marker id="a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b82f6"/></marker><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="a6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker></defs>
<rect x="20.0" y="92.0" width="70.0" height="44.0" rx="7" fill="#f3f4f6" stroke="#1f2933" stroke-width="1.3"/>
<text x="55.0" y="118.5" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">user</text>
<line x1="90.0" y1="114.0" x2="116.0" y2="114.0" stroke="#1f2933" stroke-width="1.6" marker-end="url(#a0)"/>
<rect x="118.0" y="92.0" width="104.0" height="44.0" rx="7" fill="#dbeafe" stroke="#1f2933" stroke-width="1.3"/>
<text x="170.0" y="111.0" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">load balancer</text>
<text x="170.0" y="127.0" font-size="10.5" fill="#4b5563" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">99.99%</text>
<line x1="222.0" y1="114.0" x2="248.0" y2="114.0" stroke="#1f2933" stroke-width="1.6" marker-end="url(#a0)"/>
<rect x="250.0" y="92.0" width="104.0" height="44.0" rx="7" fill="#dbeafe" stroke="#1f2933" stroke-width="1.3"/>
<text x="302.0" y="111.0" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">API</text>
<text x="302.0" y="127.0" font-size="10.5" fill="#4b5563" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">99.9%</text>
<line x1="354.0" y1="114.0" x2="388.0" y2="74.0" stroke="#1f2933" stroke-width="1.6" marker-end="url(#a0)"/>
<line x1="354.0" y1="114.0" x2="388.0" y2="154.0" stroke="#1f2933" stroke-width="1.6" marker-end="url(#a0)"/>
<rect x="390.0" y="48.0" width="120.0" height="44.0" rx="7" fill="#d1fae5" stroke="#1f2933" stroke-width="1.3"/>
<text x="450.0" y="67.0" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">replica 1</text>
<text x="450.0" y="83.0" font-size="10.5" fill="#4b5563" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">95% each</text>
<rect x="390.0" y="136.0" width="120.0" height="44.0" rx="7" fill="#d1fae5" stroke="#1f2933" stroke-width="1.3"/>
<text x="450.0" y="155.0" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">replica 2</text>
<text x="450.0" y="171.0" font-size="10.5" fill="#4b5563" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">95% each</text>
<rect x="382.0" y="40.0" width="136.0" height="148.0" fill="none" stroke="#f59e0b" stroke-width="2" fill-opacity="1"/>
<text x="450.0" y="200.0" font-size="11.5" fill="#b45309" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">either one is enough: 99.75%</text>
<text x="20.0" y="24.0" font-size="13" fill="#1f2933" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">in a chain, availabilities multiply: 99.99% x 99.9% = 99.89%</text>
<text x="20.0" y="44.0" font-size="13" fill="#b45309" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">a pair fails only if both fail: 1 - 0.05 x 0.05 = 99.75%</text>
<text x="20.0" y="236.0" font-size="13" fill="#3b82f6" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">whole path: 99.89% x 99.75% = 99.64%</text>
</svg>
