<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 304" width="600" height="304" role="img">
<title>A replicated state machine: the log is set balance = 100, add 50 to balance, take 30 from balance; replicas 1 and 2 apply all three and both reach balance 120; replica 3 has applied two so far and shows 150, and will reach 120 when it applies the third</title>
<rect width="100%" height="100%" rx="8" fill="#ffffff"/>
<defs><marker id="a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b82f6"/></marker><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="a6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker></defs>
<text x="118.0" y="46.0" font-size="13" fill="#1f2933" text-anchor="end" font-weight="bold" font-family="system-ui, sans-serif">the log</text>
<rect x="130.0" y="26.0" width="140.0" height="34.0" rx="7" fill="#fde68a" stroke="#1f2933" stroke-width="1.3"/>
<text x="200.0" y="47.0" font-size="11.5" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">1. set balance = 100</text>
<rect x="280.0" y="26.0" width="140.0" height="34.0" rx="7" fill="#fde68a" stroke="#1f2933" stroke-width="1.3"/>
<text x="350.0" y="47.0" font-size="11.5" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">2. add 50 to balance</text>
<rect x="430.0" y="26.0" width="140.0" height="34.0" rx="7" fill="#fde68a" stroke="#1f2933" stroke-width="1.3"/>
<text x="500.0" y="47.0" font-size="11.5" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">3. take 30 from balance</text>
<text x="118.0" y="118.0" font-size="13" fill="#1f2933" text-anchor="end" font-weight="bold" font-family="system-ui, sans-serif">replica 1</text>
<rect x="130.0" y="96.0" width="140.0" height="34.0" fill="#d1fae5" stroke="#1f2933" stroke-width="1" fill-opacity="1"/>
<text x="200.0" y="118.0" font-size="11.5" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">balance = 100</text>
<rect x="280.0" y="96.0" width="140.0" height="34.0" fill="#d1fae5" stroke="#1f2933" stroke-width="1" fill-opacity="1"/>
<text x="350.0" y="118.0" font-size="11.5" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">balance = 150</text>
<rect x="430.0" y="96.0" width="140.0" height="34.0" fill="#d1fae5" stroke="#1f2933" stroke-width="1" fill-opacity="1"/>
<text x="500.0" y="118.0" font-size="11.5" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">balance = 120</text>
<text x="118.0" y="174.0" font-size="13" fill="#1f2933" text-anchor="end" font-weight="bold" font-family="system-ui, sans-serif">replica 2</text>
<rect x="130.0" y="152.0" width="140.0" height="34.0" fill="#d1fae5" stroke="#1f2933" stroke-width="1" fill-opacity="1"/>
