<rect x="430.0" y="152.0" width="140.0" height="34.0" fill="#d1fae5" stroke="#1f2933" stroke-width="1" fill-opacity="1"/>
<text x="500.0" y="174.0" font-size="11.5" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">balance = 120</text>
<text x="118.0" y="230.0" font-size="13" fill="#1f2933" text-anchor="end" font-weight="bold" font-family="system-ui, sans-serif">replica 3</text>
<rect x="130.0" y="208.0" width="140.0" height="34.0" fill="#d1fae5" stroke="#1f2933" stroke-width="1" fill-opacity="1"/>
<text x="200.0" y="230.0" font-size="11.5" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">balance = 100</text>
<rect x="280.0" y="208.0" width="140.0" height="34.0" fill="#d1fae5" stroke="#1f2933" stroke-width="1" fill-opacity="1"/>
<text x="350.0" y="230.0" font-size="11.5" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">balance = 150</text>
<rect x="430.0" y="208.0" width="140.0" height="34.0" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1" fill-opacity="1"/>
<text x="500.0" y="230.0" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">not yet</text>
<text x="500.0" y="258.0" font-size="10.5" fill="#b45309" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">behind, catching up</text>
<text x="130.0" y="290.0" font-size="12" fill="#059669" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">same start + same commands in the same order = same state on every replica</text>
