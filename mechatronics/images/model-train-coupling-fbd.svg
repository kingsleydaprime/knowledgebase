<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 270" width="640" height="270" role="img">
<title>Free-body diagrams of the two train cars. The coupler (spring K1 and damper f1) pulls car M1 back with the force K1(y1 - y2) + f1(v1 - v2) and pulls car M2 forward with exactly the same force, shown in orange on both: equal and opposite. M1 is also pulled forward by F; M2 is also held back by the wall spring and damper, K2 y2 + f2 v2</title>
<rect width="100%" height="100%" rx="8" fill="#ffffff"/>
<rect x="140.0" y="80.0" width="120.0" height="90.0" rx="3" fill="#dbeafe" stroke="#1f2933" stroke-width="1.6"/>
<text x="200.0" y="130.0" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">M₂</text>
<rect x="420.0" y="80.0" width="120.0" height="90.0" rx="3" fill="#dbeafe" stroke="#1f2933" stroke-width="1.6"/>
<text x="480.0" y="130.0" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">M₁</text>
<line x1="540.0" y1="125.0" x2="620.0" y2="125.0" stroke="#2563eb" stroke-width="2.0"/>
<polygon points="620.0,125.0 611.0,129.5 611.0,120.5" fill="#2563eb"/>
<text x="620.0" y="115.0" font-size="13" fill="#2563eb" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">F</text>
<line x1="420.0" y1="110.0" x2="330.0" y2="110.0" stroke="#f59e0b" stroke-width="2.6"/>
<polygon points="330.0,110.0 339.0,105.5 339.0,114.5" fill="#f59e0b"/>
<text x="375.0" y="66.0" font-size="12" fill="#f59e0b" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">on M₁: K₁(y₁ − y₂) + f₁(v₁ − v₂), backward</text>
<line x1="260.0" y1="140.0" x2="350.0" y2="140.0" stroke="#f59e0b" stroke-width="2.6"/>
<polygon points="350.0,140.0 341.0,144.5 341.0,135.5" fill="#f59e0b"/>
<text x="305.0" y="192.0" font-size="12" fill="#f59e0b" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">on M₂: the same force, forward</text>
<line x1="140.0" y1="125.0" x2="50.0" y2="125.0" stroke="#6b7280" stroke-width="2.2"/>
<polygon points="50.0,125.0 59.0,120.5 59.0,129.5" fill="#6b7280"/>
<text x="95.0" y="112.0" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">K₂y₂ + f₂v₂</text>
<text x="320.0" y="228.0" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">the coupler force acts on both cars, equal and opposite (Newton's third law),</text>
<text x="320.0" y="245.0" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">and is zero when the cars move together (y₁ = y₂, v₁ = v₂)</text>
</svg>
