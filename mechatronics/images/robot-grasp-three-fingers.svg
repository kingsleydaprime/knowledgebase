<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 380" width="460" height="380" role="img">
<title>Three fingers acting on an object around the hand centre O: contact points at 30, 120 and 240 degrees and 5, 6 and 4 centimetres from O, each finger pushing at right angles to its radius with 10, 12 and 8 newtons, so each turns the object the same way about O</title>
<rect width="100%" height="100%" rx="8" fill="#ffffff"/>
<circle cx="230" cy="195" r="123.5" fill="#dbeafe" fill-opacity="0.45" stroke="#6b7280" stroke-width="1" stroke-dasharray="4 4"/>
<circle cx="230.0" cy="195.0" r="4" fill="#1f2933" stroke="none"/>
<text x="220.0" y="213.0" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">O</text>
<line x1="230.0" y1="195.0" x2="312.3" y2="147.5" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="3 3"/>
<line x1="328.3" y1="175.2" x2="312.3" y2="147.5" stroke="#2563eb" stroke-width="2.8"/>
<polygon points="312.3,147.5 312.9,158.7 321.6,153.7" fill="#2563eb"/>
<circle cx="312.3" cy="147.5" r="4.5" fill="#2563eb" stroke="none"/>
<text x="366.0" y="116.5" font-size="12.5" fill="#2563eb" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">10 N</text>
<text x="366.0" y="131.5" font-size="11" fill="#2563eb" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">r = 5 cm, 30°</text>
<line x1="230.0" y1="195.0" x2="173.0" y2="96.3" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="3 3"/>
<line x1="206.3" y1="77.1" x2="173.0" y2="96.3" stroke="#059669" stroke-width="2.8"/>
<polygon points="173.0,96.3 184.2,95.6 179.2,86.9" fill="#059669"/>
<circle cx="173.0" cy="96.3" r="4.5" fill="#059669" stroke="none"/>
<text x="142.0" y="42.6" font-size="12.5" fill="#059669" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">12 N</text>
<text x="142.0" y="57.6" font-size="11" fill="#059669" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">r = 6 cm, 120°</text>
<line x1="230.0" y1="195.0" x2="192.0" y2="260.8" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="3 3"/>
<line x1="169.8" y1="248.0" x2="192.0" y2="260.8" stroke="#7c3aed" stroke-width="2.8"/>
<polygon points="192.0,260.8 185.8,251.5 180.8,260.1" fill="#7c3aed"/>
<circle cx="192.0" cy="260.8" r="4.5" fill="#7c3aed" stroke="none"/>
<text x="161.0" y="314.5" font-size="12.5" fill="#7c3aed" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">8 N</text>
<text x="161.0" y="329.5" font-size="11" fill="#7c3aed" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">r = 4 cm, 240°</text>
<text x="230.0" y="368.0" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">each force at right angles to its radius: τ = r × F</text>
</svg>
