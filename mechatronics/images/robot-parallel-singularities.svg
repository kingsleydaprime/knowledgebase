<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 330" width="620" height="330" role="img">
<title>The two singularity types of a parallel manipulator. Left, type 1: all three legs are parallel, so every leg can only push its tip in the same direction and the platform cannot be moved along the legs; the joint speeds needed go to infinity. Right, type 2: the three legs' lines of action all pass through one point, so even with every actuator locked the platform can turn about that point</title>
