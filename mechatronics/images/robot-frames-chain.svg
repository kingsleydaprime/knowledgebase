<text x="253.2" y="232.0" font-size="11.5" fill="#1f2933" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">frame 1</text>
<line x1="284.6" y1="55.5" x2="293.4" y2="22.6" stroke="#dc2626" stroke-width="2"/>
<polygon points="293.4,22.6 294.4,29.5 289.1,28.1" fill="#dc2626"/>
<line x1="284.6" y1="55.5" x2="251.8" y2="46.7" stroke="#059669" stroke-width="2"/>
<polygon points="251.8,46.7 258.7,45.7 257.3,51.0" fill="#059669"/>
<text x="294.6" y="77.5" font-size="11.5" fill="#1f2933" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">frame 2 (hand)</text>
<path d="M 64.0 296.0 Q 116.6 230.0 231.2 204.0" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5 3"/>
