<line x1="270.0" y1="310.0" x2="270.0" y2="30.0" stroke="#e5e7eb" stroke-width="1"/>
<line x1="370.0" y1="310.0" x2="370.0" y2="30.0" stroke="#e5e7eb" stroke-width="1"/>
<line x1="70.0" y1="310.0" x2="420.0" y2="310.0" stroke="#e5e7eb" stroke-width="1"/>
<line x1="70.0" y1="210.0" x2="420.0" y2="210.0" stroke="#e5e7eb" stroke-width="1"/>
<line x1="70.0" y1="110.0" x2="420.0" y2="110.0" stroke="#e5e7eb" stroke-width="1"/>
<polygon points="59.0,322.0 81.0,322.0 70.0,310.0" fill="#e5e7eb" stroke="#1f2933" stroke-width="1.3"/>
<polyline points="70.0,310.0 243.2,210.0 284.6,55.5" fill="none" stroke="#dbeafe" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="1.0"/>
<circle cx="70.0" cy="310.0" r="4.5" fill="white" stroke="#1f2933" stroke-width="1.5" stroke-opacity="1.0"/>
<circle cx="243.2" cy="210.0" r="4.5" fill="white" stroke="#1f2933" stroke-width="1.5" stroke-opacity="1.0"/>
<circle cx="284.6" cy="55.5" r="3.5" fill="#1f2933" fill-opacity="1.0"/>
<polyline points="70.0,310.0 243.2,210.0 284.6,55.5" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="1.0"/>
<circle cx="70.0" cy="310.0" r="4.5" fill="white" stroke="#1f2933" stroke-width="1.5" stroke-opacity="1.0"/>
<circle cx="243.2" cy="210.0" r="4.5" fill="white" stroke="#1f2933" stroke-width="1.5" stroke-opacity="1.0"/>
<circle cx="284.6" cy="55.5" r="3.5" fill="#1f2933" fill-opacity="1.0"/>
<line x1="70.0" y1="310.0" x2="104.0" y2="310.0" stroke="#dc2626" stroke-width="2"/>
<polygon points="104.0,310.0 97.6,312.7 97.6,307.3" fill="#dc2626"/>
<line x1="70.0" y1="310.0" x2="70.0" y2="276.0" stroke="#059669" stroke-width="2"/>
<polygon points="70.0,276.0 72.7,282.4 67.3,282.4" fill="#059669"/>
<text x="80.0" y="332.0" font-size="11.5" fill="#1f2933" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">frame 0 (base)</text>
<line x1="243.2" y1="210.0" x2="272.6" y2="193.0" stroke="#dc2626" stroke-width="2"/>
<polygon points="272.6,193.0 268.4,198.6 265.7,193.9" fill="#dc2626"/>
<line x1="243.2" y1="210.0" x2="226.2" y2="180.6" stroke="#059669" stroke-width="2"/>
