<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" role="img">
<title>Forward kinematics as a chain of transforms: a small coordinate frame sits at the base, at the elbow and at the hand; A1 carries the base frame to the elbow frame, A2 carries the elbow frame to the hand frame, and multiplying them, T = A1 A2, carries the base frame straight to the hand</title>
<rect width="100%" height="100%" rx="8" fill="#ffffff"/>
<line x1="70.0" y1="310.0" x2="70.0" y2="30.0" stroke="#e5e7eb" stroke-width="1"/>
