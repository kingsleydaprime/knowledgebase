<path d="M 237.2 196.0 Q 223.9 102.7 272.6 49.5" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5 3"/>
<text x="219.9" y="106.7" font-size="14" fill="#f59e0b" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">A₂</text>
<text x="240.0" y="350.0" font-size="12.5" fill="#f59e0b" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">T = A₁A₂: base frame to hand frame in one step</text>
</svg>
