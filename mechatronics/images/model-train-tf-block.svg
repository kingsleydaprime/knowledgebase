<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" width="640" height="220" role="img">
<title>The two-car system as transfer functions: the one input F(s) feeds two boxes; one gives Y1(s) through A2/(A1 A2 - B squared), the other gives Y2(s) through B/(A1 A2 - B squared); B, the coupler, is the only way force reaches the second car</title>
<rect width="100%" height="100%" rx="8" fill="#ffffff"/>
<text x="60.0" y="115.0" font-size="15" fill="#1f2933" text-anchor="end" font-weight="bold" font-family="system-ui, sans-serif">F(s)</text>
<line x1="70.0" y1="110.0" x2="140.0" y2="110.0" stroke="#1f2933" stroke-width="1.8"/>
<circle cx="140.0" cy="110.0" r="4" fill="#1f2933" stroke="none"/>
<line x1="140.0" y1="110.0" x2="140.0" y2="55.0" stroke="#1f2933" stroke-width="1.8"/>
<line x1="140.0" y1="110.0" x2="140.0" y2="165.0" stroke="#1f2933" stroke-width="1.8"/>
<line x1="140.0" y1="55.0" x2="220.0" y2="55.0" stroke="#1f2933" stroke-width="2.0"/>
<polygon points="220.0,55.0 211.0,59.5 211.0,50.5" fill="#1f2933"/>
<line x1="140.0" y1="165.0" x2="220.0" y2="165.0" stroke="#1f2933" stroke-width="2.0"/>
<polygon points="220.0,165.0 211.0,169.5 211.0,160.5" fill="#1f2933"/>
<rect x="220" y="30" width="230" height="50" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="335.0" y="60.0" font-size="14" fill="#2563eb" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">A₂ / (A₁A₂ − B²)</text>
<rect x="220" y="140" width="230" height="50" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
<text x="335.0" y="170.0" font-size="14" fill="#f59e0b" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">B / (A₁A₂ − B²)</text>
<line x1="450.0" y1="55.0" x2="540.0" y2="55.0" stroke="#1f2933" stroke-width="2.0"/>
<polygon points="540.0,55.0 531.0,59.5 531.0,50.5" fill="#1f2933"/>
<text x="550.0" y="60.0" font-size="13" fill="#1f2933" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">Y₁(s)</text>
<line x1="450.0" y1="165.0" x2="540.0" y2="165.0" stroke="#1f2933" stroke-width="2.0"/>
<polygon points="540.0,165.0 531.0,169.5 531.0,160.5" fill="#1f2933"/>
<text x="550.0" y="170.0" font-size="13" fill="#1f2933" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">Y₂(s)</text>
<text x="335.0" y="210.0" font-size="12" fill="#f59e0b" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">set the coupler B to zero and Y₂ gets nothing</text>
</svg>
