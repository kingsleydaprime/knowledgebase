<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 600" width="700" height="600" role="img">
<title>Converting the mass-spring-damper in four stages, with each element in its own colour. Top left, the system: mass M hanging from spring K and damper f, pulled by F. Top right, its mechanical network: one node x with F, M, f and K in parallel to the reference. Bottom left, the force-current circuit has the same shape: current source F with C = M, R = 1/f and L = 1/K in parallel. Bottom right, the force-voltage circuit is its dual: voltage source F with L = M, R = f and C = 1/K in series around one loop</title>
