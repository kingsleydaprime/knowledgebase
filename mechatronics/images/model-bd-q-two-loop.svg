<polyline points="337.0,50.0 380.0,50.0" fill="none" stroke="#1f2933" stroke-width="1.8" stroke-linejoin="round"/>
<circle cx="380.0" cy="50.0" r="3.2" fill="#1f2933" stroke="none"/>
