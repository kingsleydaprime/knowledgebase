<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 380" width="480" height="380" role="img">
<title>Holding a 1 kg load with a two-link arm at q = (0, 90 degrees): the upper arm lies along the x-axis to the elbow at (1, 0), and the forearm points straight up to the hand at (1, 1), which pushes up with F = 9.81 N. The shoulder is 1 m sideways from the line of the force, so it needs 9.81 N m; the elbow is directly under the hand, with no sideways distance, so it needs no torque</title>
<rect width="100%" height="100%" rx="8" fill="#ffffff"/>
<line x1="45.0" y1="300.0" x2="45.0" y2="30.0" stroke="#e5e7eb" stroke-width="1"/>
<line x1="135.0" y1="300.0" x2="135.0" y2="30.0" stroke="#e5e7eb" stroke-width="1"/>
<line x1="225.0" y1="300.0" x2="225.0" y2="30.0" stroke="#e5e7eb" stroke-width="1"/>
<line x1="315.0" y1="300.0" x2="315.0" y2="30.0" stroke="#e5e7eb" stroke-width="1"/>
<line x1="405.0" y1="300.0" x2="405.0" y2="30.0" stroke="#e5e7eb" stroke-width="1"/>
<line x1="45.0" y1="300.0" x2="405.0" y2="300.0" stroke="#e5e7eb" stroke-width="1"/>
<line x1="45.0" y1="210.0" x2="405.0" y2="210.0" stroke="#e5e7eb" stroke-width="1"/>
<line x1="45.0" y1="120.0" x2="405.0" y2="120.0" stroke="#e5e7eb" stroke-width="1"/>
<line x1="45.0" y1="30.0" x2="405.0" y2="30.0" stroke="#e5e7eb" stroke-width="1"/>
<polygon points="79.0,312.0 101.0,312.0 90.0,300.0" fill="#e5e7eb" stroke="#1f2933" stroke-width="1.3"/>
<polyline points="90.0,300.0 270.0,300.0 270.0,120.0" fill="none" stroke="#2563eb" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="1.0"/>
<circle cx="90.0" cy="300.0" r="4.5" fill="white" stroke="#1f2933" stroke-width="1.5" stroke-opacity="1.0"/>
<circle cx="270.0" cy="300.0" r="4.5" fill="white" stroke="#1f2933" stroke-width="1.5" stroke-opacity="1.0"/>
<circle cx="270.0" cy="120.0" r="3.5" fill="#1f2933" fill-opacity="1.0"/>
<line x1="270.0" y1="120.0" x2="270.0" y2="50.0" stroke="#dc2626" stroke-width="3"/>
<polygon points="270.0,50.0 273.5,58.3 266.5,58.3" fill="#dc2626"/>
<text x="278.0" y="60.0" font-size="12.5" fill="#dc2626" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">F = 9.81 N up</text>
<rect x="256.0" y="116.0" width="28.0" height="22.0" fill="#f59e0b" stroke="none" stroke-width="1" fill-opacity="1"/>
<text x="292.0" y="134.0" font-size="11.5" fill="#1f2933" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">1 kg</text>
<line x1="90.0" y1="330.0" x2="270.0" y2="330.0" stroke="#059669" stroke-width="2"/>
<text x="180.0" y="348.0" font-size="12" fill="#059669" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">lever arm 1 m → τ₁ = 9.81 N·m</text>
<line x1="270.0" y1="300.0" x2="270.0" y2="45.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="280.0" y="290.0" font-size="12" fill="#7c3aed" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">elbow: lever arm 0 → τ₂ = 0</text>
</svg>
