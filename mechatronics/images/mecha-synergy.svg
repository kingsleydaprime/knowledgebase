<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" width="560" height="380" role="img">
<title>Three overlapping circles for Electronics, Mechanics and Information technology, overlapping in the middle as Mechatronics</title>
<rect width="100%" height="100%" rx="8" fill="#ffffff"/>
<circle cx="200" cy="165" r="120" fill="#2563eb" fill-opacity="0.18" stroke="#2563eb" stroke-width="1.5"/>
<circle cx="360" cy="165" r="120" fill="#10b981" fill-opacity="0.18" stroke="#10b981" stroke-width="1.5"/>
<circle cx="280" cy="265" r="120" fill="#f59e0b" fill-opacity="0.18" stroke="#f59e0b" stroke-width="1.5"/>
<text x="150.0" y="120.0" font-size="14" fill="#2563eb" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">Electronics</text>
<text x="410.0" y="120.0" font-size="14" fill="#10b981" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">Mechanics</text>
<text x="280.0" y="330.0" font-size="14" fill="#f59e0b" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">Information</text>
<text x="280.0" y="346.0" font-size="14" fill="#f59e0b" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">technology</text>
<text x="280.0" y="205.0" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">Mechatronics</text>
</svg>
