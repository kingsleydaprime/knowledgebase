<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" width="520" height="380" role="img">
<title>Cumulative angles in a three-link arm: each joint angle q is measured from the link before, so each link's direction from the x-axis is the sum of all the joint angles up to it: phi1 = q1 = 30 degrees, phi2 = q1 + q2 = 60 degrees, phi3 = q1 + q2 + q3 = 40 degrees, shown as arcs from a dashed horizontal line at each joint</title>
<rect width="100%" height="100%" rx="8" fill="#ffffff"/>
<line x1="60.0" y1="330.0" x2="60.0" y2="45.0" stroke="#e5e7eb" stroke-width="1"/>
<line x1="155.0" y1="330.0" x2="155.0" y2="45.0" stroke="#e5e7eb" stroke-width="1"/>
<line x1="250.0" y1="330.0" x2="250.0" y2="45.0" stroke="#e5e7eb" stroke-width="1"/>
<line x1="345.0" y1="330.0" x2="345.0" y2="45.0" stroke="#e5e7eb" stroke-width="1"/>
<line x1="440.0" y1="330.0" x2="440.0" y2="45.0" stroke="#e5e7eb" stroke-width="1"/>
<line x1="60.0" y1="330.0" x2="487.5" y2="330.0" stroke="#e5e7eb" stroke-width="1"/>
<line x1="60.0" y1="235.0" x2="487.5" y2="235.0" stroke="#e5e7eb" stroke-width="1"/>
<line x1="60.0" y1="140.0" x2="487.5" y2="140.0" stroke="#e5e7eb" stroke-width="1"/>
<line x1="60.0" y1="45.0" x2="487.5" y2="45.0" stroke="#e5e7eb" stroke-width="1"/>
<polygon points="49.0,342.0 71.0,342.0 60.0,330.0" fill="#e5e7eb" stroke="#1f2933" stroke-width="1.3"/>
<polyline points="60.0,330.0 224.5,235.0 300.5,103.4 387.9,30.1" fill="none" stroke="#2563eb" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="1.0"/>
<circle cx="60.0" cy="330.0" r="4.5" fill="white" stroke="#1f2933" stroke-width="1.5" stroke-opacity="1.0"/>
<circle cx="224.5" cy="235.0" r="4.5" fill="white" stroke="#1f2933" stroke-width="1.5" stroke-opacity="1.0"/>
<circle cx="300.5" cy="103.4" r="4.5" fill="white" stroke="#1f2933" stroke-width="1.5" stroke-opacity="1.0"/>
<circle cx="387.9" cy="30.1" r="3.5" fill="#1f2933" fill-opacity="1.0"/>
<line x1="60.0" y1="330.0" x2="130.0" y2="330.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4 3"/>
<path d="M 94.0 330.0 A 34 34 0 0 0 89.4 313.0" fill="none" stroke="#2563eb" stroke-width="1.8"/>
<text x="108.3" y="321.1" font-size="12" fill="#2563eb" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif"></text>
<text x="104.0" y="348.0" font-size="12" fill="#2563eb" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">φ₁ = q₁ = 30°</text>
<line x1="224.5" y1="235.0" x2="294.5" y2="235.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4 3"/>
<path d="M 258.5 235.0 A 34 34 0 0 0 241.5 205.6" fill="none" stroke="#7c3aed" stroke-width="1.8"/>
<text x="267.8" y="214.0" font-size="12" fill="#7c3aed" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif"></text>
<text x="268.5" y="253.0" font-size="12" fill="#7c3aed" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">φ₂ = q₁ + q₂ = 60°</text>
<line x1="300.5" y1="103.4" x2="370.5" y2="103.4" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4 3"/>
<path d="M 334.5 103.4 A 34 34 0 0 0 326.6 81.5" fill="none" stroke="#059669" stroke-width="1.8"/>
<text x="347.5" y="90.3" font-size="12" fill="#059669" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif"></text>
<text x="344.5" y="121.4" font-size="12" fill="#059669" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">φ₃ = q₁ + q₂ + q₃ = 40°</text>
</svg>
