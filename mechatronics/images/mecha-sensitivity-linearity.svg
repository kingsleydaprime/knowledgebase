<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 300" width="440" height="300" role="img">
<title>A graph of sensor output against input: a straight ideal line whose slope is the sensitivity, and a curved real response whose gap from the line is the non-linearity</title>
<rect width="100%" height="100%" rx="8" fill="#ffffff"/>
<line x1="60.0" y1="250.0" x2="400.0" y2="250.0" stroke="#1f2933" stroke-width="1.5"/>
<line x1="60.0" y1="250.0" x2="60.0" y2="40.0" stroke="#1f2933" stroke-width="1.5"/>
<text x="230.0" y="285.0" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">Input (measured quantity)</text>
<text x="18" y="145.0" font-size="12" fill="#1f2933" transform="rotate(-90 18 145.0)" text-anchor="middle">Output signal</text>
<line x1="60.0" y1="250.0" x2="400.0" y2="69.4" stroke="#2563eb" stroke-width="2.2"/>
<text x="390.0" y="61.4" font-size="11" fill="#2563eb" text-anchor="end" font-weight="normal" font-family="system-ui, sans-serif">ideal (slope = sensitivity)</text>
<polyline points="60.0,250.0 68.5,243.5 77.0,237.0 85.5,230.6 94.0,224.2 102.5,217.8 111.0,211.5 119.5,205.2 128.0,199.1 136.5,193.0 145.0,187.0 153.5,181.2 162.0,175.4 170.5,169.8 179.0,164.3 187.5,159.0 196.0,153.8 204.5,148.7 213.0,143.8 221.5,139.1 230.0,134.5 238.5,130.1 247.0,125.8 255.5,121.7 264.0,117.7 272.5,113.8 281.0,110.2 289.5,106.6 298.0,103.2 306.5,99.9 315.0,96.7 323.5,93.7 332.0,90.7 340.5,87.8 349.0,85.0 357.5,82.3 366.0,79.7 374.5,77.1 383.0,74.5 391.5,71.9 400.0,69.4" fill="none" stroke="#f59e0b" stroke-width="2.2"/>
<text x="230.0" y="103.0" font-size="11" fill="#f59e0b" text-anchor="start" font-weight="normal" font-family="system-ui, sans-serif">real response</text>
<text x="270.8" y="170.2" font-size="10.5" fill="#9ca3af" text-anchor="start" font-weight="normal" font-family="system-ui, sans-serif">(gap between them = non-linearity)</text>
</svg>
