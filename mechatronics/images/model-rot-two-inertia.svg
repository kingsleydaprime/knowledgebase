<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220" width="480" height="220" role="img">
<title>Two inertias on one shaft, with no walls and no dampers: a torque T(t) turns inertia J1 through angle theta1, and a flexible shaft of stiffness K joins it to a second inertia J2, which turns through theta2</title>
<rect width="100%" height="100%" rx="8" fill="#ffffff"/>
<line x1="40.0" y1="100.0" x2="110.0" y2="100.0" stroke="#1f2933" stroke-width="3"/>
<path d="M 54 104 A 16 22 0 0 1 86 104" stroke="#2563eb" stroke-width="2" fill="none"/>
<polygon points="86,110 81,100 91,101" fill="#2563eb"/>
<text x="70.0" y="74.0" font-size="13" fill="#2563eb" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">T(t)</text>
<rect x="110" y="50" width="24" height="100" rx="3" fill="#dbeafe" stroke="#1f2933" stroke-width="1.6"/>
<text x="122.0" y="172.0" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">J₁</text>
<text x="122.0" y="192.0" font-size="12.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">θ₁</text>
<line x1="134.0" y1="100.0" x2="160.0" y2="100.0" stroke="#1f2933" stroke-width="3"/>
<polyline points="160.0,100.0 195.2,100.0 204.2,109.0 213.1,91.0 222.1,109.0 231.0,91.0 240.0,109.0 249.0,91.0 257.9,109.0 266.9,91.0 275.8,109.0 284.8,100.0 320.0,100.0" fill="none" stroke="#1f2933" stroke-width="1.8" stroke-linejoin="round"/>
<text x="240.0" y="82.0" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">K (shaft)</text>
<rect x="320" y="50" width="24" height="100" rx="3" fill="#dbeafe" stroke="#1f2933" stroke-width="1.6"/>
<text x="332.0" y="172.0" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">J₂</text>
<text x="332.0" y="192.0" font-size="12.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">θ₂</text>
<text x="240.0" y="205.0" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">nothing holds either disc to the ground</text>
</svg>
