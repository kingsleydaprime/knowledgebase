<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" width="640" height="250" role="img">
<title>The three translational elements: a mass M with force F and displacement x, a spring K between ends x1 and x2, and a damper f between ends with velocities v1 and v2, each with its force equation underneath</title>
<rect width="100%" height="100%" rx="8" fill="#ffffff"/>
<rect x="50.0" y="60.0" width="110.0" height="70.0" rx="3" fill="#dbeafe" stroke="#1f2933" stroke-width="1.6"/>
<text x="105.0" y="100.0" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">M</text>
<line x1="160.0" y1="95.0" x2="205.0" y2="95.0" stroke="#2563eb" stroke-width="2.0"/>
<polygon points="205.0,95.0 196.0,99.5 196.0,90.5" fill="#2563eb"/>
<text x="205.0" y="87.0" font-size="13" fill="#2563eb" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">F</text>
<line x1="70.0" y1="45.0" x2="130.0" y2="45.0" stroke="#6b7280" stroke-width="2.0"/>
<polygon points="130.0,45.0 121.0,49.5 121.0,40.5" fill="#6b7280"/>
<text x="140.0" y="50.0" font-size="13" fill="#6b7280" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">x</text>
<text x="105.0" y="185.0" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">F = M dv/dt = M d²x/dt²</text>
<text x="105.0" y="208.0" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">stores kinetic energy</text>
<circle cx="260.0" cy="95.0" r="3.2" fill="#1f2933" stroke="none"/>
<circle cx="380.0" cy="95.0" r="3.2" fill="#1f2933" stroke="none"/>
<polyline points="260.0,95.0 286.4,95.0 293.1,102.0 299.8,88.0 306.6,102.0 313.3,88.0 320.0,102.0 326.7,88.0 333.4,102.0 340.2,88.0 346.9,102.0 353.6,95.0 380.0,95.0" fill="none" stroke="#1f2933" stroke-width="1.8" stroke-linejoin="round"/>
<text x="320.0" y="79.0" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">K</text>
<text x="260.0" y="125.0" font-size="12.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">x₁</text>
<text x="380.0" y="125.0" font-size="12.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">x₂</text>
<text x="320.0" y="185.0" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">F = K(x₁ − x₂)</text>
<text x="320.0" y="208.0" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">stores potential energy</text>
<circle cx="470.0" cy="95.0" r="3.2" fill="#1f2933" stroke="none"/>
<circle cx="590.0" cy="95.0" r="3.2" fill="#1f2933" stroke="none"/>
<polyline points="470.0,95.0 508.4,95.0" fill="none" stroke="#1f2933" stroke-width="1.8" stroke-linejoin="round"/>
<polyline points="551.6,86.0 508.4,86.0 508.4,104.0 551.6,104.0" fill="none" stroke="#1f2933" stroke-width="1.8" stroke-linejoin="round"/>
<polyline points="532.4,89.0 532.4,101.0" fill="none" stroke="#1f2933" stroke-width="2.4" stroke-linejoin="round"/>
<polyline points="532.4,95.0 590.0,95.0" fill="none" stroke="#1f2933" stroke-width="1.8" stroke-linejoin="round"/>
<text x="530.0" y="77.0" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">f</text>
<text x="470.0" y="125.0" font-size="12.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">v₁</text>
<text x="590.0" y="125.0" font-size="12.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">v₂</text>
<text x="530.0" y="185.0" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">F = f(v₁ − v₂)</text>
<text x="530.0" y="208.0" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">dissipates energy</text>
</svg>
