<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 400" width="480" height="400" role="img">
<title>The elbow angle from the law of cosines: the base, the elbow and the target (0.6, 1.2) form a triangle with sides l1 = 1.0, l2 = 0.8 and d, where d squared = x squared + y squared = 1.8. The elbow angle theta2 is the turn from the line of link 1 to link 2; the law of cosines gives cos theta2 = (1.8 - 1 - 0.64)/1.6 = 0.1, so theta2 = 84.3 degrees</title>
