<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img">
<title>What the Jacobian of the exam arm means at its start pose, all three links (1.8, 1.3 and 1.0 m) straight along the x-axis: turning joint 1 at 1 rad/s moves the hand straight up at 4.1 m/s (its distance from joint 1), joint 2 at 2.3 m/s and joint 3 at 1.0 m/s. Every column points straight up, so the hand cannot move along the x-axis at all: the top row of J is all zeros</title>
<rect width="100%" height="100%" rx="8" fill="#ffffff"/>
<line x1="60.0" y1="250.0" x2="60.0" y2="190.0" stroke="#e5e7eb" stroke-width="1"/>
<line x1="120.0" y1="250.0" x2="120.0" y2="190.0" stroke="#e5e7eb" stroke-width="1"/>
<line x1="180.0" y1="250.0" x2="180.0" y2="190.0" stroke="#e5e7eb" stroke-width="1"/>
<line x1="240.0" y1="250.0" x2="240.0" y2="190.0" stroke="#e5e7eb" stroke-width="1"/>
<line x1="300.0" y1="250.0" x2="300.0" y2="190.0" stroke="#e5e7eb" stroke-width="1"/>
<line x1="360.0" y1="250.0" x2="360.0" y2="190.0" stroke="#e5e7eb" stroke-width="1"/>
<line x1="420.0" y1="250.0" x2="420.0" y2="190.0" stroke="#e5e7eb" stroke-width="1"/>
<line x1="480.0" y1="250.0" x2="480.0" y2="190.0" stroke="#e5e7eb" stroke-width="1"/>
<line x1="540.0" y1="250.0" x2="540.0" y2="190.0" stroke="#e5e7eb" stroke-width="1"/>
<line x1="600.0" y1="250.0" x2="600.0" y2="190.0" stroke="#e5e7eb" stroke-width="1"/>
<line x1="60.0" y1="250.0" x2="600.0" y2="250.0" stroke="#e5e7eb" stroke-width="1"/>
<line x1="60.0" y1="190.0" x2="600.0" y2="190.0" stroke="#e5e7eb" stroke-width="1"/>
<polygon points="49.0,262.0 71.0,262.0 60.0,250.0" fill="#e5e7eb" stroke="#1f2933" stroke-width="1.3"/>
<polyline points="60.0,250.0 276.0,250.0 432.0,250.0 552.0,250.0" fill="none" stroke="#2563eb" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="1.0"/>
<circle cx="60.0" cy="250.0" r="4.5" fill="white" stroke="#1f2933" stroke-width="1.5" stroke-opacity="1.0"/>
<circle cx="276.0" cy="250.0" r="4.5" fill="white" stroke="#1f2933" stroke-width="1.5" stroke-opacity="1.0"/>
<circle cx="432.0" cy="250.0" r="4.5" fill="white" stroke="#1f2933" stroke-width="1.5" stroke-opacity="1.0"/>
<circle cx="552.0" cy="250.0" r="3.5" fill="#1f2933" fill-opacity="1.0"/>
<line x1="60.0" y1="272.0" x2="552.0" y2="272.0" stroke="#2563eb" stroke-width="1.4" stroke-dasharray="4 3"/>
<text x="66.0" y="268.0" font-size="11" fill="#2563eb" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">joint 1 to hand: 4.1 m</text>
<line x1="538.0" y1="250.0" x2="538.0" y2="102.4" stroke="#2563eb" stroke-width="3"/>
<polygon points="538.0,102.4 541.5,110.7 534.5,110.7" fill="#2563eb"/>
<text x="544.0" y="96.4" font-size="12" fill="#2563eb" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">4.1</text>
<line x1="276.0" y1="294.0" x2="552.0" y2="294.0" stroke="#7c3aed" stroke-width="1.4" stroke-dasharray="4 3"/>
<text x="282.0" y="290.0" font-size="11" fill="#7c3aed" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">joint 2 to hand: 2.3 m</text>
<line x1="552.0" y1="250.0" x2="552.0" y2="167.2" stroke="#7c3aed" stroke-width="3"/>
<polygon points="552.0,167.2 555.5,175.5 548.5,175.5" fill="#7c3aed"/>
<text x="558.0" y="161.2" font-size="12" fill="#7c3aed" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">2.3</text>
<line x1="432.0" y1="316.0" x2="552.0" y2="316.0" stroke="#059669" stroke-width="1.4" stroke-dasharray="4 3"/>
<text x="438.0" y="312.0" font-size="11" fill="#059669" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">joint 3 to hand: 1.0 m</text>
<line x1="566.0" y1="250.0" x2="566.0" y2="214.0" stroke="#059669" stroke-width="3"/>
<polygon points="566.0,214.0 569.5,222.3 562.5,222.3" fill="#059669"/>
<text x="572.0" y="208.0" font-size="12" fill="#059669" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">1.0</text>
<text x="300.0" y="26.0" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">J = [0 0 0; 4.1 2.3 1.0]: every joint moves the hand straight up</text>
</svg>
