<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" width="420" height="300" role="img">
<title>Free-body diagram of the mass: the applied force F(t) acts downward, and three forces resist it upward: the spring force Kx, the damper force f dx/dt and the inertia force M d²x/dt²</title>
<rect width="100%" height="100%" rx="8" fill="#ffffff"/>
<rect x="140.0" y="120.0" width="140.0" height="70.0" rx="3" fill="#dbeafe" stroke="#1f2933" stroke-width="1.6"/>
<text x="210.0" y="160.0" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">M</text>
<line x1="165.0" y1="120.0" x2="165.0" y2="62.0" stroke="#f59e0b" stroke-width="2.0"/>
<polygon points="165.0,62.0 169.5,71.0 160.5,71.0" fill="#f59e0b"/>
<line x1="210.0" y1="120.0" x2="210.0" y2="62.0" stroke="#f59e0b" stroke-width="2.0"/>
<polygon points="210.0,62.0 214.5,71.0 205.5,71.0" fill="#f59e0b"/>
<line x1="255.0" y1="120.0" x2="255.0" y2="62.0" stroke="#f59e0b" stroke-width="2.0"/>
<polygon points="255.0,62.0 259.5,71.0 250.5,71.0" fill="#f59e0b"/>
<text x="150.0" y="48.0" font-size="13" fill="#f59e0b" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">Kx</text>
<text x="210.0" y="30.0" font-size="13" fill="#f59e0b" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">f dx/dt</text>
<text x="285.0" y="48.0" font-size="13" fill="#f59e0b" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">M d²x/dt²</text>
<line x1="210.0" y1="190.0" x2="210.0" y2="255.0" stroke="#2563eb" stroke-width="2.0"/>
<polygon points="210.0,255.0 205.5,246.0 214.5,246.0" fill="#2563eb"/>
<text x="210.0" y="277.0" font-size="13" fill="#2563eb" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">F(t)</text>
<line x1="320.0" y1="130.0" x2="320.0" y2="180.0" stroke="#6b7280" stroke-width="2.0"/>
<polygon points="320.0,180.0 315.5,171.0 324.5,171.0" fill="#6b7280"/>
<text x="328.0" y="180.0" font-size="13" fill="#6b7280" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">x</text>
</svg>
