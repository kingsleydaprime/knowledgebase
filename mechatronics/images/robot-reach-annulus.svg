<line x1="37.5" y1="292.5" x2="422.5" y2="292.5" stroke="#e5e7eb" stroke-width="1"/>
<line x1="37.5" y1="237.5" x2="422.5" y2="237.5" stroke="#e5e7eb" stroke-width="1"/>
