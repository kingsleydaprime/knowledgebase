<circle cx="230" cy="210" r="44.0" fill="white" stroke="#2563eb" stroke-width="2" stroke-dasharray="5 4"/>
<polygon points="219.0,222.0 241.0,222.0 230.0,210.0" fill="#e5e7eb" stroke="#1f2933" stroke-width="1.3"/>
<text x="230.0" y="26.0" font-size="12" fill="#2563eb" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">outer radius l₁ + l₂ = 1.6</text>
<text x="230.0" y="272.0" font-size="11.5" fill="#2563eb" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">inner radius |l₁ − l₂| = 0.4</text>
