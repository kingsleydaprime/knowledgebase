<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 420" width="460" height="420" role="img">
<title>Which points a two-link arm with l1 = 1.0 m and l2 = 0.6 m can reach: every point whose distance d from the base satisfies 0.4 ≤ d ≤ 1.6, the shaded ring between a circle of radius l1 - l2 = 0.4 and one of radius l1 + l2 = 1.6. The target (1.0, 0.8), d = 1.28, is inside the ring; (1.6, 0.9), d = 1.84, is too far; and (0.2, 0.1), d = 0.22, is too close</title>
