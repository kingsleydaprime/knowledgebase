<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" width="640" height="250" role="img">
<title>The three rotational elements: an inertia J turned by torque T, a torsional spring K twisted between angles theta1 and theta2, and a rotational damper f between angular velocities omega1 and omega2, each with its torque equation</title>
<rect width="100%" height="100%" rx="8" fill="#ffffff"/>
<line x1="40.0" y1="100.0" x2="180.0" y2="100.0" stroke="#1f2933" stroke-width="3"/>
<rect x="95" y="50" width="26" height="100" rx="3" fill="#dbeafe" stroke="#1f2933" stroke-width="1.6"/>
<text x="108.0" y="172.0" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">J</text>
<path d="M 44 104 A 16 22 0 0 1 76 104" stroke="#2563eb" stroke-width="2" fill="none"/>
<polygon points="76,110 71,100 81,101" fill="#2563eb"/>
<text x="60.0" y="74.0" font-size="13" fill="#2563eb" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">T, θ</text>
<text x="110.0" y="205.0" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">T = J dω/dt = J d²θ/dt²</text>
<circle cx="260.0" cy="100.0" r="3.2" fill="#1f2933" stroke="none"/>
<circle cx="380.0" cy="100.0" r="3.2" fill="#1f2933" stroke="none"/>
<polyline points="260.0,100.0 286.4,100.0 293.1,107.0 299.8,93.0 306.6,107.0 313.3,93.0 320.0,107.0 326.7,93.0 333.4,107.0 340.2,93.0 346.9,107.0 353.6,100.0 380.0,100.0" fill="none" stroke="#1f2933" stroke-width="1.8" stroke-linejoin="round"/>
<text x="320.0" y="84.0" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">K</text>
<text x="260.0" y="130.0" font-size="12.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">θ₁</text>
<text x="380.0" y="130.0" font-size="12.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">θ₂</text>
<text x="320.0" y="205.0" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">T = K(θ₁ − θ₂)</text>
<text x="320.0" y="226.0" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">K in N·m/rad</text>
<circle cx="470.0" cy="100.0" r="3.2" fill="#1f2933" stroke="none"/>
<circle cx="590.0" cy="100.0" r="3.2" fill="#1f2933" stroke="none"/>
<polyline points="470.0,100.0 508.4,100.0" fill="none" stroke="#1f2933" stroke-width="1.8" stroke-linejoin="round"/>
<polyline points="551.6,91.0 508.4,91.0 508.4,109.0 551.6,109.0" fill="none" stroke="#1f2933" stroke-width="1.8" stroke-linejoin="round"/>
<polyline points="532.4,94.0 532.4,106.0" fill="none" stroke="#1f2933" stroke-width="2.4" stroke-linejoin="round"/>
<polyline points="532.4,100.0 590.0,100.0" fill="none" stroke="#1f2933" stroke-width="1.8" stroke-linejoin="round"/>
<text x="530.0" y="82.0" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">f</text>
<text x="470.0" y="130.0" font-size="12.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">ω₁</text>
<text x="590.0" y="130.0" font-size="12.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">ω₂</text>
<text x="530.0" y="205.0" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">T = f(ω₁ − ω₂)</text>
</svg>
