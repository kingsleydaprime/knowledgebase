<polygon points="254,110 263.0,106.0 263.0,114.0" fill="#1f2933"/>
<rect x="200.0" y="93.0" width="54" height="34" rx="2" fill="#dbeafe" stroke="#1f2933" stroke-width="1.5"/>
<text x="227.0" y="115.0" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">H</text>
