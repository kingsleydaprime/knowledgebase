<circle cx="100" cy="50" r="11" fill="white" stroke="#1f2933" stroke-width="1.5"/>
<text x="84.0" y="42.0" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">+</text>
<polyline points="111.0,50.0 160.0,50.0" fill="none" stroke="#1f2933" stroke-width="1.5" stroke-linejoin="round"/>
<polygon points="160,50 151.0,54.0 151.0,46.0" fill="#1f2933"/>
<rect x="160.0" y="33.0" width="54" height="34" rx="2" fill="#dbeafe" stroke="#1f2933" stroke-width="1.5"/>
<text x="187.0" y="55.0" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">G₁</text>
<polyline points="214.0,50.0 240.0,50.0" fill="none" stroke="#1f2933" stroke-width="1.5" stroke-linejoin="round"/>
<polygon points="240,50 231.0,54.0 231.0,46.0" fill="#1f2933"/>
