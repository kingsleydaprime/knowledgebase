<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 360" width="470" height="360" role="img">
<title>Barycentric coordinates: point P splits the triangle ABC into three smaller triangles; each weight is the area of the triangle opposite a corner divided by the whole area, here 0.33, 0.30 and 0.37</title>
