<text x="228.0" y="174.0" font-size="13" fill="#dc2626" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">P</text>
<text x="273.3" y="157.3" font-size="12" fill="#3b82f6" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">λ_A = 0.33</text>
<text x="166.7" y="170.7" font-size="12" fill="#b45309" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">λ_B = 0.30</text>
<text x="233.3" y="237.3" font-size="12" fill="#059669" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">λ_C = 0.37</text>
<text x="235.0" y="352.0" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">Each weight is the area opposite that corner ÷ the whole area. They always add up to 1.</text>
</svg>
