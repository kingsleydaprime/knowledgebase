<line x1="220.0" y1="180.0" x2="200.0" y2="40.0" stroke="#6b7280" stroke-width="1" stroke-dasharray="4 3"/>
<circle cx="80.0" cy="280.0" r="4.5" fill="#1f2933" stroke="none"/>
<circle cx="400.0" cy="240.0" r="4.5" fill="#1f2933" stroke="none"/>
<circle cx="200.0" cy="40.0" r="4.5" fill="#1f2933" stroke="none"/>
<text x="70.0" y="294.0" font-size="13" fill="#1f2933" text-anchor="end" font-weight="bold" font-family="system-ui, sans-serif">A</text>
<text x="408.0" y="244.0" font-size="13" fill="#1f2933" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">B</text>
