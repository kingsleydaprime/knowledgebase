<line x1="400.0" y1="320.0" x2="400.0" y2="40.0" stroke="#eef2f6" stroke-width="1"/>
<line x1="440.0" y1="320.0" x2="440.0" y2="40.0" stroke="#eef2f6" stroke-width="1"/>
<line x1="40.0" y1="320.0" x2="440.0" y2="320.0" stroke="#eef2f6" stroke-width="1"/>
<line x1="40.0" y1="280.0" x2="440.0" y2="280.0" stroke="#eef2f6" stroke-width="1"/>
<line x1="40.0" y1="240.0" x2="440.0" y2="240.0" stroke="#eef2f6" stroke-width="1"/>
<line x1="40.0" y1="200.0" x2="440.0" y2="200.0" stroke="#eef2f6" stroke-width="1"/>
