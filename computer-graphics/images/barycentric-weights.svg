<line x1="40.0" y1="40.0" x2="440.0" y2="40.0" stroke="#eef2f6" stroke-width="1"/>
<path d="M 220.0 180.0 L 400.0 240.0 L 200.0 40.0 Z" stroke="none" stroke-width="0" fill="rgba(59,130,246,0.25)"/>
<path d="M 80.0 280.0 L 220.0 180.0 L 200.0 40.0 Z" stroke="none" stroke-width="0" fill="rgba(245,158,11,0.3)"/>
<path d="M 80.0 280.0 L 400.0 240.0 L 220.0 180.0 Z" stroke="none" stroke-width="0" fill="rgba(5,150,105,0.25)"/>
<path d="M 80.0 280.0 L 400.0 240.0 L 200.0 40.0 Z" stroke="#1f2933" stroke-width="2" fill="none"/>
