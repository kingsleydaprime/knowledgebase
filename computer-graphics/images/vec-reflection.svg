<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 330" width="470" height="330" role="img">
<title>Reflecting the light direction L = (minus 0.6, 0.8) about the normal N = (0, 1). N dot L = 0.8, so 2(N dot L)N = (0, 1.6), and R = 2(N dot L)N minus L = (0.6, 0.8): the mirror image of L on the other side of N</title>
<rect width="100%" height="100%" rx="8" fill="#ffffff"/>
<line x1="35.0" y1="265.0" x2="35.0" y2="65.0" stroke="#eef2f6" stroke-width="1"/>
