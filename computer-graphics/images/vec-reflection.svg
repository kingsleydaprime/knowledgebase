<line x1="235.0" y1="265.0" x2="235.0" y2="65.0" stroke="#eef2f6" stroke-width="1"/>
<line x1="335.0" y1="265.0" x2="335.0" y2="65.0" stroke="#eef2f6" stroke-width="1"/>
<line x1="435.0" y1="265.0" x2="435.0" y2="65.0" stroke="#eef2f6" stroke-width="1"/>
<line x1="35.0" y1="265.0" x2="435.0" y2="265.0" stroke="#eef2f6" stroke-width="1"/>
<line x1="35.0" y1="165.0" x2="435.0" y2="165.0" stroke="#eef2f6" stroke-width="1"/>
<line x1="35.0" y1="65.0" x2="435.0" y2="65.0" stroke="#eef2f6" stroke-width="1"/>
<rect x="105.0" y="265.0" width="260.0" height="14.0" fill="#e5e7eb" stroke="#1f2933" stroke-width="1.5" fill-opacity="1"/>
<defs><marker id="m1f2933" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker></defs>
<line x1="235.0" y1="265.0" x2="235.0" y2="165.0" stroke="#1f2933" stroke-width="2.6" marker-end="url(#m1f2933)"/>
<defs><marker id="mf59e0b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker></defs>
<line x1="235.0" y1="265.0" x2="175.0" y2="185.0" stroke="#f59e0b" stroke-width="2.8" marker-end="url(#mf59e0b)"/>
<defs><marker id="mdc2626" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs>
<line x1="235.0" y1="265.0" x2="295.0" y2="185.0" stroke="#dc2626" stroke-width="2.8" marker-end="url(#mdc2626)"/>
<line x1="175.0" y1="185.0" x2="235.0" y2="185.0" stroke="#9aa5b1" stroke-width="1.2" stroke-dasharray="4 3"/>
<line x1="235.0" y1="185.0" x2="295.0" y2="185.0" stroke="#9aa5b1" stroke-width="1.2" stroke-dasharray="4 3"/>
<line x1="235.0" y1="165.0" x2="235.0" y2="105.0" stroke="#059669" stroke-width="2.4" stroke-dasharray="6 3"/>
<circle cx="235.0" cy="185.0" r="4" fill="#059669" stroke="none"/>
<text x="245.0" y="171.0" font-size="12" fill="#1f2933" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">N = (0, 1)</text>
<text x="169.0" y="177.0" font-size="12" fill="#f59e0b" text-anchor="end" font-weight="bold" font-family="system-ui, sans-serif">L = (−0.6, 0.8)</text>
<text x="301.0" y="177.0" font-size="12" fill="#dc2626" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">R = (0.6, 0.8)</text>
<text x="245.0" y="109.0" font-size="11" fill="#059669" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">2(N·L)N = (0, 1.6)</text>
<text x="225.0" y="201.0" font-size="11" fill="#059669" text-anchor="end" font-weight="normal" font-family="system-ui, sans-serif">(N·L)N</text>
<text x="235.0" y="322.0" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">R = 2(N·L)N − L: the same angle to N as L, on the other side.</text>
</svg>
