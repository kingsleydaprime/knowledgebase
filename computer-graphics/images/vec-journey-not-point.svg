<line x1="410.0" y1="300.0" x2="410.0" y2="20.0" stroke="#eef2f6" stroke-width="1"/>
<text x="410.0" y="315.0" font-size="10" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">9</text>
<line x1="50.0" y1="300.0" x2="410.0" y2="300.0" stroke="#eef2f6" stroke-width="1"/>
