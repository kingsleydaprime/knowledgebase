<defs><marker id="mdc2626" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs>
<line x1="90.0" y1="220.0" x2="210.0" y2="60.0" stroke="#dc2626" stroke-width="2.8" marker-end="url(#mdc2626)"/>
<circle cx="90.0" cy="220.0" r="4.5" fill="#1f2933" stroke="none"/>
<circle cx="210.0" cy="60.0" r="4.5" fill="#1f2933" stroke="none"/>
<text x="98.0" y="234.0" font-size="11" fill="#1f2933" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">A (1, 2)</text>
<text x="218.0" y="64.0" font-size="11" fill="#1f2933" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">B (4, 6)</text>
<text x="138.0" y="134.0" font-size="12" fill="#dc2626" text-anchor="end" font-weight="bold" font-family="system-ui, sans-serif">B − A = (3, 4)</text>
<circle cx="170.0" cy="140.0" r="6" fill="#3b82f6" stroke="none"/>
<text x="180.0" y="144.0" font-size="12" fill="#3b82f6" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">the point (3, 4): not on the line</text>
<text x="235.0" y="334.0" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">Start + journey = destination. The journey alone says how far and which way, not where.</text>
</svg>
