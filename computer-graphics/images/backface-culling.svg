<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 400" width="440" height="400" role="img">
<title>Top view of a cube with outward normals; the viewer looks along V into the scene; faces with V dot N greater than 0 face away and are culled</title>
<rect width="100%" height="100%" rx="8" fill="#ffffff"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker></defs>
<line x1="150.0" y1="245.0" x2="290.0" y2="245.0" stroke="#3b82f6" stroke-width="4"/>
<line x1="220.0" y1="245.0" x2="220.0" y2="290.0" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="220.0" y="319.0" font-size="11" fill="#3b82f6" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">V·N = −1 &lt; 0: drawn</text>
<line x1="150.0" y1="105.0" x2="290.0" y2="105.0" stroke="#9ca3af" stroke-width="4" stroke-dasharray="6 5"/>
<line x1="220.0" y1="105.0" x2="220.0" y2="60.0" stroke="#9ca3af" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="220.0" y="39.0" font-size="11" fill="#9ca3af" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">V·N = 1 &gt; 0: culled</text>
<line x1="150.0" y1="105.0" x2="150.0" y2="245.0" stroke="#3b82f6" stroke-width="4"/>
<line x1="150.0" y1="175.0" x2="105.0" y2="175.0" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="90.0" y="179.0" font-size="11" fill="#3b82f6" text-anchor="end" font-weight="bold" font-family="system-ui, sans-serif">V·N = 0: edge-on</text>
<line x1="290.0" y1="105.0" x2="290.0" y2="245.0" stroke="#3b82f6" stroke-width="4"/>
<line x1="290.0" y1="175.0" x2="335.0" y2="175.0" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="350.0" y="179.0" font-size="11" fill="#3b82f6" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">V·N = 0: edge-on</text>
<line x1="220.0" y1="392.0" x2="220.0" y2="352.0" stroke="#1f2933" stroke-width="2" marker-end="url(#arr)"/>
<text x="228.0" y="384.0" font-size="11" fill="#1f2933" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">viewer, looking along V</text>
<text x="220.0" y="18.0" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">Top view of a cube. Arrows are outward normals N.</text>
</svg>
