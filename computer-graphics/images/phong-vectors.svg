<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 300" width="470" height="300" role="img">
<title>At a surface point: the normal n points straight out, l points to the light, v to the viewer, r is l reflected about n, and h is halfway between l and v</title>
<rect width="100%" height="100%" rx="8" fill="#ffffff"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker></defs>
<line x1="40.0" y1="240.0" x2="430.0" y2="240.0" stroke="#1f2933" stroke-width="3"/>
<path d="M 40 240 L 430 240 L 430 266 L 40 266 Z" fill="#e5e7eb"/>
<line x1="235" y1="240" x2="235.0" y2="90.0" stroke="#1f2933" stroke-width="2.6" marker-end="url(#arr)"/>
<text x="235.0" y="80.0" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">n</text>
<line x1="235" y1="240" x2="120.1" y2="143.6" stroke="#f59e0b" stroke-width="2.6" marker-end="url(#arr)"/>
<text x="109.4" y="138.6" font-size="15" fill="#f59e0b" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">l</text>
<line x1="235" y1="240" x2="349.9" y2="143.6" stroke="#dc2626" stroke-width="2.6" marker-end="url(#arr)"/>
<text x="360.6" y="138.6" font-size="15" fill="#dc2626" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">r</text>
<line x1="235" y1="240" x2="310.0" y2="110.1" stroke="#3b82f6" stroke-width="2.6" marker-end="url(#arr)"/>
<text x="317.0" y="102.0" font-size="15" fill="#3b82f6" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">v</text>
<line x1="235" y1="240" x2="214.2" y2="121.8" stroke="#059669" stroke-width="2.6" marker-end="url(#arr)"/>
<text x="211.7" y="112.0" font-size="15" fill="#059669" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">h</text>
<circle cx="235.0" cy="240.0" r="4" fill="#1f2933" stroke="none"/>
<text x="235.0" y="290.0" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">Phong compares r with v; Blinn–Phong compares h with n. Diffuse light depends only on n · l.</text>
</svg>
