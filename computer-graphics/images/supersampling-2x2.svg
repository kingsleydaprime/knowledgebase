<circle cx="187.5" cy="207.5" r="6" fill="#3b82f6" stroke="#1f2933"/>
<circle cx="187.5" cy="162.5" r="6" fill="#3b82f6" stroke="#1f2933"/>
<rect x="120.0" y="50.0" width="90.0" height="90.0" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" fill-opacity="1"/>
<circle cx="142.5" cy="117.5" r="6" fill="#ffffff" stroke="#1f2933"/>
<circle cx="142.5" cy="72.5" r="6" fill="#ffffff" stroke="#1f2933"/>
<circle cx="187.5" cy="117.5" r="6" fill="#3b82f6" stroke="#1f2933"/>
<circle cx="187.5" cy="72.5" r="6" fill="#ffffff" stroke="#1f2933"/>
