<text x="445.0" y="100.0" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">1/4</text>
<rect x="490.0" y="140.0" width="90.0" height="90.0" fill="#1f2933" stroke="#cbd2d9" stroke-width="1" fill-opacity="1"/>
<text x="535.0" y="190.0" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">4/4</text>
<rect x="490.0" y="50.0" width="90.0" height="90.0" fill="#1f2933" stroke="#cbd2d9" stroke-width="1" fill-opacity="1"/>
<text x="535.0" y="100.0" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">4/4</text>
<text x="445.0" y="30.0" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">average → pixel shade</text>
<text x="280.0" y="270.0" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">Blue dots: samples inside the shape (below the red edge).</text>
<text x="280.0" y="290.0" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">Each pixel’s shade is the fraction of its samples inside: 3/4 = 75%.</text>
</svg>
