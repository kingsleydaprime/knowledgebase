<circle cx="277.5" cy="162.5" r="6" fill="#3b82f6" stroke="#1f2933"/>
<rect x="210.0" y="50.0" width="90.0" height="90.0" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" fill-opacity="1"/>
