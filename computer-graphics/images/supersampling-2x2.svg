<text x="165.0" y="30.0" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">4 samples per pixel</text>
<rect x="310.0" y="140.0" width="90.0" height="90.0" fill="rgba(31,41,51,0.75)" stroke="#cbd2d9" stroke-width="1" fill-opacity="1"/>
<text x="355.0" y="190.0" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">3/4</text>
