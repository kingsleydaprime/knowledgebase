<text x="235.0" y="346.0" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">Check: (4, 2, 2)·e1 = −4 + 4 + 0 = 0 and (4, 2, 2)·e2 = −4 + 0 + 4 = 0.</text>
