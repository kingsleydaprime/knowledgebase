<title>Triangle A (1, 0, 0), B (0, 2, 0), C (0, 0, 2) drawn in 3D. Edge e1 = B minus A = (minus 1, 2, 0) and edge e2 = C minus A = (minus 1, 0, 2). Their cross product e1 cross e2 = (4, 2, 2) is perpendicular to both edges: it is the triangle's normal</title>
