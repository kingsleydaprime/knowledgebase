<circle cx="171.5" cy="274.5" r="4" fill="#1f2933" stroke="none"/>
<text x="155.5" y="276.5" font-size="12" fill="#1f2933" text-anchor="end" font-weight="bold" font-family="system-ui, sans-serif">A (1, 0, 0)</text>
