<text x="330.0" y="64.0" font-size="12" fill="#9aa5b1" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">t = 1.5  (5.5, 8)</text>
<text x="235.0" y="412.0" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">Red: 0 ≤ t ≤ 1, the segment. Grey dashes: t &lt; 0 behind A, t &gt; 1 past B.</text>
