<circle cx="260.0" cy="140.0" r="5" fill="#1f2933" stroke="none"/>
<text x="270.0" y="144.0" font-size="12" fill="#1f2933" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">t = 1  (B)</text>
