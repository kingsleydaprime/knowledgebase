<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 340" width="470" height="340" role="img">
<title>For a steep line, at row y_k + 1 the true line sits at x between the left pixel x_k and the right pixel x_k + 1; d_left is the gap back to x_k and d_right the gap on to x_k + 1</title>
<rect width="100%" height="100%" rx="8" fill="#ffffff"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker></defs>
<rect x="92.0" y="232.0" width="36.0" height="36.0" fill="#3b82f6" stroke="#1f2933" stroke-width="1.4" fill-opacity="1"/>
<rect x="92.0" y="82.0" width="36.0" height="36.0" fill="#ffffff" stroke="#1f2933" stroke-width="1.4" fill-opacity="1"/>
<rect x="242.0" y="82.0" width="36.0" height="36.0" fill="#ffffff" stroke="#1f2933" stroke-width="1.4" fill-opacity="1"/>
<line x1="101.0" y1="272.5" x2="176.0" y2="85.0" stroke="#dc2626" stroke-width="2.2"/>
<circle cx="170.0" cy="100.0" r="5" fill="#dc2626" stroke="none"/>
<line x1="110.0" y1="66.0" x2="260.0" y2="66.0" stroke="#1f2933" stroke-width="1"/>
<line x1="140.0" y1="66.0" x2="113.0" y2="66.0" stroke="#1f2933" stroke-width="1.6" marker-end="url(#arr)"/>
<line x1="140.0" y1="66.0" x2="167.0" y2="66.0" stroke="#1f2933" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="164.0" y="54.0" font-size="12" fill="#1f2933" text-anchor="end" font-weight="normal" font-family="system-ui, sans-serif">d_left = x − x_k</text>
<line x1="215.0" y1="66.0" x2="173.0" y2="66.0" stroke="#1f2933" stroke-width="1.6" marker-end="url(#arr)"/>
<line x1="215.0" y1="66.0" x2="257.0" y2="66.0" stroke="#1f2933" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="176.0" y="54.0" font-size="12" fill="#1f2933" text-anchor="start" font-weight="normal" font-family="system-ui, sans-serif">d_right = (x_k + 1) − x</text>
<text x="110.0" y="292.0" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">x_k</text>
<text x="260.0" y="292.0" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">x_k + 1</text>
<text x="70.0" y="254.0" font-size="13" fill="#1f2933" text-anchor="end" font-weight="bold" font-family="system-ui, sans-serif">y_k</text>
<text x="70.0" y="104.0" font-size="13" fill="#1f2933" text-anchor="end" font-weight="bold" font-family="system-ui, sans-serif">y_k + 1</text>
<text x="180.0" y="126.0" font-size="13" fill="#dc2626" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">x</text>
<text x="136.0" y="254.0" font-size="11" fill="#3b82f6" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">plotted</text>
<text x="84.0" y="134.0" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">left?</text>
<text x="260.0" y="134.0" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">right?</text>
<text x="235.0" y="332.0" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">Steep line: step y by 1, and choose left (x stays) or right (x + 1) by which is nearer.</text>
</svg>
