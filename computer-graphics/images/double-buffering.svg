<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 230" width="520" height="230" role="img">
<title>Double buffering: the program draws the next frame into the hidden back buffer while the display shows the front buffer; at vertical retrace the two are swapped</title>
<rect width="100%" height="100%" rx="8" fill="#ffffff"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker></defs>
<rect x="30.0" y="85.0" width="130.0" height="56.0" fill="#e5e7eb" stroke="#1f2933" stroke-width="1.3" fill-opacity="1"/>
<text x="95.0" y="109.0" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">Program</text>
<text x="95.0" y="127.0" font-size="10" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">draws frame n + 1</text>
<rect x="190.0" y="40.0" width="130.0" height="56.0" fill="#fef3c7" stroke="#1f2933" stroke-width="1.3" fill-opacity="1"/>
<text x="255.0" y="64.0" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">Back buffer</text>
<text x="255.0" y="82.0" font-size="10" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">hidden, being drawn</text>
<rect x="190.0" y="130.0" width="130.0" height="56.0" fill="#dbeafe" stroke="#1f2933" stroke-width="1.3" fill-opacity="1"/>
<text x="255.0" y="154.0" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">Front buffer</text>
<text x="255.0" y="172.0" font-size="10" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">shown on screen</text>
<rect x="370.0" y="85.0" width="130.0" height="56.0" fill="#e5e7eb" stroke="#1f2933" stroke-width="1.3" fill-opacity="1"/>
<text x="435.0" y="109.0" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">Display</text>
<text x="435.0" y="127.0" font-size="10" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">reads front buffer</text>
<line x1="160.0" y1="105.0" x2="188.0" y2="75.0" stroke="#1f2933" stroke-width="1.6" marker-end="url(#arr)"/>
<line x1="320.0" y1="160.0" x2="368.0" y2="125.0" stroke="#1f2933" stroke-width="1.6" marker-end="url(#arr)"/>
<line x1="300.0" y1="98.0" x2="300.0" y2="128.0" stroke="#1f2933" stroke-width="1.6" marker-end="url(#arr)"/>
<line x1="210.0" y1="128.0" x2="210.0" y2="98.0" stroke="#1f2933" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="255.0" y="117.0" font-size="10" fill="#059669" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">swap at V-sync</text>
<text x="260.0" y="218.0" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">The screen never shows a half-drawn frame, so there is no tearing.</text>
</svg>
