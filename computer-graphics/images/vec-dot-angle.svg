<line x1="330.0" y1="320.0" x2="330.0" y2="40.0" stroke="#eef2f6" stroke-width="1"/>
<text x="330.0" y="335.0" font-size="10" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">5</text>
<line x1="386.0" y1="320.0" x2="386.0" y2="40.0" stroke="#eef2f6" stroke-width="1"/>
<text x="386.0" y="335.0" font-size="10" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">6</text>
