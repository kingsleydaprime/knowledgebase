<defs><marker id="mf59e0b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker></defs>
<line x1="50.0" y1="320.0" x2="162.0" y2="264.0" stroke="#f59e0b" stroke-width="2.8" marker-end="url(#mf59e0b)"/>
<text x="226.0" y="100.0" font-size="12" fill="#3b82f6" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">a = (3, 4), |a| = 5</text>
<text x="172.0" y="286.0" font-size="12" fill="#f59e0b" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">b = (2, 1), |b| = √5</text>
<text x="284.0" y="228.0" font-size="12" fill="#059669" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">a's shadow on b: 10 / √5 ≈ 4.47</text>
<text x="260.0" y="356.0" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">a · b = 3×2 + 4×1 = 10 = |a| |b| cos θ = shadow length × |b|</text>
<text x="260.0" y="374.0" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">cos θ = 10 / (5 × √5) ≈ 0.894, so the angle θ between a and b ≈ 26.6°</text>
</svg>
