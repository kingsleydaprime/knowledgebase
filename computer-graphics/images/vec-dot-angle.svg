<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 386" width="520" height="386" role="img">
<title>a = (3, 4) and b = (2, 1). Their dot product is 10. The angle between them is about 26.6 degrees. The shadow of a on the line of b has length 10 over root 5, about 4.47, and its foot is (4, 2)</title>
