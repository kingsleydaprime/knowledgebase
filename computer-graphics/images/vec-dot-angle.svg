<text x="43.0" y="44.0" font-size="10" fill="#1f2933" text-anchor="end" font-weight="normal" font-family="system-ui, sans-serif">5</text>
<line x1="50.0" y1="320.0" x2="363.6" y2="163.2" stroke="#9aa5b1" stroke-width="1.2" stroke-dasharray="5 4"/>
