<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 330" width="470" height="330" role="img">
<title>At column x_k + 1 the true line sits at height y between the lower pixel y_k and the upper pixel y_k + 1; d_lower is the gap down to y_k and d_upper the gap up to y_k + 1</title>
<rect width="100%" height="100%" rx="8" fill="#ffffff"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker></defs>
<rect x="72.0" y="197.0" width="36.0" height="36.0" fill="#3b82f6" stroke="#1f2933" stroke-width="1.4" fill-opacity="1"/>
<rect x="72.0" y="87.0" width="36.0" height="36.0" fill="#ffffff" stroke="#1f2933" stroke-width="1.4" fill-opacity="1"/>
<rect x="182.0" y="197.0" width="36.0" height="36.0" fill="#ffffff" stroke="#1f2933" stroke-width="1.4" fill-opacity="1"/>
<rect x="182.0" y="87.0" width="36.0" height="36.0" fill="#ffffff" stroke="#1f2933" stroke-width="1.4" fill-opacity="1"/>
<line x1="57.0" y1="226.6" x2="266.0" y2="153.4" stroke="#dc2626" stroke-width="2.2"/>
<circle cx="200.0" cy="176.5" r="5" fill="#dc2626" stroke="none"/>
<line x1="230.0" y1="215.0" x2="230.0" y2="176.5" stroke="#1f2933" stroke-width="1"/>
<line x1="230.0" y1="195.8" x2="230.0" y2="179.5" stroke="#1f2933" stroke-width="1.6" marker-end="url(#arr)"/>
<line x1="230.0" y1="195.8" x2="230.0" y2="212.0" stroke="#1f2933" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="242.0" y="199.8" font-size="12" fill="#1f2933" text-anchor="start" font-weight="normal" font-family="system-ui, sans-serif">d_lower = y − y_k</text>
<line x1="230.0" y1="140.8" x2="230.0" y2="108.0" stroke="#1f2933" stroke-width="1.6" marker-end="url(#arr)"/>
<line x1="230.0" y1="140.8" x2="230.0" y2="173.5" stroke="#1f2933" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="242.0" y="144.8" font-size="12" fill="#1f2933" text-anchor="start" font-weight="normal" font-family="system-ui, sans-serif">d_upper = (y_k + 1) − y</text>
<text x="90.0" y="281.0" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">x_k</text>
<text x="200.0" y="281.0" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">x_k + 1</text>
<text x="50.0" y="219.0" font-size="13" fill="#1f2933" text-anchor="end" font-weight="bold" font-family="system-ui, sans-serif">y_k</text>
<text x="50.0" y="109.0" font-size="13" fill="#1f2933" text-anchor="end" font-weight="bold" font-family="system-ui, sans-serif">y_k + 1</text>
<text x="174.0" y="180.5" font-size="13" fill="#dc2626" text-anchor="end" font-weight="bold" font-family="system-ui, sans-serif">y</text>
<text x="90.0" y="189.0" font-size="11" fill="#3b82f6" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">plotted</text>
<text x="200.0" y="79.0" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">upper?</text>
<text x="200.0" y="249.0" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">lower?</text>
<text x="235.0" y="318.0" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">Pick the candidate the true line is nearer to: lower when d_lower &lt; d_upper.</text>
</svg>
