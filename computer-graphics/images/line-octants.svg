<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 470" width="520" height="470" role="img">
<title>Lines leaving the centre in eight directions. Between the diagonals around the x axis the line is gentle and Bresenham steps x; around the y axis it is steep and steps y. sx and sy are +1 or −1 depending on which way the line goes</title>
