<text x="260.0" y="455.0" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">Blue: gentle (|Δx| &gt; |Δy|), step x.  Green: steep (|Δy| &gt; |Δx|), step y.  Dashed: the 45° lines.</text>
