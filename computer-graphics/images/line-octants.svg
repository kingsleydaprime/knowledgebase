<line x1="123.2" y1="366.8" x2="396.8" y2="93.2" stroke="#9aa5b1" stroke-width="1.2" stroke-dasharray="6 4"/>
<line x1="123.2" y1="93.2" x2="396.8" y2="366.8" stroke="#9aa5b1" stroke-width="1.2" stroke-dasharray="6 4"/>
<line x1="260.0" y1="230.0" x2="368.8" y2="184.9" stroke="#3b82f6" stroke-width="2" marker-end="url(#arr)"/>
<text x="411.0" y="161.5" font-size="12" fill="#3b82f6" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">step x</text>
<text x="411.0" y="176.5" font-size="10" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">sx = +1, sy = +1</text>
