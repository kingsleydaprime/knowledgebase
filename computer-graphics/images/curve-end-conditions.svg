<text x="250.0" y="350.0" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">B'(0) = 3(P1 − P0) = v0 and B'(1) = 3(P3 − P2) = v1, so each arrow is a third of a velocity.</text>
