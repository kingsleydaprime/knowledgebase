<text x="230.0" y="223.0" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">6</text>
<circle cx="282.0" cy="218.0" r="16" fill="#f3f4f6" stroke="#9aa5b1"/>
<text x="282.0" y="223.0" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">4</text>
<circle cx="334.0" cy="218.0" r="16" fill="#f3f4f6" stroke="#9aa5b1"/>
