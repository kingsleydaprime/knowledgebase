<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 260" width="520" height="260" role="img">
<title>Pascal's triangle, rows 0 to 4: 1; 1 1; 1 2 1; 1 3 3 1; 1 4 6 4 1. Each number is the sum of the two above it. Row n gives the weights of a degree n Bezier curve: row 1 a line, row 2 the quadratic 1 2 1, row 3 the cubic 1 3 3 1</title>
