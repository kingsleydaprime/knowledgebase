<text x="370.0" y="139.0" font-size="12" fill="#f59e0b" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">quadratic</text>
<text x="40.0" y="181.0" font-size="12" fill="#9aa5b1" text-anchor="start" font-weight="normal" font-family="system-ui, sans-serif">row 3</text>
<circle cx="152.0" cy="176.0" r="16" fill="#fef3c7" stroke="#f59e0b"/>
<text x="152.0" y="181.0" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">1</text>
<circle cx="204.0" cy="176.0" r="16" fill="#fef3c7" stroke="#f59e0b"/>
