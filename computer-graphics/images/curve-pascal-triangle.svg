<circle cx="308.0" cy="176.0" r="16" fill="#fef3c7" stroke="#f59e0b"/>
<text x="308.0" y="181.0" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">1</text>
<text x="370.0" y="181.0" font-size="12" fill="#f59e0b" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">cubic</text>
