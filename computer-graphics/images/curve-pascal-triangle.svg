<text x="204.0" y="97.0" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">1</text>
<circle cx="256.0" cy="92.0" r="16" fill="#f3f4f6" stroke="#9aa5b1"/>
<text x="256.0" y="97.0" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">1</text>
<text x="370.0" y="97.0" font-size="12" fill="#1f2933" text-anchor="start" font-weight="normal" font-family="system-ui, sans-serif">linear: a line</text>
<text x="40.0" y="139.0" font-size="12" fill="#9aa5b1" text-anchor="start" font-weight="normal" font-family="system-ui, sans-serif">row 2</text>
<circle cx="178.0" cy="134.0" r="16" fill="#fef3c7" stroke="#f59e0b"/>
<text x="178.0" y="139.0" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">1</text>
<circle cx="230.0" cy="134.0" r="16" fill="#fef3c7" stroke="#f59e0b"/>
<text x="230.0" y="139.0" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">2</text>
<circle cx="282.0" cy="134.0" r="16" fill="#fef3c7" stroke="#f59e0b"/>
