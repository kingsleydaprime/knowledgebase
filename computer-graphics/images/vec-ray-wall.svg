<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 300" width="470" height="300" role="img">
<title>A ray P(t) = O + tD from O (0, 1) in direction D (1, 0.5) hits the wall x = 4 when 0 + t times 1 = 4, so t = 4 and the hit point is (4, 3)</title>
<rect width="100%" height="100%" rx="8" fill="#ffffff"/>
<line x1="50.0" y1="260.0" x2="50.0" y2="60.0" stroke="#eef2f6" stroke-width="1"/>
<text x="50.0" y="275.0" font-size="10" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">0</text>
<line x1="100.0" y1="260.0" x2="100.0" y2="60.0" stroke="#eef2f6" stroke-width="1"/>
<text x="100.0" y="275.0" font-size="10" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">1</text>
<line x1="150.0" y1="260.0" x2="150.0" y2="60.0" stroke="#eef2f6" stroke-width="1"/>
<text x="150.0" y="275.0" font-size="10" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">2</text>
<line x1="200.0" y1="260.0" x2="200.0" y2="60.0" stroke="#eef2f6" stroke-width="1"/>
<text x="200.0" y="275.0" font-size="10" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">3</text>
<line x1="250.0" y1="260.0" x2="250.0" y2="60.0" stroke="#eef2f6" stroke-width="1"/>
<text x="250.0" y="275.0" font-size="10" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">4</text>
<line x1="300.0" y1="260.0" x2="300.0" y2="60.0" stroke="#eef2f6" stroke-width="1"/>
<text x="300.0" y="275.0" font-size="10" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">5</text>
<line x1="350.0" y1="260.0" x2="350.0" y2="60.0" stroke="#eef2f6" stroke-width="1"/>
<text x="350.0" y="275.0" font-size="10" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">6</text>
<line x1="400.0" y1="260.0" x2="400.0" y2="60.0" stroke="#eef2f6" stroke-width="1"/>
<text x="400.0" y="275.0" font-size="10" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">7</text>
<line x1="50.0" y1="260.0" x2="400.0" y2="260.0" stroke="#eef2f6" stroke-width="1"/>
<text x="43.0" y="264.0" font-size="10" fill="#1f2933" text-anchor="end" font-weight="normal" font-family="system-ui, sans-serif">0</text>
<line x1="50.0" y1="210.0" x2="400.0" y2="210.0" stroke="#eef2f6" stroke-width="1"/>
<text x="43.0" y="214.0" font-size="10" fill="#1f2933" text-anchor="end" font-weight="normal" font-family="system-ui, sans-serif">1</text>
<line x1="50.0" y1="160.0" x2="400.0" y2="160.0" stroke="#eef2f6" stroke-width="1"/>
<text x="43.0" y="164.0" font-size="10" fill="#1f2933" text-anchor="end" font-weight="normal" font-family="system-ui, sans-serif">2</text>
<line x1="50.0" y1="110.0" x2="400.0" y2="110.0" stroke="#eef2f6" stroke-width="1"/>
<text x="43.0" y="114.0" font-size="10" fill="#1f2933" text-anchor="end" font-weight="normal" font-family="system-ui, sans-serif">3</text>
<line x1="50.0" y1="60.0" x2="400.0" y2="60.0" stroke="#eef2f6" stroke-width="1"/>
<text x="43.0" y="64.0" font-size="10" fill="#1f2933" text-anchor="end" font-weight="normal" font-family="system-ui, sans-serif">4</text>
<rect x="250.0" y="60.0" width="10.0" height="200.0" fill="#e5e7eb" stroke="#1f2933" stroke-width="1.5" fill-opacity="1"/>
<line x1="50.0" y1="210.0" x2="350.0" y2="60.0" stroke="#9aa5b1" stroke-width="1.4" stroke-dasharray="6 4"/>
<defs><marker id="mf59e0b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker></defs>
<line x1="50.0" y1="210.0" x2="100.0" y2="185.0" stroke="#f59e0b" stroke-width="3" marker-end="url(#mf59e0b)"/>
<line x1="100.0" y1="185.0" x2="250.0" y2="110.0" stroke="#dc2626" stroke-width="2.6"/>
<circle cx="50.0" cy="210.0" r="4.5" fill="#1f2933" stroke="none"/>
<circle cx="250.0" cy="110.0" r="6" fill="#dc2626" stroke="none"/>
<text x="44.0" y="228.0" font-size="11" fill="#1f2933" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">O (0, 1)</text>
<text x="84.0" y="163.0" font-size="12" fill="#f59e0b" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">D = (1, 0.5)</text>
<text x="240.0" y="98.0" font-size="12" fill="#dc2626" text-anchor="end" font-weight="bold" font-family="system-ui, sans-serif">hit at t = 4: (4, 3)</text>
<text x="264.0" y="240.0" font-size="11" fill="#1f2933" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">wall x = 4</text>
<text x="235.0" y="292.0" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">Same line formula; the intersection test solves for t.</text>
</svg>
