<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 360" width="470" height="360" role="img">
<title>The vector from A (1, 2) to B (4, 6) is B minus A = (3, 4): 3 across and 4 up. Its length is 5 by Pythagoras and it makes about 53.1 degrees with the x-axis</title>
