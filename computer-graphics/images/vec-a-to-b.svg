<line x1="50.0" y1="63.0" x2="428.0" y2="63.0" stroke="#eef2f6" stroke-width="1"/>
<text x="43.0" y="67.0" font-size="10" fill="#1f2933" text-anchor="end" font-weight="normal" font-family="system-ui, sans-serif">6</text>
<line x1="50.0" y1="21.0" x2="428.0" y2="21.0" stroke="#eef2f6" stroke-width="1"/>
<text x="43.0" y="25.0" font-size="10" fill="#1f2933" text-anchor="end" font-weight="normal" font-family="system-ui, sans-serif">7</text>
<line x1="92.0" y1="231.0" x2="218.0" y2="231.0" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6 4"/>
<line x1="218.0" y1="231.0" x2="218.0" y2="63.0" stroke="#059669" stroke-width="2" stroke-dasharray="6 4"/>
<defs><marker id="mdc2626" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs>
<line x1="92.0" y1="231.0" x2="218.0" y2="63.0" stroke="#dc2626" stroke-width="2.8" marker-end="url(#mdc2626)"/>
<circle cx="92.0" cy="231.0" r="4.5" fill="#1f2933" stroke="none"/>
<circle cx="218.0" cy="63.0" r="4.5" fill="#1f2933" stroke="none"/>
<text x="82.0" y="225.0" font-size="11" fill="#1f2933" text-anchor="end" font-weight="bold" font-family="system-ui, sans-serif">A (1, 2)  tail</text>
<text x="228.0" y="67.0" font-size="11" fill="#1f2933" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">B (4, 6)  head</text>
<text x="155.0" y="251.0" font-size="12" fill="#f59e0b" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">x₂ − x₁ = 3</text>
<text x="226.0" y="151.0" font-size="12" fill="#059669" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">y₂ − y₁ = 4</text>
<text x="141.0" y="143.0" font-size="12" fill="#dc2626" text-anchor="end" font-weight="bold" font-family="system-ui, sans-serif">|AB| = 5</text>
<text x="126.0" y="225.0" font-size="11" fill="#1f2933" text-anchor="start" font-weight="normal" font-family="system-ui, sans-serif">θ ≈ 53.1°</text>
<text x="235.0" y="350.0" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">AB = B − A = (4 − 1, 6 − 2) = (3, 4). Head minus tail.</text>
</svg>
