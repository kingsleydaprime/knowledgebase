<text x="176.0" y="330.0" font-size="10" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">3</text>
<line x1="218.0" y1="315.0" x2="218.0" y2="21.0" stroke="#eef2f6" stroke-width="1"/>
<text x="218.0" y="330.0" font-size="10" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">4</text>
<line x1="260.0" y1="315.0" x2="260.0" y2="21.0" stroke="#eef2f6" stroke-width="1"/>
<text x="260.0" y="330.0" font-size="10" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">5</text>
<line x1="302.0" y1="315.0" x2="302.0" y2="21.0" stroke="#eef2f6" stroke-width="1"/>
<text x="302.0" y="330.0" font-size="10" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">6</text>
