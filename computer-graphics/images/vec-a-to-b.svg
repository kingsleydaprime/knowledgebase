<text x="344.0" y="330.0" font-size="10" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">7</text>
<line x1="386.0" y1="315.0" x2="386.0" y2="21.0" stroke="#eef2f6" stroke-width="1"/>
<text x="386.0" y="330.0" font-size="10" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">8</text>
<line x1="428.0" y1="315.0" x2="428.0" y2="21.0" stroke="#eef2f6" stroke-width="1"/>
<text x="428.0" y="330.0" font-size="10" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">9</text>
<line x1="50.0" y1="315.0" x2="428.0" y2="315.0" stroke="#eef2f6" stroke-width="1"/>
<text x="43.0" y="319.0" font-size="10" fill="#1f2933" text-anchor="end" font-weight="normal" font-family="system-ui, sans-serif">0</text>
<line x1="50.0" y1="273.0" x2="428.0" y2="273.0" stroke="#eef2f6" stroke-width="1"/>
<text x="43.0" y="277.0" font-size="10" fill="#1f2933" text-anchor="end" font-weight="normal" font-family="system-ui, sans-serif">1</text>
<line x1="50.0" y1="231.0" x2="428.0" y2="231.0" stroke="#eef2f6" stroke-width="1"/>
<text x="43.0" y="235.0" font-size="10" fill="#1f2933" text-anchor="end" font-weight="normal" font-family="system-ui, sans-serif">2</text>
<line x1="50.0" y1="189.0" x2="428.0" y2="189.0" stroke="#eef2f6" stroke-width="1"/>
<text x="43.0" y="193.0" font-size="10" fill="#1f2933" text-anchor="end" font-weight="normal" font-family="system-ui, sans-serif">3</text>
<line x1="50.0" y1="147.0" x2="428.0" y2="147.0" stroke="#eef2f6" stroke-width="1"/>
