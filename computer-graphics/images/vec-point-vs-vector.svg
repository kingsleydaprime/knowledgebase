<text x="324.0" y="296.0" font-size="11" fill="#3b82f6" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">start (6, 0)</text>
<text x="436.0" y="134.0" font-size="11" fill="#3b82f6" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">lands on (9, 4)</text>
<defs><marker id="m059669" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker></defs>
<line x1="88.0" y1="292.0" x2="202.0" y2="140.0" stroke="#059669" stroke-width="2.6" marker-end="url(#m059669)"/>
<circle cx="88.0" cy="292.0" r="4" fill="#1f2933" stroke="none"/>
<text x="96.0" y="296.0" font-size="11" fill="#059669" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">start (0, 0)</text>
<text x="208.0" y="134.0" font-size="11" fill="#059669" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">lands on (3, 4)</text>
<text x="280.0" y="22.0" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">One journey, (3, 4) = "3 right, 4 up", from three different starts</text>
<text x="280.0" y="370.0" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">From the origin (green) the vector and the point it lands on have the same numbers.</text>
