<defs><marker id="m3b82f6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b82f6"/></marker></defs>
<line x1="316.0" y1="292.0" x2="430.0" y2="140.0" stroke="#3b82f6" stroke-width="2.6" marker-end="url(#m3b82f6)"/>
