<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 300" width="660" height="300" role="img">
<title>Three kinds of slope: gentle (delta x 6 is bigger than delta y 3, m = 0.5), steep (delta y 6 is bigger than delta x 3, m = 2) and diagonal (delta x = delta y = 5, m = 1)</title>
