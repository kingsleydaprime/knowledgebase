<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 330" width="470" height="330" role="img">
<title>The line from (x1, y1) = (1, 1) to (x2, y2) = (8, 5): delta x = 7 across and delta y = 4 up, so the slope m = 4/7</title>
<rect width="100%" height="100%" rx="8" fill="#ffffff"/>
<line x1="50.0" y1="285.0" x2="50.0" y2="33.0" stroke="#eef2f6" stroke-width="1"/>
<text x="50.0" y="300.0" font-size="10" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">0</text>
<line x1="92.0" y1="285.0" x2="92.0" y2="33.0" stroke="#eef2f6" stroke-width="1"/>
<text x="92.0" y="300.0" font-size="10" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">1</text>
<line x1="134.0" y1="285.0" x2="134.0" y2="33.0" stroke="#eef2f6" stroke-width="1"/>
<text x="134.0" y="300.0" font-size="10" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">2</text>
<line x1="176.0" y1="285.0" x2="176.0" y2="33.0" stroke="#eef2f6" stroke-width="1"/>
<text x="176.0" y="300.0" font-size="10" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">3</text>
<line x1="218.0" y1="285.0" x2="218.0" y2="33.0" stroke="#eef2f6" stroke-width="1"/>
<text x="218.0" y="300.0" font-size="10" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">4</text>
<line x1="260.0" y1="285.0" x2="260.0" y2="33.0" stroke="#eef2f6" stroke-width="1"/>
<text x="260.0" y="300.0" font-size="10" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">5</text>
<line x1="302.0" y1="285.0" x2="302.0" y2="33.0" stroke="#eef2f6" stroke-width="1"/>
<text x="302.0" y="300.0" font-size="10" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">6</text>
<line x1="344.0" y1="285.0" x2="344.0" y2="33.0" stroke="#eef2f6" stroke-width="1"/>
<text x="344.0" y="300.0" font-size="10" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">7</text>
<line x1="386.0" y1="285.0" x2="386.0" y2="33.0" stroke="#eef2f6" stroke-width="1"/>
<text x="386.0" y="300.0" font-size="10" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">8</text>
<line x1="428.0" y1="285.0" x2="428.0" y2="33.0" stroke="#eef2f6" stroke-width="1"/>
<text x="428.0" y="300.0" font-size="10" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">9</text>
<line x1="50.0" y1="285.0" x2="428.0" y2="285.0" stroke="#eef2f6" stroke-width="1"/>
<text x="43.0" y="289.0" font-size="10" fill="#1f2933" text-anchor="end" font-weight="normal" font-family="system-ui, sans-serif">0</text>
<line x1="50.0" y1="243.0" x2="428.0" y2="243.0" stroke="#eef2f6" stroke-width="1"/>
<text x="43.0" y="247.0" font-size="10" fill="#1f2933" text-anchor="end" font-weight="normal" font-family="system-ui, sans-serif">1</text>
<line x1="50.0" y1="201.0" x2="428.0" y2="201.0" stroke="#eef2f6" stroke-width="1"/>
<text x="43.0" y="205.0" font-size="10" fill="#1f2933" text-anchor="end" font-weight="normal" font-family="system-ui, sans-serif">2</text>
<line x1="50.0" y1="159.0" x2="428.0" y2="159.0" stroke="#eef2f6" stroke-width="1"/>
<text x="43.0" y="163.0" font-size="10" fill="#1f2933" text-anchor="end" font-weight="normal" font-family="system-ui, sans-serif">3</text>
<line x1="50.0" y1="117.0" x2="428.0" y2="117.0" stroke="#eef2f6" stroke-width="1"/>
<text x="43.0" y="121.0" font-size="10" fill="#1f2933" text-anchor="end" font-weight="normal" font-family="system-ui, sans-serif">4</text>
<line x1="50.0" y1="75.0" x2="428.0" y2="75.0" stroke="#eef2f6" stroke-width="1"/>
<text x="43.0" y="79.0" font-size="10" fill="#1f2933" text-anchor="end" font-weight="normal" font-family="system-ui, sans-serif">5</text>
<line x1="50.0" y1="33.0" x2="428.0" y2="33.0" stroke="#eef2f6" stroke-width="1"/>
<text x="43.0" y="37.0" font-size="10" fill="#1f2933" text-anchor="end" font-weight="normal" font-family="system-ui, sans-serif">6</text>
<line x1="92.0" y1="243.0" x2="386.0" y2="243.0" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6 4"/>
<line x1="386.0" y1="243.0" x2="386.0" y2="75.0" stroke="#059669" stroke-width="2" stroke-dasharray="6 4"/>
<line x1="92.0" y1="243.0" x2="386.0" y2="75.0" stroke="#dc2626" stroke-width="2.5"/>
<circle cx="92.0" cy="243.0" r="4.5" fill="#1f2933" stroke="none"/>
<circle cx="386.0" cy="75.0" r="4.5" fill="#1f2933" stroke="none"/>
<text x="86.0" y="231.0" font-size="11" fill="#1f2933" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">(x1, y1) = (1, 1)</text>
<text x="376.0" y="63.0" font-size="11" fill="#1f2933" text-anchor="end" font-weight="bold" font-family="system-ui, sans-serif">(x2, y2) = (8, 5)</text>
<text x="239.0" y="265.0" font-size="12" fill="#f59e0b" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">Δx = x2 − x1 = 7</text>
<text x="378.0" y="188.2" font-size="12" fill="#059669" text-anchor="end" font-weight="bold" font-family="system-ui, sans-serif">Δy = y2 − y1 = 4</text>
<text x="235.0" y="322.0" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">m = Δy / Δx = 4 / 7 ≈ 0.57: y climbs 0.57 for every 1 step in x.</text>
</svg>
