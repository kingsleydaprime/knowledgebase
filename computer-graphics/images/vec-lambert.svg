<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" width="680" height="280" role="img">
<title>Diffuse (Lambert) lighting, brightness = max(0, N dot L). Light overhead: 1. Light 60 degrees up: 0.866. Light 30 degrees up: 0.5. Light below the surface: N dot L is negative, so the brightness is 0</title>
<rect width="100%" height="100%" rx="8" fill="#ffffff"/>
<rect x="20.0" y="170.0" width="140.0" height="14.0" fill="rgb(255,240,150)" stroke="#1f2933" stroke-width="1" fill-opacity="1"/>
<defs><marker id="m1f2933" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker></defs>
<line x1="90.0" y1="170.0" x2="90.0" y2="100.0" stroke="#1f2933" stroke-width="2.4" marker-end="url(#m1f2933)"/>
<text x="100.0" y="108.0" font-size="13" fill="#1f2933" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">N</text>
<defs><marker id="mf59e0b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker></defs>
<line x1="90.0" y1="170.0" x2="90.0" y2="100.0" stroke="#f59e0b" stroke-width="2.4" marker-end="url(#mf59e0b)"/>
<text x="90.0" y="92.0" font-size="13" fill="#f59e0b" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">L</text>
<text x="90.0" y="34.0" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">overhead</text>
<text x="90.0" y="212.0" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">N · L = 1.000</text>
<text x="90.0" y="232.0" font-size="12" fill="#dc2626" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">brightness 1</text>
<rect x="188.0" y="170.0" width="140.0" height="14.0" fill="rgb(226,213,133)" stroke="#1f2933" stroke-width="1" fill-opacity="1"/>
<line x1="258.0" y1="170.0" x2="258.0" y2="100.0" stroke="#1f2933" stroke-width="2.4" marker-end="url(#m1f2933)"/>
<text x="268.0" y="108.0" font-size="13" fill="#1f2933" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">N</text>
<line x1="258.0" y1="170.0" x2="293.0" y2="109.4" stroke="#f59e0b" stroke-width="2.4" marker-end="url(#mf59e0b)"/>
<text x="299.0" y="103.0" font-size="13" fill="#f59e0b" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">L</text>
<text x="258.0" y="34.0" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">60° up</text>
<text x="258.0" y="212.0" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">N · L = 0.866</text>
<text x="258.0" y="232.0" font-size="12" fill="#dc2626" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">brightness 0.866</text>
<rect x="356.0" y="170.0" width="140.0" height="14.0" fill="rgb(147,140,90)" stroke="#1f2933" stroke-width="1" fill-opacity="1"/>
<line x1="426.0" y1="170.0" x2="426.0" y2="100.0" stroke="#1f2933" stroke-width="2.4" marker-end="url(#m1f2933)"/>
<text x="436.0" y="108.0" font-size="13" fill="#1f2933" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">N</text>
<line x1="426.0" y1="170.0" x2="486.6" y2="135.0" stroke="#f59e0b" stroke-width="2.4" marker-end="url(#mf59e0b)"/>
<text x="497.0" y="133.0" font-size="13" fill="#f59e0b" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">L</text>
<text x="426.0" y="34.0" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">30° up</text>
<text x="426.0" y="212.0" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">N · L = 0.500</text>
<text x="426.0" y="232.0" font-size="12" fill="#dc2626" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">brightness 0.5</text>
<rect x="524.0" y="170.0" width="140.0" height="14.0" fill="rgb(40,40,30)" stroke="#1f2933" stroke-width="1" fill-opacity="1"/>
<line x1="594.0" y1="170.0" x2="594.0" y2="100.0" stroke="#1f2933" stroke-width="2.4" marker-end="url(#m1f2933)"/>
<text x="604.0" y="108.0" font-size="13" fill="#1f2933" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">N</text>
<line x1="594.0" y1="170.0" x2="659.8" y2="193.9" stroke="#f59e0b" stroke-width="2.4" marker-end="url(#mf59e0b)"/>
<text x="671.1" y="202.0" font-size="13" fill="#f59e0b" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">L</text>
<text x="594.0" y="34.0" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">below the surface</text>
<text x="594.0" y="212.0" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">N · L = −0.342</text>
<text x="594.0" y="232.0" font-size="12" fill="#dc2626" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">brightness 0</text>
<text x="340.0" y="266.0" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">The surface colour (strip) is the material colour times max(0, N · L).</text>
</svg>
