<text xml:space="preserve" text-anchor="middle" x="80" y="-121.85" font-family="Helvetica,Arial,sans-serif" font-size="12.00">tens, no carry (c2 = 0)</text>
<text xml:space="preserve" text-anchor="middle" x="80" y="-109.1" font-family="Helvetica,Arial,sans-serif" font-size="12.00">E + O = E</text>
<text xml:space="preserve" text-anchor="middle" x="80" y="-96.35" font-family="Helvetica,Arial,sans-serif" font-size="12.00">so O = 0</text>
</g>
