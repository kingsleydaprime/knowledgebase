<path fill="#f3f4f6" stroke="#9ca3af" d="M361.12,-228.25C361.12,-228.25 252.88,-228.25 252.88,-228.25 246.88,-228.25 240.88,-222.25 240.88,-216.25 240.88,-216.25 240.88,-181.25 240.88,-181.25 240.88,-175.25 246.88,-169.25 252.88,-169.25 252.88,-169.25 361.12,-169.25 361.12,-169.25 367.12,-169.25 373.12,-175.25 373.12,-181.25 373.12,-181.25 373.12,-216.25 373.12,-216.25 373.12,-222.25 367.12,-228.25 361.12,-228.25"/>
