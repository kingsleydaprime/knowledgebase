<text xml:space="preserve" text-anchor="middle" x="307" y="-200.1" font-family="Helvetica,Arial,sans-serif" font-size="12.00" fill="#6b7280">1 + E = R + 10</text>
<text xml:space="preserve" text-anchor="middle" x="307" y="-187.35" font-family="Helvetica,Arial,sans-serif" font-size="12.00" fill="#6b7280">E = 9, R = 0</text>
<text xml:space="preserve" text-anchor="middle" x="307" y="-174.6" font-family="Helvetica,Arial,sans-serif" font-size="12.00" fill="#6b7280">R leads a number: fail</text>
</g>
