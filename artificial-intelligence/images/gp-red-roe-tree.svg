<text xml:space="preserve" text-anchor="middle" x="225" y="-109.1" font-family="Helvetica,Arial,sans-serif" font-size="12.00" fill="#6b7280">E + O = E + 10</text>
<text xml:space="preserve" text-anchor="middle" x="225" y="-96.35" font-family="Helvetica,Arial,sans-serif" font-size="12.00" fill="#6b7280">O = 10: fail</text>
</g>
