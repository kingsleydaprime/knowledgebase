<path fill="#d1fae5" stroke="#1f2933" d="M148,-59C148,-59 12,-59 12,-59 6,-59 0,-53 0,-47 0,-47 0,-12 0,-12 0,-6 6,0 12,0 12,0 148,0 148,0 154,0 160,-6 160,-12 160,-12 160,-47 160,-47 160,-53 154,-59 148,-59"/>
<text xml:space="preserve" text-anchor="middle" x="80" y="-43.6" font-family="Helvetica,Arial,sans-serif" font-size="12.00">hundreds, carry out = D = 1</text>
<text xml:space="preserve" text-anchor="middle" x="80" y="-30.85" font-family="Helvetica,Arial,sans-serif" font-size="12.00">R + R = E + 10</text>
<text xml:space="preserve" text-anchor="middle" x="80" y="-18.1" font-family="Helvetica,Arial,sans-serif" font-size="12.00">2(E + 1) = E + 10</text>
<text xml:space="preserve" text-anchor="middle" x="80" y="-5.35" font-family="Helvetica,Arial,sans-serif" font-size="12.00">E = 8, R = 9</text>
