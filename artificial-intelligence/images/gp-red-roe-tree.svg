<text xml:space="preserve" text-anchor="middle" x="229" y="-279.6" font-family="Helvetica,Arial,sans-serif" font-size="12.00">RED + ROE = DEER</text>
<text xml:space="preserve" text-anchor="middle" x="229" y="-266.85" font-family="Helvetica,Arial,sans-serif" font-size="12.00">D = 1 (the final carry)</text>
</g>
<g id="node2" class="node">
<path fill="#dbeafe" stroke="#1f2933" d="M206.88,-221.88C206.88,-221.88 97.12,-221.88 97.12,-221.88 91.12,-221.88 85.12,-215.88 85.12,-209.88 85.12,-209.88 85.12,-187.62 85.12,-187.62 85.12,-181.62 91.12,-175.62 97.12,-175.62 97.12,-175.62 206.88,-175.62 206.88,-175.62 212.88,-175.62 218.88,-181.62 218.88,-187.62 218.88,-187.62 218.88,-209.88 218.88,-209.88 218.88,-215.88 212.88,-221.88 206.88,-221.88"/>
<text xml:space="preserve" text-anchor="middle" x="152" y="-206.47" font-family="Helvetica,Arial,sans-serif" font-size="12.00">units, no carry (c1 = 0)</text>
<text xml:space="preserve" text-anchor="middle" x="152" y="-193.72" font-family="Helvetica,Arial,sans-serif" font-size="12.00">1 + E = R</text>
<text xml:space="preserve" text-anchor="middle" x="152" y="-180.97" font-family="Helvetica,Arial,sans-serif" font-size="12.00">so R = E + 1</text>
</g>
