<title>The search tree for RED plus ROE equals DEER, branching on the carry out of each column: D is 1; the units column with a carry fails because R would be 0; with no carry R is E plus 1; the tens column with a carry fails because O would be 10; with no carry O is 0; the hundreds column then gives E equals 8 and R equals 9</title>
<g id="graph0" class="graph" transform="scale(1 1) rotate(0) translate(18 314.25)">
<polygon fill="white" stroke="none" points="-18,18 -18,-314.25 391.12,-314.25 391.12,18 -18,18"/>
