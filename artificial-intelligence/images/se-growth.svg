<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img">
<title>Bar chart of nodes generated by breadth-first search with branching factor 10: 10 at depth 1, 100 at depth 2, 1,000 at depth 3, 10,000 at depth 4, 100,000 at depth 5, 1,000,000 at depth 6, on a log scale</title>
<rect width="100%" height="100%" rx="8" fill="#ffffff"/>
<rect x="60.0" y="215.0" width="60.0" height="35.0" fill="#dbeafe" stroke="#1f2933" stroke-width="1" fill-opacity="1"/>
<text x="90.0" y="207.0" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">10</text>
<text x="90.0" y="270.0" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">depth 1</text>
<rect x="155.0" y="180.0" width="60.0" height="70.0" fill="#dbeafe" stroke="#1f2933" stroke-width="1" fill-opacity="1"/>
<text x="185.0" y="172.0" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">100</text>
<text x="185.0" y="270.0" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">depth 2</text>
<rect x="250.0" y="145.0" width="60.0" height="105.0" fill="#dbeafe" stroke="#1f2933" stroke-width="1" fill-opacity="1"/>
<text x="280.0" y="137.0" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">1,000</text>
<text x="280.0" y="270.0" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">depth 3</text>
<rect x="345.0" y="110.0" width="60.0" height="140.0" fill="#dbeafe" stroke="#1f2933" stroke-width="1" fill-opacity="1"/>
<text x="375.0" y="102.0" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">10,000</text>
<text x="375.0" y="270.0" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">depth 4</text>
<rect x="440.0" y="75.0" width="60.0" height="175.0" fill="#dbeafe" stroke="#1f2933" stroke-width="1" fill-opacity="1"/>
<text x="470.0" y="67.0" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">100,000</text>
<text x="470.0" y="270.0" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">depth 5</text>
<rect x="535.0" y="40.0" width="60.0" height="210.0" fill="#dbeafe" stroke="#1f2933" stroke-width="1" fill-opacity="1"/>
<text x="565.0" y="32.0" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">1,000,000</text>
<text x="565.0" y="270.0" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">depth 6</text>
<line x1="40.0" y1="250.0" x2="620.0" y2="250.0" stroke="#1f2933" stroke-width="1.5"/>
<text x="320.0" y="285.0" font-size="12" fill="#374151" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">nodes at each depth when b = 10 (each bar is 10 times the one before)</text>
</svg>
