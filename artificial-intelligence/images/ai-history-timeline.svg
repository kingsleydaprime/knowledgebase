<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 230" width="760" height="230" role="img">
<title>A timeline of AI: the Turing test 1950, Dartmouth 1956, early game playing and theorem proving in the 1950s and 60s, the Lighthill report 1973, expert systems in the 1970s and 80s, neural nets return 1986, and data-driven AI from the 1990s</title>
<rect width="100%" height="100%" rx="8" fill="#ffffff"/>
<line x1="40.0" y1="120.0" x2="720.0" y2="120.0" stroke="#1f2933" stroke-width="2.5"/>
<circle cx="94.0" cy="120.0" r="6" fill="#059669" stroke="none"/>
<line x1="94.0" y1="120.0" x2="94.0" y2="82.0" stroke="#9ca3af" stroke-width="1"/>
<text x="94.0" y="58.0" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">1950</text>
<text x="94.0" y="74.0" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">Turing test</text>
<text x="94.0" y="88.0" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">paper</text>
<circle cx="146.8" cy="120.0" r="6" fill="#059669" stroke="none"/>
<line x1="146.8" y1="120.0" x2="146.8" y2="158.0" stroke="#9ca3af" stroke-width="1"/>
<text x="146.8" y="182.0" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">1956</text>
<text x="146.8" y="198.0" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">Dartmouth</text>
<text x="146.8" y="212.0" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">conference</text>
<circle cx="182.0" cy="120.0" r="6" fill="#059669" stroke="none"/>
<line x1="182.0" y1="120.0" x2="182.0" y2="82.0" stroke="#9ca3af" stroke-width="1"/>
<text x="182.0" y="58.0" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">1960</text>
<text x="182.0" y="74.0" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">game playing,</text>
<text x="182.0" y="88.0" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">theorem proving</text>
<circle cx="296.4" cy="120.0" r="6" fill="#f59e0b" stroke="none"/>
<line x1="296.4" y1="120.0" x2="296.4" y2="158.0" stroke="#9ca3af" stroke-width="1"/>
<text x="296.4" y="182.0" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">1973</text>
<text x="296.4" y="198.0" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">Lighthill</text>
<text x="296.4" y="212.0" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">report (winter)</text>
<circle cx="358.0" cy="120.0" r="6" fill="#059669" stroke="none"/>
<line x1="358.0" y1="120.0" x2="358.0" y2="82.0" stroke="#9ca3af" stroke-width="1"/>
<text x="358.0" y="58.0" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">1980</text>
<text x="358.0" y="74.0" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">expert systems</text>
<text x="358.0" y="88.0" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">boom</text>
<circle cx="410.8" cy="120.0" r="6" fill="#059669" stroke="none"/>
<line x1="410.8" y1="120.0" x2="410.8" y2="158.0" stroke="#9ca3af" stroke-width="1"/>
<text x="410.8" y="182.0" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">1986</text>
<text x="410.8" y="198.0" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">neural nets</text>
<text x="410.8" y="212.0" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">return</text>
<circle cx="507.6" cy="120.0" r="6" fill="#059669" stroke="none"/>
<line x1="507.6" y1="120.0" x2="507.6" y2="82.0" stroke="#9ca3af" stroke-width="1"/>
<text x="507.6" y="58.0" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">1997</text>
<text x="507.6" y="74.0" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">Deep Blue</text>
<text x="507.6" y="88.0" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">beats Kasparov</text>
<circle cx="639.6" cy="120.0" r="6" fill="#059669" stroke="none"/>
<line x1="639.6" y1="120.0" x2="639.6" y2="158.0" stroke="#9ca3af" stroke-width="1"/>
<text x="639.6" y="182.0" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">2012</text>
<text x="639.6" y="198.0" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">deep learning</text>
<text x="639.6" y="212.0" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">takes over</text>
</svg>
