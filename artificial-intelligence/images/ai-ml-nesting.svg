<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" width="560" height="330" role="img">
<title>Three nested boxes: Artificial intelligence contains machine learning, which contains deep learning; search and game playing sit inside AI but outside machine learning</title>
<rect width="100%" height="100%" rx="8" fill="#ffffff"/>
<rect x="20.0" y="20.0" width="520.0" height="290.0" fill="#e5e7eb" stroke="#1f2933" stroke-width="1.2" fill-opacity="1"/>
<text x="34.0" y="46.0" font-size="15" fill="#1f2933" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">Artificial intelligence</text>
<text x="34.0" y="66.0" font-size="12" fill="#1f2933" text-anchor="start" font-weight="normal" font-family="system-ui, sans-serif">machines doing things that need intelligence</text>
<rect x="180.0" y="90.0" width="340.0" height="200.0" fill="#dbeafe" stroke="#1f2933" stroke-width="1.2" fill-opacity="1"/>
<text x="194.0" y="116.0" font-size="15" fill="#1f2933" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">Machine learning</text>
<text x="194.0" y="136.0" font-size="12" fill="#1f2933" text-anchor="start" font-weight="normal" font-family="system-ui, sans-serif">learning rules from data</text>
<rect x="300.0" y="170.0" width="200.0" height="100.0" fill="#d1fae5" stroke="#1f2933" stroke-width="1.2" fill-opacity="1"/>
<text x="314.0" y="196.0" font-size="15" fill="#1f2933" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">Deep learning</text>
<text x="314.0" y="216.0" font-size="12" fill="#1f2933" text-anchor="start" font-weight="normal" font-family="system-ui, sans-serif">many-layered neural nets</text>
<text x="36.0" y="120.0" font-size="13" fill="#b45309" text-anchor="start" font-weight="normal" font-family="system-ui, sans-serif">• search</text>
<text x="36.0" y="146.0" font-size="13" fill="#b45309" text-anchor="start" font-weight="normal" font-family="system-ui, sans-serif">• game playing</text>
<text x="36.0" y="172.0" font-size="13" fill="#b45309" text-anchor="start" font-weight="normal" font-family="system-ui, sans-serif">• planning</text>
<text x="36.0" y="198.0" font-size="13" fill="#b45309" text-anchor="start" font-weight="normal" font-family="system-ui, sans-serif">• logic and rules</text>
</svg>
