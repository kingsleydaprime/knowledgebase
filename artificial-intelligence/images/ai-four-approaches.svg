<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 330" width="620" height="330" role="img">
<title>The four approaches to AI: think like humans, think rationally, act like humans, act rationally</title>
<rect width="100%" height="100%" rx="8" fill="#ffffff"/>
<text x="260.0" y="40.0" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">Like a human</text>
<text x="480.0" y="40.0" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">Rationally (the right way)</text>
<text x="75.0" y="120.0" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">Thinking</text>
<text x="75.0" y="230.0" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">Acting</text>
<rect x="154.0" y="64.0" width="212.0" height="102.0" fill="#e5e7eb" stroke="#1f2933" stroke-width="1.2" fill-opacity="1"/>
<text x="260.0" y="111.0" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">Think like humans</text>
<text x="260.0" y="133.0" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">cognitive modelling</text>
<rect x="374.0" y="64.0" width="212.0" height="102.0" fill="#e5e7eb" stroke="#1f2933" stroke-width="1.2" fill-opacity="1"/>
<text x="480.0" y="111.0" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">Think rationally</text>
<text x="480.0" y="133.0" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">"laws of thought" (logic)</text>
<rect x="154.0" y="174.0" width="212.0" height="102.0" fill="#dbeafe" stroke="#1f2933" stroke-width="1.2" fill-opacity="1"/>
<text x="260.0" y="221.0" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">Act like humans</text>
<text x="260.0" y="243.0" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">the Turing test</text>
<rect x="374.0" y="174.0" width="212.0" height="102.0" fill="#d1fae5" stroke="#1f2933" stroke-width="1.2" fill-opacity="1"/>
<text x="480.0" y="221.0" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">Act rationally</text>
<text x="480.0" y="243.0" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">the rational agent</text>
<rect x="372.0" y="172.0" width="216.0" height="106.0" fill="none" stroke="#f59e0b" stroke-width="3" fill-opacity="1"/>
<text x="480.0" y="310.0" font-size="12" fill="#b45309" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">the approach this subject takes</text>
</svg>
