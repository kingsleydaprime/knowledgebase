<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 230" width="260" height="230" role="img">
<title>A tic-tac-toe board with O in the top-left corner and X in the centre; X has 5 open lines, O has 4, so the evaluation is 5 minus 4, which is 1</title>
<rect width="100%" height="100%" rx="8" fill="#ffffff"/>
<line x1="100.0" y1="20.0" x2="100.0" y2="200.0" stroke="#1f2933" stroke-width="3"/>
<line x1="40.0" y1="80.0" x2="220.0" y2="80.0" stroke="#1f2933" stroke-width="3"/>
<line x1="160.0" y1="20.0" x2="160.0" y2="200.0" stroke="#1f2933" stroke-width="3"/>
<line x1="40.0" y1="140.0" x2="220.0" y2="140.0" stroke="#1f2933" stroke-width="3"/>
<text x="70.0" y="64.0" font-size="40" fill="#b45309" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">O</text>
<text x="130.0" y="124.0" font-size="40" fill="#1d4ed8" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">X</text>
<text x="130.0" y="222.0" font-size="12" fill="#374151" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">X: 5 open lines, O: 4, Eval = 1</text>
</svg>
