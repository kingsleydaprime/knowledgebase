<svg role="img" width="821pt" height="297pt"
 viewBox="0.00 0.00 821.00 297.00" xmlns="http://www.w3.org/2000/svg">
<title>A three-question ethics check for a study. First: does it involve people or animals, through surveys, interviews, tests, photos or their data? If yes, get ethics-committee approval and informed consent before collecting anything. Second: does it use data someone else owns, such as a weather service, a website or a dataset? If yes, check its licence or terms and credit it in the paper. Third: do you gain if one answer wins, for example because you work for one of the app companies or someone pays you? If yes, declare it as a conflict of interest. After all three, write the answers in plan.md under Ethics and carry on</title>
