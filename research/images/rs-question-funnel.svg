<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 330" width="660" height="330" role="img">
<title>The funnel from topic to hypothesis, using the weather study. Top, widest: the topic, weather apps in Lagos, which is a direction, not something you can answer. Middle: the question, how often is each free app right about tomorrow's rain, over four weeks of rainy season, which you can answer. Bottom, narrowest: the hypothesis, each app is right about rain more often than simply guessing tomorrow will be like today, a predicted answer that could turn out false</title>
<rect width="100%" height="100%" rx="8" fill="#ffffff"/>
<polygon points="10.0,15 650.0,15 600.0,110 60.0,110" fill="#dbeafe" stroke="#1f2933" stroke-width="1.4"/>
<text x="330.0" y="41.0" font-size="15" fill="#2563eb" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">topic</text>
<text x="330.0" y="65.0" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">weather apps in Lagos</text>
<text x="330.0" y="87.0" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">a direction: you can't answer it</text>
<polygon points="60.0,120 600.0,120 550.0,215 110.0,215" fill="#d1fae5" stroke="#1f2933" stroke-width="1.4"/>
<text x="330.0" y="146.0" font-size="15" fill="#2563eb" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">question</text>
<text x="330.0" y="170.0" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">how often is each app right about tomorrow's rain, over 4 weeks?</text>
<text x="330.0" y="192.0" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">answerable: you know when you're done</text>
<polygon points="110.0,225 550.0,225 510.0,320 150.0,320" fill="#fef3c7" stroke="#1f2933" stroke-width="1.4"/>
<text x="330.0" y="251.0" font-size="15" fill="#2563eb" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">hypothesis</text>
<text x="330.0" y="275.0" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">each app beats "tomorrow will be like today"</text>
<text x="330.0" y="297.0" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">a predicted answer that could be wrong</text>
</svg>
