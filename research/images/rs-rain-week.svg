<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 300" width="660" height="300" role="img">
<title>One week of the weather study, scored for rain. For each day, Monday to Sunday, the top row shows whether the app said rain (its chance of rain was 50 percent or more) and the second row whether the rain gauge caught 1 millimetre or more. The app was right on Monday, Wednesday, Thursday, Saturday and Sunday, five days out of seven, a hit rate of 71 percent. On Tuesday it said rain and none fell, a false alarm; on Friday it said dry and rain fell, a missed rain</title>
