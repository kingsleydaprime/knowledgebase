<title>The sections of a paper, top to bottom, each with the file in your study folder that feeds it and the order to write it in. Title: written last, ninth. Abstract: the whole paper shrunk, eighth. Introduction: from journal.md and the gap in lit-review.md, seventh. Related work: from lit-review.md, fourth. Method: from the Method and Ethics parts of plan.md, second. Results: from results.md and the analysis output, first. Discussion: from the boring explanations and threats in results.md, third. Conclusion: from the claims in results.md, sixth. Acknowledgements from credits.md and References from the checked lit-review.md, both fifth. You read a paper top to bottom but write it from the middle out</title>
