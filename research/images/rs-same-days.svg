<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 300" width="660" height="300" role="img">
<title>Two ways to schedule the weather study over four weeks. Top, unfair: app A is read in week 1, app B in week 2 and app C in week 3, so each app faces different weather and a stormy week can make one app look bad. Bottom, fair: all three apps are read every evening for all four weeks, in a shuffled order, so every app faces exactly the same weather and the only difference left is the app</title>
<rect width="100%" height="100%" rx="8" fill="#ffffff"/>
<text x="20.0" y="30.0" font-size="14" fill="#dc2626" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">unfair: one app per week</text>
<rect x="40.0" y="45.0" width="140.0" height="50.0" fill="#fee2e2" stroke="#6b7280" stroke-width="1" fill-opacity="1"/>
<text x="110.0" y="70.0" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">week 1: app A</text>
<text x="110.0" y="87.0" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">dry spell</text>
<rect x="190.0" y="45.0" width="140.0" height="50.0" fill="#fee2e2" stroke="#6b7280" stroke-width="1" fill-opacity="1"/>
<text x="260.0" y="70.0" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">week 2: app B</text>
<text x="260.0" y="87.0" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">storms</text>
<rect x="340.0" y="45.0" width="140.0" height="50.0" fill="#fee2e2" stroke="#6b7280" stroke-width="1" fill-opacity="1"/>
<text x="410.0" y="70.0" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">week 3: app C</text>
<text x="410.0" y="87.0" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">mixed</text>
<rect x="490.0" y="45.0" width="140.0" height="50.0" fill="#f3f4f6" stroke="#6b7280" stroke-width="1" fill-opacity="1"/>
<text x="560.0" y="70.0" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">week 4: —</text>
<text x="560.0" y="87.0" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif"></text>
<text x="20.0" y="140.0" font-size="14" fill="#059669" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">fair: every app, every day</text>
<rect x="40.0" y="155.0" width="140.0" height="26.0" fill="#d1fae5" stroke="#6b7280" stroke-width="1" fill-opacity="1"/>
<text x="110.0" y="173.0" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">week 1: app A</text>
<rect x="40.0" y="185.0" width="140.0" height="26.0" fill="#d1fae5" stroke="#6b7280" stroke-width="1" fill-opacity="1"/>
<text x="110.0" y="203.0" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">week 1: app B</text>
<rect x="40.0" y="215.0" width="140.0" height="26.0" fill="#d1fae5" stroke="#6b7280" stroke-width="1" fill-opacity="1"/>
<text x="110.0" y="233.0" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">week 1: app C</text>
<rect x="190.0" y="155.0" width="140.0" height="26.0" fill="#d1fae5" stroke="#6b7280" stroke-width="1" fill-opacity="1"/>
<text x="260.0" y="173.0" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">week 2: app A</text>
<rect x="190.0" y="185.0" width="140.0" height="26.0" fill="#d1fae5" stroke="#6b7280" stroke-width="1" fill-opacity="1"/>
<text x="260.0" y="203.0" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">week 2: app B</text>
<rect x="190.0" y="215.0" width="140.0" height="26.0" fill="#d1fae5" stroke="#6b7280" stroke-width="1" fill-opacity="1"/>
<text x="260.0" y="233.0" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">week 2: app C</text>
<rect x="340.0" y="155.0" width="140.0" height="26.0" fill="#d1fae5" stroke="#6b7280" stroke-width="1" fill-opacity="1"/>
<text x="410.0" y="173.0" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">week 3: app A</text>
<rect x="340.0" y="185.0" width="140.0" height="26.0" fill="#d1fae5" stroke="#6b7280" stroke-width="1" fill-opacity="1"/>
<text x="410.0" y="203.0" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">week 3: app B</text>
<rect x="340.0" y="215.0" width="140.0" height="26.0" fill="#d1fae5" stroke="#6b7280" stroke-width="1" fill-opacity="1"/>
<text x="410.0" y="233.0" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">week 3: app C</text>
<rect x="490.0" y="155.0" width="140.0" height="26.0" fill="#d1fae5" stroke="#6b7280" stroke-width="1" fill-opacity="1"/>
<text x="560.0" y="173.0" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">week 4: app A</text>
<rect x="490.0" y="185.0" width="140.0" height="26.0" fill="#d1fae5" stroke="#6b7280" stroke-width="1" fill-opacity="1"/>
<text x="560.0" y="203.0" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">week 4: app B</text>
<rect x="490.0" y="215.0" width="140.0" height="26.0" fill="#d1fae5" stroke="#6b7280" stroke-width="1" fill-opacity="1"/>
<text x="560.0" y="233.0" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">week 4: app C</text>
<text x="330.0" y="268.0" font-size="12.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">same weather for all three · read in a shuffled order each evening</text>
<text x="330.0" y="288.0" font-size="13" fill="#059669" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">the only thing left that differs is the app</text>
</svg>
