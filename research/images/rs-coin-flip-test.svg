<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" width="680" height="340" role="img">
<title>The coin-flip test. If app B and the guess were really equally good, each disagreement day would be a coin flip. Left, 4 weeks: the bars show how often each number of wins out of 9 would happen by luck; the orange bars, 7 or more wins, add up to 46 in 512, about 0.09, so 7 out of 9 happens by luck about 9 times in 100. Right, 8 weeks with the same pattern, 14 wins out of 18: the orange tail, 14 or more, adds up to about 0.015, under 2 times in 100, so luck is a much poorer explanation</title>
