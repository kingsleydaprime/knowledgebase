<line x1="80.0" y1="212.5" x2="630.0" y2="212.5" stroke="#e5e7eb" stroke-width="1"/>
<text x="70.0" y="216.5" font-size="11.5" fill="#6b7280" text-anchor="end" font-weight="normal" font-family="system-ui, sans-serif">25%</text>
