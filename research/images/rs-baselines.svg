<text x="460.0" y="290.0" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">app B</text>
<text x="460.0" y="307.0" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">forecast app</text>
<rect x="530.0" y="145.8" width="70.0" height="124.2" fill="#dc2626" stroke="none" stroke-width="1" fill-opacity="0.8"/>
