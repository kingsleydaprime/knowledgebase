<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 330" width="660" height="330" role="img">
<title>An example of four weeks of results, 28 days, compared with two simple baselines. Always saying rain is right on the 16 rainy days, 57 percent. Guessing tomorrow will be like today is right on 17 days, 61 percent. App A is right on 18 days, 64 percent, barely above the guesses. App B is right on 22 days, 79 percent, clearly better. App C is right on 15 days, 54 percent, worse than simply always saying rain. A dashed line marks the best simple guess, 61 percent</title>
<rect width="100%" height="100%" rx="8" fill="#ffffff"/>
