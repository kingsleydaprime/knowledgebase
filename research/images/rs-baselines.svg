<text x="565.0" y="185.8" font-size="12.5" fill="#ffffff" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">54%</text>
<text x="565.0" y="290.0" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">app C</text>
<text x="565.0" y="307.0" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">forecast app</text>
<text x="632.0" y="123.7" font-size="11.5" fill="#f59e0b" text-anchor="end" font-weight="bold" font-family="system-ui, sans-serif">best guess</text>
<text x="330.0" y="22.0" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">example: hit rate over 28 rainy-season days</text>
