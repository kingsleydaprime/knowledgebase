<text x="70.0" y="101.5" font-size="11.5" fill="#6b7280" text-anchor="end" font-weight="normal" font-family="system-ui, sans-serif">75%</text>
<line x1="80.0" y1="40.0" x2="630.0" y2="40.0" stroke="#e5e7eb" stroke-width="1"/>
<text x="70.0" y="44.0" font-size="11.5" fill="#6b7280" text-anchor="end" font-weight="normal" font-family="system-ui, sans-serif">100%</text>
<line x1="80.0" y1="129.7" x2="630.0" y2="129.7" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6 4"/>
<rect x="110.0" y="138.9" width="70.0" height="131.1" fill="#6b7280" stroke="none" stroke-width="1" fill-opacity="0.8"/>
<text x="145.0" y="160.9" font-size="12.5" fill="#ffffff" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">16/28</text>
