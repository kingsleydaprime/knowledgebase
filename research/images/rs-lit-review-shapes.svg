<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 330" width="660" height="330" role="img">
<title>Two ways to write a literature review. Left, a list in date order: Smith 2015 did this, then Okafor 2018, then Lee 2020, then Bello 2023, each described on its own; it shows reading but no understanding, and no gap. Right, the same papers grouped by theme into two boxes, what the groups show together, and an arrow from the themes to the gap: what nobody has done yet, which is what your study does</title>
<rect width="100%" height="100%" rx="8" fill="#ffffff"/>
<text x="160.0" y="26.0" font-size="14" fill="#dc2626" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">a list by date: avoid</text>
<rect x="60.0" y="46.0" width="200.0" height="44.0" fill="#f3f4f6" stroke="#6b7280" stroke-width="1" fill-opacity="1"/>
<text x="160.0" y="73.0" font-size="12.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">Smith 2015 did …</text>
<rect x="60.0" y="108.0" width="200.0" height="44.0" fill="#f3f4f6" stroke="#6b7280" stroke-width="1" fill-opacity="1"/>
<text x="160.0" y="135.0" font-size="12.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">Okafor 2018 did …</text>
<rect x="60.0" y="170.0" width="200.0" height="44.0" fill="#f3f4f6" stroke="#6b7280" stroke-width="1" fill-opacity="1"/>
<text x="160.0" y="197.0" font-size="12.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">Lee 2020 did …</text>
<rect x="60.0" y="232.0" width="200.0" height="44.0" fill="#f3f4f6" stroke="#6b7280" stroke-width="1" fill-opacity="1"/>
<text x="160.0" y="259.0" font-size="12.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">Bello 2023 did …</text>
<line x1="330.0" y1="20.0" x2="330.0" y2="310.0" stroke="#d1d5db" stroke-width="1"/>
<text x="500.0" y="26.0" font-size="14" fill="#059669" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">grouped by theme: do this</text>
<rect x="380.0" y="46.0" width="240.0" height="66.0" fill="#dbeafe" stroke="#2563eb" stroke-width="1" fill-opacity="1"/>
<text x="500.0" y="74.0" font-size="12.5" fill="#2563eb" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">theme A: what they agree on</text>
<text x="500.0" y="94.0" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">Smith 2015, Lee 2020</text>
<rect x="380.0" y="132.0" width="240.0" height="66.0" fill="#dbeafe" stroke="#2563eb" stroke-width="1" fill-opacity="1"/>
<text x="500.0" y="160.0" font-size="12.5" fill="#2563eb" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">theme B: where they differ</text>
<text x="500.0" y="180.0" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">Okafor 2018, Bello 2023</text>
<line x1="500.0" y1="200.0" x2="500.0" y2="236.0" stroke="#f59e0b" stroke-width="2.5"/>
<polygon points="500,244 494,232 506,232" fill="#f59e0b"/>
<rect x="380.0" y="248.0" width="240.0" height="54.0" fill="#fef3c7" stroke="#f59e0b" stroke-width="1" fill-opacity="1"/>
<text x="500.0" y="272.0" font-size="12.5" fill="#f59e0b" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">the gap: nobody has yet …</text>
<text x="500.0" y="290.0" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">which is what your study does</text>
</svg>
