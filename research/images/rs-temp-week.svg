<text x="344.0" y="290.0" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">off by 0°</text>
<line x1="422.0" y1="100.0" x2="422.0" y2="130.0" stroke="#6b7280" stroke-width="4"/>
<circle cx="422.0" cy="100.0" r="7" fill="#2563eb" stroke="none"/>
<circle cx="422.0" cy="130.0" r="7" fill="#f59e0b" stroke="none"/>
<text x="422.0" y="272.0" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">Fri</text>
<text x="422.0" y="290.0" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">off by 1°</text>
<line x1="500.0" y1="130.0" x2="500.0" y2="160.0" stroke="#6b7280" stroke-width="4"/>
<circle cx="500.0" cy="130.0" r="7" fill="#2563eb" stroke="none"/>
<circle cx="500.0" cy="160.0" r="7" fill="#f59e0b" stroke="none"/>
<text x="500.0" y="272.0" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">Sat</text>
<text x="500.0" y="290.0" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">off by 1°</text>
<line x1="578.0" y1="190.0" x2="578.0" y2="220.0" stroke="#6b7280" stroke-width="4"/>
<circle cx="578.0" cy="190.0" r="7" fill="#2563eb" stroke="none"/>
<circle cx="578.0" cy="220.0" r="7" fill="#f59e0b" stroke="none"/>
<text x="578.0" y="272.0" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">Sun</text>
<text x="578.0" y="290.0" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">off by 1°</text>
<circle cx="90.0" cy="18.0" r="6" fill="#2563eb" stroke="none"/>
<text x="102.0" y="22.0" font-size="12" fill="#1f2933" text-anchor="start" font-weight="normal" font-family="system-ui, sans-serif">app forecast high</text>
<circle cx="260.0" cy="18.0" r="6" fill="#f59e0b" stroke="none"/>
<text x="272.0" y="22.0" font-size="12" fill="#1f2933" text-anchor="start" font-weight="normal" font-family="system-ui, sans-serif">measured high</text>
<text x="330.0" y="318.0" font-size="14.5" fill="#059669" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">average error = (2 + 0 + 2 + 0 + 1 + 1 + 1) ÷ 7 = 1.0°C</text>
</svg>
