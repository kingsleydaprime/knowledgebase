<title>The research lifecycle as a loop: curiosity leads to a question; you read the literature and sharpen it into a question or hypothesis; design a method; run experiments or build; analyse honestly (part A of the course, blue); write it up (part B, green); go through peer review, publish, and others build on it (part C, yellow), which raises new questions and starts the loop again</title>
