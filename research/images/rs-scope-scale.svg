<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 230" width="660" height="230" role="img">
<title>Scoping a research question on a scale from too broad to too narrow, using the weather study. Too broad: make weather forecasting accurate, which is a whole career. Just right: how accurate are three free weather apps for next-day rain and temperature in Lagos over four weeks, which one person can answer convincingly. Too narrow: was one app right about rain on one Tuesday, which nobody would care about</title>
<rect width="100%" height="100%" rx="8" fill="#ffffff"/>
<defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#fecaca"/><stop offset="0.5" stop-color="#bbf7d0"/><stop offset="1" stop-color="#fecaca"/></linearGradient></defs>
<rect x="30.0" y="70.0" width="600.0" height="26.0" fill="url(#g)" stroke="#1f2933" stroke-width="1" fill-opacity="1"/>
<polygon points="80,100 72,116 88,116" fill="#dc2626"/>
<text x="80.0" y="60.0" font-size="14" fill="#dc2626" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">too broad</text>
<text x="80.0" y="140.0" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">"Make weather forecasts</text>
<text x="80.0" y="158.0" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">accurate": a career</text>
<polygon points="330,100 322,116 338,116" fill="#059669"/>
<text x="330.0" y="60.0" font-size="14" fill="#059669" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">just right</text>
<text x="330.0" y="140.0" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">"How accurate are 3 free apps</text>
<text x="330.0" y="158.0" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">for next-day rain in Lagos, 4 weeks?"</text>
<polygon points="580,100 572,116 588,116" fill="#dc2626"/>
<text x="580.0" y="60.0" font-size="14" fill="#dc2626" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">too narrow</text>
<text x="580.0" y="140.0" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">"Was one app right about</text>
<text x="580.0" y="158.0" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">rain one Tuesday?": so what?</text>
<text x="330.0" y="205.0" font-size="12.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">aim for one question you can answer convincingly in one focused piece of work</text>
</svg>
