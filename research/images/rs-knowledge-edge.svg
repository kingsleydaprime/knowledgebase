<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 360" width="620" height="360" role="img">
<title>Report versus research. The blue region is everything people already know, and its curved edge is the limit of what anyone knows. A report (the dot inside) gathers and summarises knowledge that is already inside the region. Research pushes the edge out: the small orange bump is a contribution, a piece of new knowledge that was not inside before</title>
<rect width="100%" height="100%" rx="8" fill="#ffffff"/>
<path d="M 0 360 L 0 120 Q 300 20 620 150 L 620 360 Z" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
<text x="130.0" y="300.0" font-size="14" fill="#2563eb" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">everything people already know</text>
<path d="M 385 87 Q 420 30 455 95 Z" fill="#f59e0b" fill-opacity="0.85" stroke="#1f2933" stroke-width="1.4"/>
<text x="470.0" y="40.0" font-size="13" fill="#f59e0b" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">research: a contribution</text>
<text x="470.0" y="58.0" font-size="12" fill="#f59e0b" text-anchor="start" font-weight="normal" font-family="system-ui, sans-serif">pushes the edge out</text>
<line x1="465.0" y1="46.0" x2="432.0" y2="60.0" stroke="#f59e0b" stroke-width="1.6"/>
<circle cx="150.0" cy="220.0" r="4" fill="#6b7280" stroke="none"/>
<circle cx="260.0" cy="190.0" r="4" fill="#6b7280" stroke="none"/>
<circle cx="210.0" cy="250.0" r="4" fill="#6b7280" stroke="none"/>
<circle cx="330.0" cy="240.0" r="4" fill="#6b7280" stroke="none"/>
<circle cx="250.0" cy="215.0" r="9" fill="#059669" stroke="none"/>
<text x="300.0" y="190.0" font-size="12.5" fill="#059669" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">a report: gathers what</text>
<text x="300.0" y="206.0" font-size="12.5" fill="#059669" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">is already known</text>
<line x1="296.0" y1="200.0" x2="262.0" y2="213.0" stroke="#059669" stroke-width="1.4"/>
<text x="24.0" y="150.0" font-size="12.5" fill="#2563eb" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">the edge: the limit of what anyone knows</text>
</svg>
