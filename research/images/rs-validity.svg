<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 300" width="660" height="300" role="img">
<title>The four kinds of validity, each with its question and a threat from the weather study. Internal: is the difference down to the app? Guarded by reading all apps on the same days at the same time. Construct: are you measuring what you mean? Reading the gauge at 7 am means 7 hours of the next day spill into each reading. External: does the result hold beyond your setup? Only one season and one area of Lagos were tested. Statistical: is the difference bigger than luck? Over 28 days, a gap of 2 days may be chance</title>
<rect width="100%" height="100%" rx="8" fill="#ffffff"/>
<rect x="20.0" y="20.0" width="300.0" height="125.0" fill="#ffffff" stroke="#2563eb" stroke-width="2.5" fill-opacity="1"/>
<text x="170.0" y="52.0" font-size="15" fill="#2563eb" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">internal validity</text>
<text x="170.0" y="80.0" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">is the difference down to the app?</text>
<text x="170.0" y="110.0" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">weather study:</text>
<text x="170.0" y="128.0" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">all apps, same days, same time</text>
<rect x="340.0" y="20.0" width="300.0" height="125.0" fill="#ffffff" stroke="#059669" stroke-width="2.5" fill-opacity="1"/>
<text x="490.0" y="52.0" font-size="15" fill="#059669" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">construct validity</text>
<text x="490.0" y="80.0" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">are you measuring what you mean?</text>
<text x="490.0" y="110.0" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">weather study:</text>
<text x="490.0" y="128.0" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">gauge read at 7 am: 7 hours spill over</text>
<rect x="20.0" y="160.0" width="300.0" height="125.0" fill="#ffffff" stroke="#f59e0b" stroke-width="2.5" fill-opacity="1"/>
<text x="170.0" y="192.0" font-size="15" fill="#f59e0b" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">external validity</text>
<text x="170.0" y="220.0" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">does it hold beyond your setup?</text>
<text x="170.0" y="250.0" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">weather study:</text>
<text x="170.0" y="268.0" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">one season, one area of Lagos</text>
<rect x="340.0" y="160.0" width="300.0" height="125.0" fill="#ffffff" stroke="#7c3aed" stroke-width="2.5" fill-opacity="1"/>
<text x="490.0" y="192.0" font-size="15" fill="#7c3aed" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">statistical validity</text>
<text x="490.0" y="220.0" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">is the difference bigger than luck?</text>
<text x="490.0" y="250.0" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">weather study:</text>
<text x="490.0" y="268.0" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">28 days: 2 days' gap may be chance</text>
</svg>
