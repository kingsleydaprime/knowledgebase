<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 260" width="680" height="260" role="img">
<title>Old information before new. Four sentences about the rain gauge, each starting with what the previous one ended on. Sentence one ends with a straight-sided tin; sentence two starts with the tin and ends with roofs and trees; sentence three starts with roofs and trees and ends with catching less rain; sentence four starts with less rain. Arrows link each new idea at the end of a sentence to the start of the next, which is why the paragraph reads smoothly</title>
<rect width="100%" height="100%" rx="8" fill="#ffffff"/>
<text x="24" y="40" font-family="Helvetica,Arial,sans-serif" font-size="13.5" fill="#1f2933" xml:space="preserve"><tspan>We measured rain with a </tspan><tspan font-weight="bold" fill="#2563eb">straight-sided tin</tspan><tspan>.</tspan></text>
<text x="24" y="95" font-family="Helvetica,Arial,sans-serif" font-size="13.5" fill="#1f2933" xml:space="preserve"><tspan font-weight="bold" fill="#2563eb">The tin</tspan><tspan> stood in the open, away from </tspan><tspan font-weight="bold" fill="#2563eb">roofs and trees</tspan><tspan>.</tspan></text>
<text x="24" y="150" font-family="Helvetica,Arial,sans-serif" font-size="13.5" fill="#1f2933" xml:space="preserve"><tspan font-weight="bold" fill="#2563eb">Roofs and trees</tspan><tspan> shelter a gauge, so it </tspan><tspan font-weight="bold" fill="#2563eb">catches less rain</tspan><tspan>.</tspan></text>
<text x="24" y="205" font-family="Helvetica,Arial,sans-serif" font-size="13.5" fill="#1f2933" xml:space="preserve"><tspan font-weight="bold" fill="#2563eb">Less rain</tspan><tspan> in the gauge would make every app look worse on wet days.</tspan></text>
<line x1="261.6" y1="46.0" x2="60.0" y2="79.0" stroke="#f59e0b" stroke-width="1.6" stroke-dasharray="4 3"/>
<polygon points="56,82 66,75 58,72" fill="#f59e0b"/>
<line x1="344.4" y1="101.0" x2="60.0" y2="134.0" stroke="#f59e0b" stroke-width="1.6" stroke-dasharray="4 3"/>
<polygon points="56,137 66,130 58,127" fill="#f59e0b"/>
<line x1="366.0" y1="156.0" x2="60.0" y2="189.0" stroke="#f59e0b" stroke-width="1.6" stroke-dasharray="4 3"/>
<polygon points="56,192 66,185 58,182" fill="#f59e0b"/>
<text x="340.0" y="248.0" font-size="12.5" fill="#6b7280" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">each sentence starts with what the last one ended on: old, then new</text>
</svg>
