<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" role="img">
<title>The three-pass method as a funnel. Pass 1, the flyover, takes 5 to 10 minutes and reads only the title, abstract, introduction, headings, conclusion and figures; you do it for about 100 papers. Pass 2, the walk-through, takes about an hour and reads the whole paper but skips the proofs; about 10 papers get it. Pass 3, the deep dive, takes several hours and rebuilds the paper yourself; only about 3 papers get it</title>
<rect width="100%" height="100%" rx="8" fill="#ffffff"/>
<polygon points="10.0,20 630.0,20 570.0,108 70.0,108" fill="#dbeafe" stroke="#1f2933" stroke-width="1.4"/>
<text x="320.0" y="46.0" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">Pass 1: the flyover  ·  5–10 minutes</text>
<text x="320.0" y="68.0" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">title, abstract, introduction, headings, conclusion, figures</text>
<text x="320.0" y="92.0" font-size="13" fill="#2563eb" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">about 100 papers</text>
<polygon points="70.0,120 570.0,120 510.0,208 130.0,208" fill="#d1fae5" stroke="#1f2933" stroke-width="1.4"/>
<text x="320.0" y="146.0" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">Pass 2: the walk-through  ·  about an hour</text>
<text x="320.0" y="168.0" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">the whole paper, skipping proofs; study every figure</text>
<text x="320.0" y="192.0" font-size="13" fill="#2563eb" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">about 10 papers</text>
<polygon points="130.0,220 510.0,220 480.0,308 160.0,308" fill="#fef3c7" stroke="#1f2933" stroke-width="1.4"/>
<text x="320.0" y="246.0" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">Pass 3: the deep dive  ·  several hours</text>
<text x="320.0" y="268.0" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">rebuild it yourself; challenge every choice</text>
<text x="320.0" y="292.0" font-size="13" fill="#2563eb" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">about 3 papers</text>
</svg>
