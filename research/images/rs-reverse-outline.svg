<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 285" width="680" height="285" role="img">
<title>A reverse outline of a discussion section. Each paragraph is reduced to its first sentence, listed in order: we measured three apps for 28 days; the best app beat a simple guess but not by more than luck; the gauge was read at 7 am so some rain landed on the wrong day; rain is very important in Lagos for many reasons; a longer study would settle the question. Four of them form an argument, but the fourth is general background that does not move the argument on, so it is marked to cut or rewrite</title>
<rect width="100%" height="100%" rx="8" fill="#ffffff"/>
<text x="20.0" y="26.0" font-size="14" fill="#1f2933" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">first sentence of each paragraph, in order</text>
<rect x="20.0" y="42.0" width="640.0" height="34.0" fill="#f0fdf4" stroke="#059669" stroke-width="1" fill-opacity="1"/>
<text x="36.0" y="64.0" font-size="12.5" fill="#1f2933" text-anchor="start" font-weight="normal" font-family="system-ui, sans-serif">¶1  We measured three free apps against a home gauge for 28 days.</text>
<text x="648.0" y="64.0" font-size="11.5" fill="#059669" text-anchor="end" font-weight="bold" font-family="system-ui, sans-serif">moves the argument on</text>
<rect x="20.0" y="84.0" width="640.0" height="34.0" fill="#f0fdf4" stroke="#059669" stroke-width="1" fill-opacity="1"/>
<text x="36.0" y="106.0" font-size="12.5" fill="#1f2933" text-anchor="start" font-weight="normal" font-family="system-ui, sans-serif">¶2  The best app beat a simple guess, but not by more than luck allows.</text>
<text x="648.0" y="106.0" font-size="11.5" fill="#059669" text-anchor="end" font-weight="bold" font-family="system-ui, sans-serif">moves the argument on</text>
<rect x="20.0" y="126.0" width="640.0" height="34.0" fill="#f0fdf4" stroke="#059669" stroke-width="1" fill-opacity="1"/>
<text x="36.0" y="148.0" font-size="12.5" fill="#1f2933" text-anchor="start" font-weight="normal" font-family="system-ui, sans-serif">¶3  The gauge was read at 7 am, so some rain landed in the wrong day.</text>
<text x="648.0" y="148.0" font-size="11.5" fill="#059669" text-anchor="end" font-weight="bold" font-family="system-ui, sans-serif">moves the argument on</text>
<rect x="20.0" y="168.0" width="640.0" height="34.0" fill="#fef2f2" stroke="#dc2626" stroke-width="1" fill-opacity="1"/>
<text x="36.0" y="190.0" font-size="12.5" fill="#1f2933" text-anchor="start" font-weight="normal" font-family="system-ui, sans-serif">¶4  Rain is very important in Lagos for many reasons.</text>
<text x="648.0" y="190.0" font-size="11.5" fill="#dc2626" text-anchor="end" font-weight="bold" font-family="system-ui, sans-serif">cut or rewrite</text>
<rect x="20.0" y="210.0" width="640.0" height="34.0" fill="#f0fdf4" stroke="#059669" stroke-width="1" fill-opacity="1"/>
<text x="36.0" y="232.0" font-size="12.5" fill="#1f2933" text-anchor="start" font-weight="normal" font-family="system-ui, sans-serif">¶5  A longer study, across seasons, would settle the question.</text>
<text x="648.0" y="232.0" font-size="11.5" fill="#059669" text-anchor="end" font-weight="bold" font-family="system-ui, sans-serif">moves the argument on</text>
<text x="340.0" y="272.0" font-size="12.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">if the first sentences alone don't make an argument, fix the structure before the sentences</text>
</svg>
