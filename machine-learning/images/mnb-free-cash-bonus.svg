<text x="250.0" y="296.0" font-size="12" fill="#059669" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">Spam: 4 × 2 × 2 = 16  ·  Normal: 1 × 1 × 1 = 1  ·  Spam wins, 16 to 1</text>
