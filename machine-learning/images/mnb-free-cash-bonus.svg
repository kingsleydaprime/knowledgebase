<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 310" width="500" height="310" role="img">
<title>Word likelihoods for the email Free cash bonus, in 42nds: free is 4 out of 42 in Spam and 1 out of 42 in Normal; cash and bonus are 2 out of 42 in Spam and 1 out of 42 in Normal; multiplied together Spam scores 16 times higher than Normal</title>
