<text x="117.7" y="46.2" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">4/42</text>
<rect x="140.7" y="185.6" width="30.0" height="44.4" fill="#3b82f6" stroke="none" stroke-width="1" fill-opacity="1"/>
<text x="155.7" y="179.6" font-size="11" fill="#3b82f6" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">1/42</text>
<text x="136.7" y="246.0" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">"free"</text>
