<line x1="70.0" y1="230.0" x2="470.0" y2="230.0" stroke="#1f2933" stroke-width="1.2"/>
<line x1="70.0" y1="30.0" x2="70.0" y2="230.0" stroke="#1f2933" stroke-width="1.2"/>
<text x="270.0" y="264.0" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">word in the new email</text>
<text x="32.0" y="130.0" font-size="12" fill="#1f2933" text-anchor="middle" font-family="system-ui, sans-serif" transform="rotate(-90 32.0 130.0)">P(word | class) × 42</text>
