<text x="270.0" y="246.0" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">"cash"</text>
<rect x="369.3" y="141.1" width="30.0" height="88.9" fill="#dc2626" stroke="none" stroke-width="1" fill-opacity="1"/>
